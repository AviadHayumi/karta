#
# Smoke test for the Karta install. The root GVK is a built-in on purpose: CRDExists is
# satisfied without a backing CRD, so this reaches Ready on a base-only cluster.
kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: karta-smoke
spec:
  structureDefinition:
    rootComponent:
      name: deployment
      kind:
        group: apps
        version: v1
        kind: Deployment
      specDefinition:
        podTemplateSpecPath: .spec.template
      scaleDefinition:
        replicasPath: .spec.replicas // 1
