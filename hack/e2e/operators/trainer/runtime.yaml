#
# A minimal ClusterTrainingRuntime the e2e flows reference: one node, busybox, no GPU. The
# TrainJob karta reads this runtime through its trainingRuntime reference, so the flows also
# exercise reference capture in the recorder.
apiVersion: trainer.kubeflow.org/v1alpha1
kind: ClusterTrainingRuntime
metadata:
  name: karta-busybox
spec:
  mlPolicy:
    numNodes: 1
    torch: {}
  template:
    spec:
      replicatedJobs:
        - name: node
          template:
            metadata:
              labels:
                trainer.kubeflow.org/trainjob-ancestor-step: trainer
            spec:
              template:
                spec:
                  restartPolicy: Never
                  containers:
                    - name: node
                      image: busybox:1.36
                      command: ["sh", "-c", "sleep 2"]
                      resources:
                        requests:
                          cpu: 10m
                          memory: 16Mi
