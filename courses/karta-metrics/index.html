const COURSE_DATA={"lessons":[{"id":1,"module":"1 / Start from zero","title":"What am I looking at?","goal":"Meet the Pod, the workload, the exporter, and Prometheus.","markdown":"A metric is a named measurement. Your output is a snapshot of what the Karta exporter currently knows about Kubernetes workloads and their pods.\n\nA Pod runs one or more containers. A workload object describes an application or job and the state its controller should maintain. A Deployment is one workload kind. DynamoGraphDeployment is another, defined through a custom Kubernetes API. Its controller can create other objects, including Deployments, which eventually create pods.\n\nA Karta definition is a description of how to interpret a workload kind: where its components, replica counts, and statuses live. The exporter uses those definitions to translate different workload shapes into the same metric names.\n\n#### Four actors, four jobs\n\n| Actor | Job |\n|---|---|\n| Kubernetes controllers | Create and update workload objects and pods |\n| Karta exporter | Watch objects, interpret them, and expose measurements over HTTP |\n| Prometheus | Repeatedly fetch measurements and store timestamped samples |\n| Grafana, if installed | Query Prometheus and display charts |\n\n```mermaid\nflowchart LR\n  A[\"Kubernetes objects\"] --\u003e|\"watch events\"| B[\"Karta exporter cache\"]\n  B --\u003e|\"HTTP /metrics response\"| C[\"Prometheus\"]\n  C --\u003e|\"queries\"| D[\"Charts and alerts\"]\n```\n\n#### Worked example\n\nStart: the exporter has observed two running pods belonging to `dynamo-smoke`. Operation: your `curl` asks it for `/metrics`. Result: the exporter renders its current measurements as text. That request does not create, scale, or restart anything.\n\nPrometheus can make the same request repeatedly. For example, scrapes at 10:00, 10:01, and 10:02 could record pod counts `1, 2, 1`. Your one pasted response contains the current values, without that history. The one-minute interval here is an example, not a detected setting.\n\nVerified implementation: [exporter/pkg/server/server.go:23](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).","html":"\u003cp\u003eA metric is a named measurement. Your output is a snapshot of what the Karta exporter currently knows about Kubernetes workloads and their pods.\u003c/p\u003e\n\u003cp\u003eA Pod runs one or more containers. A workload object describes an application or job and the state its controller should maintain. A Deployment is one workload kind. DynamoGraphDeployment is another, defined through a custom Kubernetes API. Its controller can create other objects, including Deployments, which eventually create pods.\u003c/p\u003e\n\u003cp\u003eA Karta definition is a description of how to interpret a workload kind: where its components, replica counts, and statuses live. The exporter uses those definitions to translate different workload shapes into the same metric names.\u003c/p\u003e\n\u003ch4 id=\"four-actors-four-jobs\"\u003eFour actors, four jobs\u003c/h4\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 50%\"\u003e\n\u003ccol style=\"width: 50%\"\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eActor\u003c/th\u003e\n\u003cth\u003eJob\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eKubernetes controllers\u003c/td\u003e\n\u003ctd\u003eCreate and update workload objects and pods\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eKarta exporter\u003c/td\u003e\n\u003ctd\u003eWatch objects, interpret them, and expose measurements over HTTP\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003ePrometheus\u003c/td\u003e\n\u003ctd\u003eRepeatedly fetch measurements and store timestamped samples\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eGrafana, if installed\u003c/td\u003e\n\u003ctd\u003eQuery Prometheus and display charts\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cdiv class=\"mermaid\"\u003e\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 1054.125 58.1875\" style=\"max-width: 1054.125px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"diagram-1-0\"\u003e\u003cstyle\u003e#diagram-1-0{font-family:system-ui;font-size:16px;fill:#1c2c29;}#diagram-1-0 .error-icon{fill:hsl(276, 29.4117647059%, 98.3333333333%);}#diagram-1-0 .error-text{fill:rgb(4.0000000001, 5.5000000001, 3.0000000001);stroke:rgb(4.0000000001, 5.5000000001, 3.0000000001);}#diagram-1-0 .edge-thickness-normal{stroke-width:2px;}#diagram-1-0 .edge-thickness-thick{stroke-width:3.5px;}#diagram-1-0 .edge-pattern-solid{stroke-dasharray:0;}#diagram-1-0 .edge-pattern-dashed{stroke-dasharray:3;}#diagram-1-0 .edge-pattern-dotted{stroke-dasharray:2;}#diagram-1-0 .marker{fill:#486054;stroke:#486054;}#diagram-1-0 .marker.cross{stroke:#486054;}#diagram-1-0 svg{font-family:system-ui;font-size:16px;}#diagram-1-0 .label{font-family:system-ui;color:#1c2c29;}#diagram-1-0 .cluster-label text{fill:rgb(4.0000000001, 5.5000000001, 3.0000000001);}#diagram-1-0 .cluster-label span,#diagram-1-0 p{color:rgb(4.0000000001, 5.5000000001, 3.0000000001);}#diagram-1-0 .label text,#diagram-1-0 span,#diagram-1-0 p{fill:#1c2c29;color:#1c2c29;}#diagram-1-0 .node rect,#diagram-1-0 .node circle,#diagram-1-0 .node ellipse,#diagram-1-0 .node polygon,#diagram-1-0 .node path{fill:#edf3e9;stroke:#8fac7d;stroke-width:1px;}#diagram-1-0 .flowchart-label text{text-anchor:middle;}#diagram-1-0 .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#diagram-1-0 .node .label{text-align:center;}#diagram-1-0 .node.clickable{cursor:pointer;}#diagram-1-0 .arrowheadPath{fill:#0 pan\u003e\u003c/div\u003e\u003c/foreignObject\u003e\u003c/g\u003e\u003c/g\u003e\u003c/g\u003e\u003cg class=\"nodes\"\u003e\u003cg transform=\"translate(77.8125, 21.09375)\" data-id=\"A\" data-node=\"true\" id=\"flowchart-A-0\" class=\"node default default flowchart-label\"\u003e\u003crect height=\"42.1875\" width=\"155.625\" y=\"-21.09375\" x=\"-77.8125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"\u003e\u003c/rect\u003e\u003cg transform=\"translate(-70.3125, -13.59375)\" style=\"\" class=\"label\"\u003e\u003crect\u003e\u003c/rect\u003e\u003cforeignObject height=\"27.1875\" width=\"140.625\"\u003e\u003cdiv style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"\u003e\u003cspan class=\"nodeLabel\"\u003eKubernetes objects\u003c/span\u003e\u003c/div\u003e\u003c/foreignObject\u003e\u003c/g\u003e\u003c/g\u003e\u003cg transform=\"translate(384.6640625, 21.09375)\" data-id=\"B\" data-node=\"true\" id=\"flowchart-B-1\" class=\"node default default flowchart-label\"\u003e\u003crect height=\"42.1875\" width=\"166.765625\" y=\"-21.09375\" x=\"-83.3828125\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"\u003e\u003c/rect\u003e\u003cg transform=\"translate(-75.8828125, -13.59375)\" style=\"\" class=\"label\"\u003e\u003crect\u003e\u003c/rect\u003e\u003cforeignObject height=\"27.1875\" width=\"151.765625\"\u003e\u003cdiv style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"\u003e\u003cspan class=\"nodeLabel\"\u003eKarta exporter cache\u003c/span\u003e\u003c/div\u003e\u003c/foreignObject\u003e\u003c/g\u003e\u003c/g\u003e\u003cg transform=\"translate(744.3125, 21.09375)\" data-id=\"C\" data-node=\"true\" id=\"flowchart-C-3\" class=\"node default default flowchart-label\"\u003e\u003crect height=\"42.1875\" width=\"102.5\" y=\"-21.09375\" x=\"-51.25\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"\u003e\u003c/rect\u003e\u003cg transform=\"translate(-43.75, -13.59375)\" style=\"\" class=\"label\"\u003e\u003crect\u003e\u003c/rect\u003e\u003cforeignObject height=\"27.1875\" width=\"87.5\"\u003e\u003cdiv style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"\u003e\u003cspan class=\"nodeLabel\"\u003ePrometheus\u003c/span\u003e\u003c/div\u003e\u003c/foreignObject\u003e\u003c/g\u003e\u003c/g\u003e\u003cg transform=\"translate(968.6484375, 21.09375)\" data-id=\"D\" data-node=\"true\" id=\"flowchart-D-5\" class=\"node default default flowchart-label\"\u003e\u003crect height=\"42.1875\" width=\"138.953125\" y=\"-21.09375\" x=\"-69.4765625\" ry=\"0\" rx=\"0\" style=\"\" class=\"basic label-container\"\u003e\u003c/rect\u003e\u003cg transform=\"translate(-61.9765625, -13.59375)\" style=\"\" class=\"label\"\u003e\u003crect\u003e\u003c/rect\u003e\u003cforeignObject height=\"27.1875\" width=\"123.953125\"\u003e\u003cdiv style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"\u003e\u003cspan class=\"nodeLabel\"\u003eCharts and alerts\u003c/span\u003e\u003c/div\u003e\u003c/foreignObject\u003e\u003c/g\u003e\u003c/g\u003e\u003c/g\u003e\u003c/g\u003e\u003c/g\u003e\u003c/svg\u003e\u003c/div\u003e\n\u003ch4 id=\"worked-example\"\u003eWorked example\u003c/h4\u003e\n\u003cp\u003eStart: the exporter has observed two running pods belonging to \u003ccode\u003edynamo-smoke\u003c/code\u003e. Operation: your \u003ccode\u003ecurl\u003c/code\u003e asks it for \u003ccode\u003e/metrics\u003c/code\u003e. Result: the exporter renders its current measurements as text. That request does not create, scale, or restart anything.\u003c/p\u003e\n\u003cp\u003ePrometheus can make the same request repeatedly. For example, scrapes at 10:00, 10:01, and 10:02 could record pod counts \u003ccode\u003e1, 2, 1\u003c/code\u003e. Your one pasted response contains the current values, without that history. The one-minute interval here is an example, not a detected setting.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/server/server.go:23\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/collector/collector.go:76\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"exporter/pkg/server/server.go","line":23,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23","text":"\nfunc New(addr string, gatherer prometheus.Gatherer, ready func() bool) *Server {\n\tmux := http.NewServeMux()\n\tmetricsHandler := promhttp.HandlerFor(gatherer, promhttp.HandlerOpts{})\n\teverReady := false\n\tmux.HandleFunc(\"/metrics\", func(w http.ResponseWriter, r *http.Request) {\n\t\t// a half-built store must fail the scrape visibly, not serve\n\t\t// plausible zeros; once synced, keep serving forever\n\t\tif !everReady {\n\t\t\tif !ready() {\n\t\t\t\tw.WriteHeader(http.StatusServiceUnavailable)\n\t\t\t\treturn\n\t\t\t}\n\t\t\teverReady = true\n\t\t}\n\t\tmetricsHandler.ServeHTTP(w, r)\n\t})\n\tmux.HandleFunc(\"/healthz\", func(w http.ResponseWriter, _ *http.Request) {\n\t\tw.WriteHeader(http.StatusOK)\n\t})\n\tmux.HandleFunc(\"/readyz\", func(w http.ResponseWriter, _ *http.Request) {\n\t\tif ready() {\n\t\t\tw.WriteHeader(http.StatusOK)\n\t\t\treturn\n\t\t}\n\t\tw.WriteHeader(http.StatusServiceUnavailable)\n\t})"},{"path":"exporter/pkg/collector/collector.go","line":76,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76","text":"\tch \u003c- c.componentReplicasDesc\n\tch \u003c- c.componentPodsDesc\n\tch \u003c- c.generationDesc\n\tch \u003c- c.workloadsDesc\n\tch \u003c- c.unattributedDesc\n\tch \u003c- c.kartasDesc\n}\n\nfunc (c *Collector) Collect(ch chan\u003c- prometheus.Metric) {\n\tsnapshot := c.store.Snapshot()\n\n\tfor _, pod := range snapshot.Pods {\n\t\tch \u003c- prometheus.MustNewConstMetric(c.podInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tpod.Namespace, pod.Name, string(pod.UID),\n\t\t\tpod.Workload.Name, pod.Workload.Kind, pod.Workload.Group,\n\t\t\tpod.Component, pod.Instance, pod.Replica)\n\t}\n\n\tfor _, workload := range snapshot.Workloads {\n\t\tref := workload.Ref\n\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, ref.Version, workload.Karta)\n\t\tch \u003c- prometheus.MustNewConstMetric(c.generationDesc, prometheus.GaugeValue, float64(workload.Generation),\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group)\n\n\t\tif workload.HasStatus {\n\t\t\tmatched := make(map[string]struct{}, len(workload.Phases))\n\t\t\tfor _, phase := range workload.Phases {\n\t\t\t\tmatched[string(phase)] = struct{}{}\n\t\t\t}\n\t\t\tfor _, phase := range AllPhases {\n\t\t\t\tvalue := 0.0\n\t\t\t\tif _, ok := matched[string(phase)]; ok {\n\t\t\t\t\tvalue = 1.0\n\t\t\t\t}\n\t\t\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadStatusDesc, prometheus.GaugeValue, value,\n\t\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, string(phase))\n\t\t\t}\n\t\t}\n\n\t\tfor _, component := range workload.Components {\n\t\t\tif component.Replicas == nil {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentReplicasDesc, prometheus.GaugeValue, float64(*component.Replicas),"}],"questions":[{"type":"choice","prompt":"You refresh /metrics five times. What happens to desired replicas?","options":["They increase by five","The requests only read exporter state","They reset to zero"],"answer":1,"hint":"Who owns the desired state?","explanation":"Reading metrics does not change the workload specification.","wrong":{"0":"A scrape is an HTTP read, not a scale request.","2":"The exporter does not reset replica counts when read."},"id":"metrics-l1-q1-v1"},{"type":"text","prompt":"At three scrape times a pod-count series reads 4, 2, 3. What is the last observed count?","answer":3,"hint":"Read the last sample; do not add the samples.","explanation":"The samples are successive observations of the same quantity. The last count is 3.","id":"metrics-l1-q2-v1"}],"stretch":"Could a short-lived pod appear and disappear between two scrapes? What would that imply about using a chart as an event log?"},{"id":2,"module":"1 / Start from zero","title":"Read one metric line","goal":"Separate the metric name, labels, and numeric value.","markdown":"This is a shortened teaching row. The real exporter includes more identity labels.\n\n```text\nkarta_workload_component_pods{workload=\"dynamo-smoke\",component_instance=\"decode\",phase=\"Running\"} 1\n```\n\n| Part | Read it as |\n|---|---|\n| `karta_workload_component_pods` | What is measured: observed pod count |\n| `{ ... }` | Labels that identify which count |\n| `workload=\"dynamo-smoke\"` | Select this workload |\n| `component_instance=\"decode\"` | Select its decode component instance |\n| `phase=\"Running\"` | Count pods in this phase |\n| Trailing `1` | The numeric measurement: one pod |\n\nA family groups related measurements under one metric name. A time series has a metric name and a specific label set. Changing `phase` from `Running` to `Pending` selects another series. It does not change the type. Prometheus stores successive timestamped samples for each series. See the [Prometheus data model](https://prometheus.io/docs/concepts/data_model/).\n\n#### Worked example\n\nStart: decode has one Running pod and no Pending pods. Result: two distinct rows read Running `1` and Pending `0`. They are two measurements, not two pods.\n\nThe response can also contain metadata:\n\n```text\n# HELP karta_workload_component_replicas Desired replicas per component instance, from the workload spec.\n# TYPE karta_workload_component_replicas gauge\n```\n\n`HELP` describes the family; `TYPE` declares its metric type. These lines are not samples. Your first `grep 'dynamo-smoke'` removes them because they have no workload labels. The pasted excerpt contains no HELP/TYPE output, so their declarations here were checked in code. See [Prometheus exposition format](https://prometheus.io/docs/instrumenting/exposition_formats/).\n\nUnderscores are literal `_`. The `\\_` spelling in your chat paste is Markdown escaping, not part of the metric name.\n\nVerified implementation: [exporter/pkg/collector/collector.go:34](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L34), [exporter/pkg/collector/collector_test.go:16](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector_test.go#L16).","html":"\u003cp\u003eThis is a shortened teaching row. The real exporter includes more identity labels.\u003c/p\u003e\n\u003cpre class=\"text\"\u003e\u003ccode\u003ekarta_workload_component_pods{workload=\u0026quot;dynamo-smoke\u0026quot;,component_instance=\u0026quot;decode\u0026quot;,phase=\u0026quot;Running\u0026quot;} 1\u003c/code\u003e\u003c/pre\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 50%\" /\u003e\n\u003ccol style=\"width: 50%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePart\u003c/th\u003e\n\u003cth\u003eRead it as\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_workload_component_pods\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWhat is measured: observed pod count\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003e{ ... }\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLabels that identify which count\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworkload=\"dynamo-smoke\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSelect this workload\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecomponent_instance=\"decode\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eSelect its decode component instance\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase=\"Running\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCount pods in this phase\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eTrailing \u003ccode\u003e1\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eThe numeric measurement: one pod\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eA family groups related measurements under one metric name. A time series has a metric name and a specific label set. Changing \u003ccode\u003ephase\u003c/code\u003e from \u003ccode\u003eRunning\u003c/code\u003e to \u003ccode\u003ePending\u003c/code\u003e selects another series. It does not change the type. Prometheus stores successive timestamped samples for each series. See the \u003ca href=\"https://prometheus.io/docs/concepts/data_model/\"\u003ePrometheus data model\u003c/a\u003e.\u003c/p\u003e\n\u003ch4 id=\"worked-example\"\u003eWorked example\u003c/h4\u003e\n\u003cp\u003eStart: decode has one Running pod and no Pending pods. Result: two distinct rows read Running \u003ccode\u003e1\u003c/code\u003e and Pending \u003ccode\u003e0\u003c/code\u003e. They are two measurements, not two pods.\u003c/p\u003e\n\u003cp\u003eThe response can also contain metadata:\u003c/p\u003e\n\u003cpre class=\"text\"\u003e\u003ccode\u003e# HELP karta_workload_component_replicas Desired replicas per component instance, from the workload spec.\n# TYPE karta_workload_component_replicas gauge\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eHELP\u003c/code\u003e describes the family; \u003ccode\u003eTYPE\u003c/code\u003e declares its metric type. These lines are not samples. Your first \u003ccode\u003egrep 'dynamo-smoke'\u003c/code\u003e removes them because they have no workload labels. The pasted excerpt contains no HELP/TYPE output, so their declarations here were checked in code. See \u003ca href=\"https://prometheus.io/docs/instrumenting/exposition_formats/\"\u003ePrometheus exposition format\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eUnderscores are literal \u003ccode\u003e_\u003c/code\u003e. The \u003ccode\u003e\\_\u003c/code\u003e spelling in your chat paste is Markdown escaping, not part of the metric name.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L34\"\u003eexporter/pkg/collector/collector.go:34\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector_test.go#L16\"\u003eexporter/pkg/collector/collector_test.go:16\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"exporter/pkg/collector/collector.go","line":34,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L34","text":"\tcomponentPodsDesc     *prometheus.Desc\n\tgenerationDesc        *prometheus.Desc\n\tworkloadsDesc         *prometheus.Desc\n\tunattributedDesc      *prometheus.Desc\n\tkartasDesc            *prometheus.Desc\n}\n\nfunc New(s *store.Store, options Options) *Collector {\n\treturn \u0026Collector{\n\t\tstore:   s,\n\t\toptions: options,\n\t\tpodInfoDesc: prometheus.NewDesc(MetricPodWorkloadInfo,\n\t\t\t\"Pod to workload, component, and component instance attribution derived from the Karta definition. Value is always 1.\",\n\t\t\t[]string{LabelNamespace, LabelPod, LabelUID, LabelWorkload, LabelWorkloadKind, LabelWorkloadGroup, LabelComponent, LabelComponentInstance, LabelReplica}, nil),\n\t\tworkloadInfoDesc: prometheus.NewDesc(MetricWorkloadInfo,\n\t\t\t\"Identity and provenance of a Karta-described workload. Value is always 1.\",\n\t\t\tappend(append([]string{}, workloadLabels...), LabelWorkloadVersion, LabelKarta), nil),\n\t\tworkloadStatusDesc: prometheus.NewDesc(MetricWorkloadStatus,\n\t\t\t\"Normalized workload status. One series per phase; several phases can be 1 at the same time.\",\n\t\t\tappend(append([]string{}, workloadLabels...), LabelPhase), nil),\n\t\tcomponentReplicasDesc: prometheus.NewDesc(MetricComponentReplicas,\n\t\t\t\"Desired replicas per component instance, from the workload spec.\",\n\t\t\tappend(append([]string{}, workloadLabels...), LabelComponent, LabelComponentInstance), nil),\n\t\tcomponentPodsDesc: prometheus.NewDesc(MetricComponentPods,\n\t\t\t\"Observed pod count per component instance, broken down by pod phase.\",\n\t\t\tappend(append([]string{}, workloadLabels...), LabelComponent, LabelComponentInstance, LabelPhase), nil),\n\t\tgenerationDesc: prometheus.NewDesc(MetricWorkloadGeneration,\n\t\t\t\"The workload's metadata.generation. A step change marks a spec change.\",\n\t\t\tworkloadLabels, nil),\n\t\tworkloadsDesc: prometheus.NewDesc(MetricExporterWorkloads,\n\t\t\t\"Number of Karta-described workloads currently tracked.\", nil, nil),\n\t\tunattributedDesc: prometheus.NewDesc(MetricExporterUnattributedPods,"},{"path":"exporter/pkg/collector/collector_test.go","line":16,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector_test.go#L16","text":"\n\t\"github.com/dsx-ai-factory/workload-map/exporter/pkg/store\"\n)\n\n// goldenContract is the label-contract regression gate: any change to metric\n// names, label names, or series shape fails this test visibly.\nconst goldenContract = `# HELP karta_pod_workload_info Pod to workload, component, and component instance attribution derived from the Karta definition. Value is always 1.\n# TYPE karta_pod_workload_info gauge\nkarta_pod_workload_info{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",pod=\"decode-0\",replica=\"\",uid=\"p2\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_pod_workload_info{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",pod=\"prefill-0\",replica=\"\",uid=\"p1\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\n# HELP karta_workload_component_pods Observed pod count per component instance, broken down by pod phase.\n# TYPE karta_workload_component_pods gauge\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Failed\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Pending\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Running\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Succeeded\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Unknown\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Failed\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Pending\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Running\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Succeeded\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Unknown\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\n# HELP karta_workload_component_replicas Desired replicas per component instance, from the workload spec.\n# TYPE karta_workload_component_replicas gauge\nkarta_workload_component_replicas{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_workload_component_replicas{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 2\n# HELP karta_workload_generation The workload's metadata.generation. A step change marks a spec change.\n# TYPE karta_workload_generation gauge\nkarta_workload_generation{namespace=\"team-a\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 3\n# HELP karta_workload_info Identity and provenance of a Karta-described workload. Value is always 1.\n# TYPE karta_workload_info gauge\nkarta_workload_info{karta=\"jobset-x-k8s-io-jobset-v1alpha2\",namespace=\"team-a\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\",workload_version=\"v1alpha2\"} 1\n# HELP karta_workload_status Normalized workload status. One series per phase; several phases can be 1 at the same time.\n# TYPE karta_workload_status gauge\nkarta_workload_status{namespace=\"team-a\",phase=\"Completed\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Degraded\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Failed\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Initializing\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Resuming\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Running\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_workload_status{namespace=\"team-a\",phase=\"Suspended\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Suspending\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Undefined\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\n`\n\nfunc fixtureStore() *store.Store {\n\ts := store.New()\n\tref := store.WorkloadRef{Namespace: \"team-a\", Name: \"llm\", Group: \"jobset.x-k8s.io\", Version: \"v1alpha2\", Kind: \"JobSet\"}\n\n\ts.UpsertWorkload(store.WorkloadRecord{\n\t\tUID:        \"w1\",\n\t\tRef:        ref,\n\t\tKarta:      \"jobset-x-k8s-io-jobset-v1alpha2\","}],"questions":[{"type":"text","prompt":"This row ends with 7: karta_workload_component_pods{phase=\"Pending\"} 7. What is its sample value?","answer":7,"hint":"The value is outside the braces.","explanation":"The measurement is 7; Pending is a label value.","id":"metrics-l2-q1-v1"},{"type":"choice","prompt":"Changing only component_instance=\"decode\" to component_instance=\"prefill\" creates what?","options":["A different metric type","The same series with a comment","A different time series"],"answer":2,"hint":"Labels identify the particular measurement.","explanation":"A different label set identifies a different series.","wrong":{"0":"Labels do not determine counter versus gauge.","1":"Labels are part of identity, not comments."},"id":"metrics-l2-q2-v1"}],"stretch":"Why would counting the lines containing a workload name give a misleading pod count?"},{"id":3,"module":"1 / Start from zero","title":"Gauges, counters, histograms, summaries","goal":"Learn metric types, then classify all six families in your paste.","markdown":"A type describes how to interpret a measurement over time.\n\n| Type | Meaning | Example |\n|---|---|---|\n| Gauge | Current numeric value; may rise or fall | Current pods: 2, then 1 |\n| Counter | Accumulated events; rises, except resets such as process restarts | Attribution errors: 5, then 6 |\n| Histogram | Distribution of observations, commonly expressed through buckets, count, and sum | Request durations grouped by thresholds |\n| Summary | Observation count and sum, with optional client-calculated quantiles | An estimated request-duration percentile |\n\nHistogram and summary examples describe general Prometheus instrumentation. None of your six pasted families is either type. The exporter constructs all six using `prometheus.GaugeValue`. An `_info` suffix does not turn these particular metrics into a fifth Prometheus text type. See [Prometheus metric types](https://prometheus.io/docs/concepts/metric_types/).\n\n\u003cdetails\u003e\n\u003csummary\u003eWorked examples of the other types\u003c/summary\u003e\n\nA counter could read 10 errors, then 13 errors: three additional error events occurred. A process restart may reset it to 0. Its value is not the number of pods currently in trouble.\n\nFor a histogram, imagine three request durations: 0.1, 0.4, and 0.8 seconds. A classic histogram bucket with upper bound 0.5 seconds contains 2 observations; a bucket with upper bound 1 second contains all 3. Buckets are cumulative, so adding these two bucket counts would count some requests twice. The count is 3 and the sum is 1.3 seconds.\n\nA quantile describes a position in a distribution. The 95th percentile estimates a threshold with about 95% of observations at or below it. A summary can calculate such estimates inside the instrumented process. A histogram can support percentile estimates from its buckets. Neither appears among your six workload families.\n\n\u003c/details\u003e\n\n#### The complete map\n\n| Family | Type | What the number means |\n|---|---|---|\n| `karta_pod_workload_info` | Gauge | Always 1 for a currently exported pod attribution |\n| `karta_workload_info` | Gauge | Always 1 for a tracked workload identity |\n| `karta_workload_status` | Gauge | 1 if this normalized status matches; 0 otherwise |\n| `karta_workload_component_replicas` | Gauge | Desired replica count from the Karta scale definition |\n| `karta_workload_component_pods` | Gauge | Observed attributed pods in this pod phase |\n| `karta_workload_generation` | Gauge | Current `metadata.generation` |\n\n#### Worked example\n\nStart: desired replicas are 3. Operation: someone scales the workload down to 1. Result: the replicas gauge becomes 1 after the exporter processes the update. A counter would be inappropriate for this current-state quantity.\n\nIn this branch, `karta_exporter_attribution_errors_total` is a real counter. `rate(counter[5m])` estimates events per second from a recent counter window and accounts for resets. Do not use that operation to interpret current pod counts as pod creations. See [rate documentation](https://prometheus.io/docs/prometheus/latest/querying/functions/#rate).\n\nVerified implementation: [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76), [exporter/pkg/controller/controller.go:102](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/controller.go#L102).","html":"\u003cp\u003eA type describes how to interpret a measurement over time.\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eType\u003c/th\u003e\n\u003cth\u003eMeaning\u003c/th\u003e\n\u003cth\u003eExample\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eCurrent numeric value; may rise or fall\u003c/td\u003e\n\u003ctd\u003eCurrent pods: 2, then 1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eCounter\u003c/td\u003e\n\u003ctd\u003eAccumulated events; rises, except resets such as process restarts\u003c/td\u003e\n\u003ctd\u003eAttribution errors: 5, then 6\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHistogram\u003c/td\u003e\n\u003ctd\u003eDistribution of observations, commonly expressed through buckets, count, and sum\u003c/td\u003e\n\u003ctd\u003eRequest durations grouped by thresholds\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eSummary\u003c/td\u003e\n\u003ctd\u003eObservation count and sum, with optional client-calculated quantiles\u003c/td\u003e\n\u003ctd\u003eAn estimated request-duration percentile\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eHistogram and summary examples describe general Prometheus instrumentation. None of your six pasted families is either type. The exporter constructs all six using \u003ccode\u003eprometheus.GaugeValue\u003c/code\u003e. An \u003ccode\u003e_info\u003c/code\u003e suffix does not turn these particular metrics into a fifth Prometheus text type. See \u003ca href=\"https://prometheus.io/docs/concepts/metric_types/\"\u003ePrometheus metric types\u003c/a\u003e.\u003c/p\u003e\n\u003cdetails\u003e\n\u003csummary\u003e\nWorked examples of the other types\n\u003c/summary\u003e\n\u003cp\u003eA counter could read 10 errors, then 13 errors: three additional error events occurred. A process restart may reset it to 0. Its value is not the number of pods currently in trouble.\u003c/p\u003e\n\u003cp\u003eFor a histogram, imagine three request durations: 0.1, 0.4, and 0.8 seconds. A classic histogram bucket with upper bound 0.5 seconds contains 2 observations; a bucket with upper bound 1 second contains all 3. Buckets are cumulative, so adding these two bucket counts would count some requests twice. The count is 3 and the sum is 1.3 seconds.\u003c/p\u003e\n\u003cp\u003eA quantile describes a position in a distribution. The 95th percentile estimates a threshold with about 95% of observations at or below it. A summary can calculate such estimates inside the instrumented process. A histogram can support percentile estimates from its buckets. Neither appears among your six workload families.\u003c/p\u003e\n\u003c/details\u003e\n\u003ch4 id=\"the-complete-map\"\u003eThe complete map\u003c/h4\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFamily\u003c/th\u003e\n\u003cth\u003eType\u003c/th\u003e\n\u003cth\u003eWhat the number means\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_pod_workload_info\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eAlways 1 for a currently exported pod attribution\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_workload_info\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eAlways 1 for a tracked workload identity\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_workload_status\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003e1 if this normalized status matches; 0 otherwise\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_workload_component_replicas\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eDesired replica count from the Karta scale definition\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_workload_component_pods\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eObserved attributed pods in this pod phase\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_workload_generation\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eCurrent \u003ccode\u003emetadata.generation\u003c/code\u003e\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch4 id=\"worked-example\"\u003eWorked example\u003c/h4\u003e\n\u003cp\u003eStart: desired replicas are 3. Operation: someone scales the workload down to 1. Result: the replicas gauge becomes 1 after the exporter processes the update. A counter would be inappropriate for this current-state quantity.\u003c/p\u003e\n\u003cp\u003eIn this branch, \u003ccode\u003ekarta_exporter_attribution_errors_total\u003c/code\u003e is a real counter. \u003ccode\u003erate(counter[5m])\u003c/code\u003e estimates events per second from a recent counter window and accounts for resets. Do not use that operation to interpret current pod counts as pod creations. See \u003ca href=\"https://prometheus.io/docs/prometheus/latest/querying/functions/#rate\"\u003erate documentation\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76\"\u003eexporter/pkg/collector/collector.go:76\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/controller.go#L102\"\u003eexporter/pkg/controller/controller.go:102\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"exporter/pkg/collector/collector.go","line":76,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76","text":"\tch \u003c- c.componentReplicasDesc\n\tch \u003c- c.componentPodsDesc\n\tch \u003c- c.generationDesc\n\tch \u003c- c.workloadsDesc\n\tch \u003c- c.unattributedDesc\n\tch \u003c- c.kartasDesc\n}\n\nfunc (c *Collector) Collect(ch chan\u003c- prometheus.Metric) {\n\tsnapshot := c.store.Snapshot()\n\n\tfor _, pod := range snapshot.Pods {\n\t\tch \u003c- prometheus.MustNewConstMetric(c.podInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tpod.Namespace, pod.Name, string(pod.UID),\n\t\t\tpod.Workload.Name, pod.Workload.Kind, pod.Workload.Group,\n\t\t\tpod.Component, pod.Instance, pod.Replica)\n\t}\n\n\tfor _, workload := range snapshot.Workloads {\n\t\tref := workload.Ref\n\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, ref.Version, workload.Karta)\n\t\tch \u003c- prometheus.MustNewConstMetric(c.generationDesc, prometheus.GaugeValue, float64(workload.Generation),\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group)\n\n\t\tif workload.HasStatus {\n\t\t\tmatched := make(map[string]struct{}, len(workload.Phases))\n\t\t\tfor _, phase := range workload.Phases {\n\t\t\t\tmatched[string(phase)] = struct{}{}\n\t\t\t}\n\t\t\tfor _, phase := range AllPhases {\n\t\t\t\tvalue := 0.0\n\t\t\t\tif _, ok := matched[string(phase)]; ok {\n\t\t\t\t\tvalue = 1.0\n\t\t\t\t}\n\t\t\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadStatusDesc, prometheus.GaugeValue, value,\n\t\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, string(phase))\n\t\t\t}\n\t\t}\n\n\t\tfor _, component := range workload.Components {\n\t\t\tif component.Replicas == nil {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentReplicasDesc, prometheus.GaugeValue, float64(*component.Replicas),"},{"path":"exporter/pkg/controller/controller.go","line":102,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/controller.go#L102","text":"\t\twatchers:       make(map[schema.GroupVersionKind]*watcher),\n\t\tattributionErrors: prometheus.NewCounterVec(prometheus.CounterOpts{\n\t\t\tName: collector.MetricExporterAttributionErrors,\n\t\t\tHelp: \"Attribution and status evaluation errors, by reason.\",\n\t\t}, []string{collector.LabelReason}),\n\t\tlastEvent: prometheus.NewGauge(prometheus.GaugeOpts{\n\t\t\tName: collector.MetricExporterLastEventSeconds,\n\t\t\tHelp: \"Unix timestamp of the last processed watch event. A freshness witness.\",\n\t\t}),\n\t}\n\tregisterer.MustRegister(controller.attributionErrors, controller.lastEvent)\n\treturn controller\n}\n\n// Ready reports whether all informers, including per-workload-kind watchers,"}],"questions":[{"type":"choice","prompt":"A desired-replicas metric changes from 8 to 3 after scaling down. Which type fits?","options":["Gauge","Counter","Histogram"],"answer":0,"hint":"The value describes current state and can decrease.","explanation":"A gauge represents the current desired count.","wrong":{"1":"A counter accumulates events; it does not track a requested size.","2":"A histogram describes a distribution of observations."},"id":"metrics-l3-q1-v1"},{"type":"choice","prompt":"Which number represents events accumulated by the exporter?","options":["karta_workload_generation","karta_workload_component_pods","karta_exporter_attribution_errors_total"],"answer":2,"hint":"Look for the instrument created as a counter, not just a rising value.","explanation":"The controller creates attribution_errors_total as a CounterVec.","wrong":{"0":"Generation is the object version indicator stored as a gauge.","1":"The pod metric is a current count, not historical creations."},"id":"metrics-l3-q2-v1"}],"stretch":"Why is a generation gauge still a gauge even though generation usually increases during the life of an object?"},{"id":4,"module":"2 / Decode your Dynamo example","title":"What do all these labels identify?","goal":"Distinguish workload kind, component, component instance, and replica.","markdown":"Read the labels as an address with progressively smaller scopes.\n\n| Label in your output | Meaning |\n|---|---|\n| `namespace=\"default\"` | Kubernetes namespace containing the object |\n| `workload=\"dynamo-smoke\"` | Workload object name |\n| `workload_group=\"nvidia.com\"` | API group, part of the workload type identity |\n| `workload_kind=\"DynamoGraphDeployment\"` | Kubernetes object kind |\n| `workload_version=\"v1beta1\"` | API version, present on workload info |\n| `karta=\"nvidia-com-dynamographdeployment-v1beta1\"` | Name of the Karta definition used |\n| `component=\"component\"` | Literal component name chosen by that Karta definition |\n| `component_instance=\"Frontend\"` or `\"decode\"` | A concrete entry in the workload's component list |\n| `pod` | Concrete pod name, present on pod info |\n| `uid` | Kubernetes UID of that pod, present on pod info |\n| `replica` | Optional grouping key extracted from pod labels, not a replica count |\n| `phase` | A normalized workload status OR a Kubernetes pod phase, depending on family |\n\n#### Worked example from the catalog\n\nThe Dynamo Karta declares a child component named `component`. Its instance expression reads `.spec.components[] | .name`. For a workload containing names `Frontend` and `decode`, there is one component definition with two instances.\n\nFor each pod, the definition reads the label `nvidia.com/dynamo-component` to match an instance. The exporter does not invent `Frontend` by splitting the pod's generated name.\n\n`Frontend` is case-sensitive. The catalog has a separate lowercase expression for gang-scheduling grouping; the metric attribution path does not apply that expression.\n\nThe replica selector checks Grove or LeaderWorkerSet grouping labels. `replica=\"\"` means no replica key was resolved on this pod. It does not mean zero desired replicas. An ordinary Deployment component can have `component_instance=\"\"` because it has no distinct named instances. A failed attribution can instead use the explicit sentinel `\u003cunknown\u003e`.\n\nThe catalog describes the checked branch. A cluster Karta may override it, so the labels alone cannot prove which expressions were installed in your cluster.\n\nVerified implementation: [docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15), [exporter/pkg/attribute/attributor.go:29](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L29), [exporter/pkg/attribute/attributor.go:113](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L113).","html":"\u003cp\u003eRead the labels as an address with progressively smaller scopes.\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 50%\" /\u003e\n\u003ccol style=\"width: 50%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eLabel in your output\u003c/th\u003e\n\u003cth\u003eMeaning\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003enamespace=\"default\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eKubernetes namespace containing the object\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworkload=\"dynamo-smoke\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eWorkload object name\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworkload_group=\"nvidia.com\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAPI group, part of the workload type identity\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworkload_kind=\"DynamoGraphDeployment\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eKubernetes object kind\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003eworkload_version=\"v1beta1\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eAPI version, present on workload info\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta=\"nvidia-com-dynamographdeployment-v1beta1\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eName of the Karta definition used\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecomponent=\"component\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eLiteral component name chosen by that Karta definition\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ecomponent_instance=\"Frontend\"\u003c/code\u003e or \u003ccode\u003e\"decode\"\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eA concrete entry in the workload\u2019s component list\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003epod\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eConcrete pod name, present on pod info\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003euid\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eKubernetes UID of that pod, present on pod info\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ereplica\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eOptional grouping key extracted from pod labels, not a replica count\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eA normalized workload status OR a Kubernetes pod phase, depending on family\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch4 id=\"worked-example-from-the-catalog\"\u003eWorked example from the catalog\u003c/h4\u003e\n\u003cp\u003eThe Dynamo Karta declares a child component named \u003ccode\u003ecomponent\u003c/code\u003e. Its instance expression reads \u003ccode\u003e.spec.components[] | .name\u003c/code\u003e. For a workload containing names \u003ccode\u003eFrontend\u003c/code\u003e and \u003ccode\u003edecode\u003c/code\u003e, there is one component definition with two instances.\u003c/p\u003e\n\u003cp\u003eFor each pod, the definition reads the label \u003ccode\u003envidia.com/dynamo-component\u003c/code\u003e to match an instance. The exporter does not invent \u003ccode\u003eFrontend\u003c/code\u003e by splitting the pod\u2019s generated name.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eFrontend\u003c/code\u003e is case-sensitive. The catalog has a separate lowercase expression for gang-scheduling grouping; the metric attribution path does not apply that expression.\u003c/p\u003e\n\u003cp\u003eThe replica selector checks Grove or LeaderWorkerSet grouping labels. \u003ccode\u003ereplica=\"\"\u003c/code\u003e means no replica key was resolved on this pod. It does not mean zero desired replicas. An ordinary Deployment component can have \u003ccode\u003ecomponent_instance=\"\"\u003c/code\u003e because it has no distinct named instances. A failed attribution can instead use the explicit sentinel \u003ccode\u003e\u0026lt;unknown\u0026gt;\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eThe catalog describes the checked branch. A cluster Karta may override it, so the labels alone cannot prove which expressions were installed in your cluster.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15\"\u003edocs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L29\"\u003eexporter/pkg/attribute/attributor.go:29\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L113\"\u003eexporter/pkg/attribute/attributor.go:113\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml","line":15,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15","text":"      statusDefinition:\n        phaseDefinition:\n          path: .status.state\n        statusMappings:\n          initializing:\n            - byPhase: initializing\n            - byPhase: pending\n          running:\n            - byPhase: successful\n          failed:\n            - byPhase: failed\n    childComponents:\n      - name: component\n        ownerRef: dynamographdeployment\n        specDefinition:\n          fragmentedPodSpecDefinition:\n            schedulerNamePath: .spec.components[] | .podTemplate.spec.schedulerName\n            labelsPath: .spec.components[] | .podTemplate.metadata.labels\n            annotationsPath: .spec.components[] | .podTemplate.metadata.annotations\n            resourceClaimsPath: .spec.components[] | .podTemplate.spec.resourceClaims\n            podAffinityPath: .spec.components[] | .podTemplate.spec.affinity.podAffinity\n            nodeAffinityPath: .spec.components[] | .podTemplate.spec.affinity.nodeAffinity\n            containerPath: .spec.components[] | .podTemplate.spec.containers[] | select(.name == \"main\")\n            priorityClassNamePath: .spec.components[] | .podTemplate.spec.priorityClassName\n            imagePath: .spec.components[] | .podTemplate.spec.containers[] | select(.name == \"main\") | .image\n        scaleDefinition:\n          replicasPath: .spec.components[] | (.replicas // 1) * (.multinode.nodeCount // 1)\n        instanceIdPath: .spec.components[] | .name\n        podSelector:\n          componentInstanceSelector:\n            idPath: .metadata.labels[\"nvidia.com/dynamo-component\"]\n          replicaSelector:"},{"path":"exporter/pkg/attribute/attributor.go","line":29,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L29","text":"\n// Attribute resolves which component, component instance, and replica of a\n// workload the given pod belongs to. All jq runs against the pod only: the\n// workload side is the instanceIDs map (component name to declared instance\n// ids), which the caller computes once per workload event, not per pod.\nfunc Attribute(ctx context.Context, pod *corev1.Pod, entry *registry.Entry, instanceIDs map[string][]string) Result {\n\tquerier := resource.NewPodQuerier(pod)\n\n\tcomponentName, err := instructions.InferPodComponent(ctx, querier, entry.Summary)\n\tif err != nil {\n\t\treturn Result{\n\t\t\tComponent: collector.SentinelUnknown,\n\t\t\tInstance:  collector.SentinelUnknown,\n\t\t\tReason:    collector.ReasonJQError,\n\t\t}\n\t}\n\n\tresult := Result{Component: componentName}\n\tdefinition := entry.Definitions[componentName]\n\tif definition == nil {\n\t\tresult.Instance = collector.SentinelUnknown\n\t\tresult.Reason = collector.ReasonUnknownInstance\n\t\treturn result\n\t}\n\n\tids := instanceIDs[componentName]\n\tif len(ids) == 0 \u0026\u0026 definition.PodSelector != nil \u0026\u0026 definition.PodSelector.ComponentInstanceSelector != nil {\n\t\tresult.Instance = collector.SentinelUnknown\n\t\tresult.Reason = collector.ReasonUnknownInstance\n\t\treturn result\n\t}\n\tif len(ids) \u003e 0 \u0026\u0026 ids[0] != \"\" \u0026\u0026 definition.PodSelector != nil {\n\t\tinstance, err := querier.GetMatchingInstanceId(ctx, definition.PodSelector.ComponentInstanceSelector, ids)\n\t\tswitch {\n\t\tcase err == nil:\n\t\t\tresult.Instance = instance\n\t\tcase errors.As(err, new(resource.InstanceNotFoundError)):\n\t\t\tresult.Instance = collector.SentinelUnknown\n\t\t\tresult.Reason = collector.ReasonUnknownInstance\n\t\tdefault:\n\t\t\tresult.Instance = collector.SentinelUnknown\n\t\t\tresult.Reason = collector.ReasonJQError\n\t\t}\n\t}\n\n\treplica, err := extractReplica(ctx, querier, entry, componentName)\n\tif err != nil \u0026\u0026 result.Reason == \"\" {\n\t\tresult.Reason = collector.ReasonJQError\n\t}\n\tresult.Replica = replica\n\n\treturn result\n}\n\n// InstanceIDs lists the declared instance ids per pod-producing component,\n// straight from the workload object. This is the once-per-workload-event\n// half of attribution.\nfunc InstanceIDs(ctx context.Context, entry *registry.Entry, workload resource.KubernetesObject) (map[string][]string, error) {\n\tfactory := resource.NewComponentFactoryFromObject(entry.Karta, workload)\n"},{"path":"exporter/pkg/attribute/attributor.go","line":113,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L113","text":"// extractReplica finds the nearest ReplicaSelector on the component or its\n// ancestors (descendants inherit the replica context from the ancestor that\n// defines it) and evaluates it against the pod.\nfunc extractReplica(ctx context.Context, querier *resource.PodQuerier, entry *registry.Entry, componentName string) (string, error) {\n\tcurrent := componentName\n\tfor current != \"\" {\n\t\tdefinition := entry.Definitions[current]\n\t\tif definition == nil {\n\t\t\treturn \"\", nil\n\t\t}\n\n\t\tif selector := definition.PodSelector; selector != nil \u0026\u0026 selector.ReplicaSelector != nil {\n\t\t\treplica, found, err := querier.ExtractReplicaKey(ctx, selector.ReplicaSelector)\n\t\t\tif err != nil {\n\t\t\t\treturn \"\", err\n\t\t\t}\n\t\t\tif found {\n\t\t\t\treturn replica, nil\n\t\t\t}\n\t\t\treturn \"\", nil\n\t\t}\n\n\t\tif definition.OwnerRef == nil {\n\t\t\treturn \"\", nil\n\t\t}\n\t\tcurrent = *definition.OwnerRef\n\t}\n\treturn \"\", nil\n}"}],"questions":[{"type":"choice","prompt":"A row has replica=\"\" and its component replicas gauge is 4. What does that mean?","options":["There are no pods","No replica grouping key was resolved; desired count is 4","The exporter cannot count to four"],"answer":1,"hint":"The label and the gauge answer different questions.","explanation":"The empty replica label is a grouping-key result, while the gauge reports desired size.","wrong":{"0":"An empty string is not the numeric value zero.","2":"There is no contradiction between a missing grouping key and a known count."},"id":"metrics-l4-q1-v1"},{"type":"text","prompt":"Which exact label value selects the frontend instance shown in your output? Type its case-sensitive name.","answer":"Frontend","hint":"Read the instance name exactly as emitted.","explanation":"Frontend is the emitted value; frontend selects a different value.","id":"metrics-l4-q2-v1"}],"stretch":"Why should a query include namespace, group, and kind when workload names can repeat?"},{"id":5,"module":"2 / Decode your Dynamo example","title":"Why do info metrics always equal 1?","goal":"Use the two info families as identity and relationship records.","markdown":"An info gauge packages useful labels into a numeric metric. Its value is 1 so the row can participate in counting and label-enrichment queries.\n\n`karta_workload_info` says: this workload is currently tracked, with this kind, API version, and Karta definition. In your output it describes three objects: the DynamoGraphDeployment and two Deployments.\n\n`karta_pod_workload_info` says: this pod has this exported relationship to a workload, component, and component instance. You have two such rows, both assigned to the DynamoGraphDeployment.\n\n#### Worked example\n\nStart: a pod called `decode-example` has UID `pod-a` and is attributed to decode. Result: one pod info series has `uid=\"pod-a\"`, the appropriate labels, and value 1.\n\nIf that pod is deleted, its row stops being emitted after the exporter processes deletion. If a new pod reuses the same name with UID `pod-b`, that identity produces a different series. The old history can remain in Prometheus.\n\n```text\nInformation carried by the labels:\nPod decode-example -\u003e workload dynamo-smoke -\u003e instance decode\n\nInformation carried by the value:\nThis attribution record is currently present: 1\n```\n\nThe `1` does not measure health, CPU, GPU utilization, readiness, or replica index. A failed pod can still have an info row equal to 1. Its phase is counted in the pod-count family.\n\nWorkload info describes tracked objects at multiple levels of the ownership hierarchy. Summing its three rows gives three workload objects, not three independent applications and not three pods. The distinction matters before building a dashboard.\n\nVerified implementation: [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).","html":"\u003cp\u003eAn info gauge packages useful labels into a numeric metric. Its value is 1 so the row can participate in counting and label-enrichment queries.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ekarta_workload_info\u003c/code\u003e says: this workload is currently tracked, with this kind, API version, and Karta definition. In your output it describes three objects: the DynamoGraphDeployment and two Deployments.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ekarta_pod_workload_info\u003c/code\u003e says: this pod has this exported relationship to a workload, component, and component instance. You have two such rows, both assigned to the DynamoGraphDeployment.\u003c/p\u003e\n\u003ch4 id=\"worked-example\"\u003eWorked example\u003c/h4\u003e\n\u003cp\u003eStart: a pod called \u003ccode\u003edecode-example\u003c/code\u003e has UID \u003ccode\u003epod-a\u003c/code\u003e and is attributed to decode. Result: one pod info series has \u003ccode\u003euid=\"pod-a\"\u003c/code\u003e, the appropriate labels, and value 1.\u003c/p\u003e\n\u003cp\u003eIf that pod is deleted, its row stops being emitted after the exporter processes deletion. If a new pod reuses the same name with UID \u003ccode\u003epod-b\u003c/code\u003e, that identity produces a different series. The old history can remain in Prometheus.\u003c/p\u003e\n\u003cpre class=\"text\"\u003e\u003ccode\u003eInformation carried by the labels:\nPod decode-example -\u0026gt; workload dynamo-smoke -\u0026gt; instance decode\n\nInformation carried by the value:\nThis attribution record is currently present: 1\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe \u003ccode\u003e1\u003c/code\u003e does not measure health, CPU, GPU utilization, readiness, or replica index. A failed pod can still have an info row equal to 1. Its phase is counted in the pod-count family.\u003c/p\u003e\n\u003cp\u003eWorkload info describes tracked objects at multiple levels of the ownership hierarchy. Summing its three rows gives three workload objects, not three independent applications and not three pods. The distinction matters before building a dashboard.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76\"\u003eexporter/pkg/collector/collector.go:76\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"exporter/pkg/collector/collector.go","line":76,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76","text":"\tch \u003c- c.componentReplicasDesc\n\tch \u003c- c.componentPodsDesc\n\tch \u003c- c.generationDesc\n\tch \u003c- c.workloadsDesc\n\tch \u003c- c.unattributedDesc\n\tch \u003c- c.kartasDesc\n}\n\nfunc (c *Collector) Collect(ch chan\u003c- prometheus.Metric) {\n\tsnapshot := c.store.Snapshot()\n\n\tfor _, pod := range snapshot.Pods {\n\t\tch \u003c- prometheus.MustNewConstMetric(c.podInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tpod.Namespace, pod.Name, string(pod.UID),\n\t\t\tpod.Workload.Name, pod.Workload.Kind, pod.Workload.Group,\n\t\t\tpod.Component, pod.Instance, pod.Replica)\n\t}\n\n\tfor _, workload := range snapshot.Workloads {\n\t\tref := workload.Ref\n\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, ref.Version, workload.Karta)\n\t\tch \u003c- prometheus.MustNewConstMetric(c.generationDesc, prometheus.GaugeValue, float64(workload.Generation),\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group)\n\n\t\tif workload.HasStatus {\n\t\t\tmatched := make(map[string]struct{}, len(workload.Phases))\n\t\t\tfor _, phase := range workload.Phases {\n\t\t\t\tmatched[string(phase)] = struct{}{}\n\t\t\t}\n\t\t\tfor _, phase := range AllPhases {\n\t\t\t\tvalue := 0.0\n\t\t\t\tif _, ok := matched[string(phase)]; ok {\n\t\t\t\t\tvalue = 1.0\n\t\t\t\t}\n\t\t\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadStatusDesc, prometheus.GaugeValue, value,\n\t\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, string(phase))\n\t\t\t}\n\t\t}\n\n\t\tfor _, component := range workload.Components {\n\t\t\tif component.Replicas == nil {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentReplicasDesc, prometheus.GaugeValue, float64(*component.Replicas),"}],"questions":[{"type":"choice","prompt":"A pod moves from Running to Failed but remains tracked. What happens to its info gauge?","options":["It remains 1","It becomes 0 because it failed","It changes to -1"],"answer":0,"hint":"Identity presence and health are different facts.","explanation":"The pod info value is always 1 while its attribution is emitted.","wrong":{"1":"Failure changes the phase count, not the presence value.","2":"The exporter does not use -1 as a failure encoding."},"id":"metrics-l5-q1-v1"},{"type":"text","prompt":"A snapshot has five workload-info records and two pod-info records. How many pod attribution records does it contain?","answer":2,"hint":"Count the pod-info family, not the workload-info family.","explanation":"Two pod-info rows represent two pod attribution records in this single-exporter snapshot.","id":"metrics-l5-q2-v1"}],"stretch":"Why would removing uid from pod info simplify some joins but blur deletion and recreation history?"},{"id":6,"module":"2 / Decode your Dynamo example","title":"Desired replicas versus observed pods","goal":"Read an intention and an observation side by side.","markdown":"The replicas gauge answers: how many replicas does this component instance request according to its Karta scale definition?\n\nThe pods gauge answers: how many pods has the exporter attributed to that instance, in each Kubernetes pod phase?\n\n#### Your current snapshot\n\n| Dynamo instance | Desired | Running pods | Pending pods | Failed pods |\n|---|---:|---:|---:|---:|\n| Frontend | 1 | 1 | 0 | 0 |\n| decode | 1 | 1 | 0 | 0 |\n\nThe exporter emits all five pod phases, including Succeeded and Unknown. Zero rows keep the phase counts explicit even when no attributed pod has that phase.\n\n#### Worked example: scale decode\n\nStart: desired 1, Running 1, Pending 0. Operation: a user changes the desired scale to 3. After the exporter observes that spec update, desired becomes 3. Existing pods do not multiply instantly. As pods appear, a later observation might be Running 1, Pending 2. Once all three run, Running becomes 3 and Pending becomes 0.\n\nThese are distinct snapshots, not guaranteed intermediate events. Open the Metrics lab tab to vary desired count and pod phases independently.\n\n#### A Dynamo-specific detail\n\nThe checked v1beta1 Karta defines desired count as:\n\n```jq\n.spec.components[] | (.replicas // 1) * (.multinode.nodeCount // 1)\n```\n\nFor one component with `replicas: 2` and `nodeCount: 3`, the emitted expectation is 6. In this expression `// 1` supplies the default when the optional value is null or absent. Never assume that a generic Karta replica value is a literal copy of a field called replicas.\n\nA Running pod is not necessarily Ready to receive traffic. Pod phases are coarse lifecycle categories. This metric does not count readiness conditions. See [Kubernetes Pod lifecycle](https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/).\n\nVerified implementation: [exporter/pkg/collector/collector.go:128](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128), [docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15).","html":"\u003cp\u003eThe replicas gauge answers: how many replicas does this component instance request according to its Karta scale definition?\u003c/p\u003e\n\u003cp\u003eThe pods gauge answers: how many pods has the exporter attributed to that instance, in each Kubernetes pod phase?\u003c/p\u003e\n\u003ch4 id=\"your-current-snapshot\"\u003eYour current snapshot\u003c/h4\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 15%\" /\u003e\n\u003ccol style=\"width: 21%\" /\u003e\n\u003ccol style=\"width: 21%\" /\u003e\n\u003ccol style=\"width: 21%\" /\u003e\n\u003ccol style=\"width: 21%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eDynamo instance\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eDesired\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eRunning pods\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003ePending pods\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eFailed pods\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eFrontend\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003edecode\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe exporter emits all five pod phases, including Succeeded and Unknown. Zero rows keep the phase counts explicit even when no attributed pod has that phase.\u003c/p\u003e\n\u003ch4 id=\"worked-example-scale-decode\"\u003eWorked example: scale decode\u003c/h4\u003e\n\u003cp\u003eStart: desired 1, Running 1, Pending 0. Operation: a user changes the desired scale to 3. After the exporter observes that spec update, desired becomes 3. Existing pods do not multiply instantly. As pods appear, a later observation might be Running 1, Pending 2. Once all three run, Running becomes 3 and Pending becomes 0.\u003c/p\u003e\n\u003cp\u003eThese are distinct snapshots, not guaranteed intermediate events. Open the Metrics lab tab to vary desired count and pod phases independently.\u003c/p\u003e\n\u003ch4 id=\"a-dynamo-specific-detail\"\u003eA Dynamo-specific detail\u003c/h4\u003e\n\u003cp\u003eThe checked v1beta1 Karta defines desired count as:\u003c/p\u003e\n\u003cpre class=\"jq\"\u003e\u003ccode\u003e.spec.components[] | (.replicas // 1) * (.multinode.nodeCount // 1)\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eFor one component with \u003ccode\u003ereplicas: 2\u003c/code\u003e and \u003ccode\u003enodeCount: 3\u003c/code\u003e, the emitted expectation is 6. In this expression \u003ccode\u003e// 1\u003c/code\u003e supplies the default when the optional value is null or absent. Never assume that a generic Karta replica value is a literal copy of a field called replicas.\u003c/p\u003e\n\u003cp\u003eA Running pod is not necessarily Ready to receive traffic. Pod phases are coarse lifecycle categories. This metric does not count readiness conditions. See \u003ca href=\"https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/\"\u003eKubernetes Pod lifecycle\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128\"\u003eexporter/pkg/collector/collector.go:128\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15\"\u003edocs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"exporter/pkg/collector/collector.go","line":128,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128","text":"\ntype componentKey struct {\n\tworkloadUID types.UID\n\tcomponent   string\n\tinstance    string\n}\n\n// collectComponentPods emits pod counts per component instance and pod phase.\n// The instance set is the union of instances declared by the workload spec\n// and instances observed on pods, zero-filled across all pod phases so\n// under-replication math never breaks on a missing series.\nfunc (c *Collector) collectComponentPods(ch chan\u003c- prometheus.Metric, snapshot store.Snapshot) {\n\trefs := make(map[types.UID]store.WorkloadRef, len(snapshot.Workloads))\n\tkeys := make(map[componentKey]struct{})\n\tcounts := make(map[componentKey]map[string]int)\n\n\tfor _, workload := range snapshot.Workloads {\n\t\trefs[workload.UID] = workload.Ref\n\t\tfor _, component := range workload.Components {\n\t\t\tkeys[componentKey{workload.UID, component.Component, component.Instance}] = struct{}{}\n\t\t}\n\t}\n\n\tfor _, pod := range snapshot.Pods {\n\t\tif _, ok := refs[pod.WorkloadUID]; !ok {\n\t\t\trefs[pod.WorkloadUID] = pod.Workload\n\t\t}\n\t\tkey := componentKey{pod.WorkloadUID, pod.Component, pod.Instance}\n\t\tkeys[key] = struct{}{}\n\t\tif counts[key] == nil {\n\t\t\tcounts[key] = make(map[string]int)\n\t\t}\n\t\tcounts[key][string(pod.Phase)]++\n\t}\n\n\tfor key := range keys {\n\t\tref := refs[key.workloadUID]\n\t\tfor _, phase := range AllPodPhases {\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentPodsDesc, prometheus.GaugeValue,\n\t\t\t\tfloat64(counts[key][string(phase)]),\n\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, key.component, key.instance, string(phase))\n\t\t}\n\t}"},{"path":"docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml","line":15,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15","text":"      statusDefinition:\n        phaseDefinition:\n          path: .status.state\n        statusMappings:\n          initializing:\n            - byPhase: initializing\n            - byPhase: pending\n          running:\n            - byPhase: successful\n          failed:\n            - byPhase: failed\n    childComponents:\n      - name: component\n        ownerRef: dynamographdeployment\n        specDefinition:\n          fragmentedPodSpecDefinition:\n            schedulerNamePath: .spec.components[] | .podTemplate.spec.schedulerName\n            labelsPath: .spec.components[] | .podTemplate.metadata.labels\n            annotationsPath: .spec.components[] | .podTemplate.metadata.annotations\n            resourceClaimsPath: .spec.components[] | .podTemplate.spec.resourceClaims\n            podAffinityPath: .spec.components[] | .podTemplate.spec.affinity.podAffinity\n            nodeAffinityPath: .spec.components[] | .podTemplate.spec.affinity.nodeAffinity\n            containerPath: .spec.components[] | .podTemplate.spec.containers[] | select(.name == \"main\")\n            priorityClassNamePath: .spec.components[] | .podTemplate.spec.priorityClassName\n            imagePath: .spec.components[] | .podTemplate.spec.containers[] | select(.name == \"main\") | .image\n        scaleDefinition:\n          replicasPath: .spec.components[] | (.replicas // 1) * (.multinode.nodeCount // 1)\n        instanceIdPath: .spec.components[] | .name\n        podSelector:\n          componentInstanceSelector:\n            idPath: .metadata.labels[\"nvidia.com/dynamo-component\"]\n          replicaSelector:"}],"questions":[{"type":"text","prompt":"For the checked Dynamo definition, replicas=3 and multinode.nodeCount=2 produce what desired count?","answer":6,"hint":"Multiply the two fields.","explanation":"The Karta expression returns 3 x 2 = 6.","id":"metrics-l6-q1-v1"},{"type":"choice","prompt":"Desired is 4, Running is 2, Pending is 2. Which statement follows?","options":["There are four Ready pods","Two more pods need to be created for the current desired count","Four attributed pods are observed, and two are Running"],"answer":2,"hint":"Running and Pending are different observed phases; neither gives readiness.","explanation":"There are four observed pods across these phases; only two are Running.","wrong":{"0":"Readiness is not exported in this family.","1":"The two Pending pods already exist; the counts alone do not require creating more."},"id":"metrics-l6-q2-v1"}],"stretch":"Why can summing all five phases be useful for inventory but misleading for available capacity?"},{"id":7,"module":"2 / Decode your Dynamo example","title":"What do the status zeros and ones mean?","goal":"Separate workload status flags from pod lifecycle counts.","markdown":"`karta_workload_status` evaluates the workload's own status using a Karta mapping. Each normalized status is emitted as a flag: 1 means its mapping matched; 0 means it did not.\n\nThis branch has nine normalized statuses: Initializing, Running, Completed, Failed, Degraded, Suspended, Suspending, Resuming, and Undefined.\n\n#### Worked example from the checked Dynamo catalog\n\nInput: the workload's `.status.state` is `successful`. The Karta maps that raw string to normalized `Running`. Output: `phase=\"Running\"` is 1; the other flags in your example are 0.\n\nThe pasted Running flag is consistent with that catalog mapping. Without reading your installed Karta and workload object, the raw `successful` value is an inference, not an observed fact.\n\n```text\nWorkload status:\n  Read workload status -\u003e apply Karta mappings -\u003e emit status flags\n\nComponent pod counts:\n  Read each attributed Pod's status.phase -\u003e count pods by phase\n```\n\nA workload Running flag of 1 does not mean it has exactly one pod. It does not come from summing the Running pod count.\n\nThe collector supports several workload statuses equal to 1 simultaneously when multiple mappings match. Your snapshot happens to have only Running active for each object. Do not assume every workload's flags always sum to 1.\n\nIf status mappings exist but none match, the builder uses Undefined. If a workload has no status definition, the exporter omits its status family rows. A missing row is not a false flag.\n\nCompare vocabulary carefully: pod phases include Succeeded, while the normalized workload set includes Completed. The two sets serve different purposes.\n\nVerified implementation: [exporter/pkg/state/workload.go:19](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75ab
