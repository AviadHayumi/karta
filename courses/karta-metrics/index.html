fefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L34","text":"\tcomponentPodsDesc     *prometheus.Desc\n\tgenerationDesc        *prometheus.Desc\n\tworkloadsDesc         *prometheus.Desc\n\tunattributedDesc      *prometheus.Desc\n\tkartasDesc            *prometheus.Desc\n}\n\nfunc New(s *store.Store, options Options) *Collector {\n\treturn \u0026Collector{\n\t\tstore:   s,\n\t\toptions: options,\n\t\tpodInfoDesc: prometheus.NewDesc(MetricPodWorkloadInfo,\n\t\t\t\"Pod to workload, component, and component instance attribution derived from the Karta definition. Value is always 1.\",\n\t\t\t[]string{LabelNamespace, LabelPod, LabelUID, LabelWorkload, LabelWorkloadKind, LabelWorkloadGroup, LabelComponent, LabelComponentInstance, LabelReplica}, nil),\n\t\tworkloadInfoDesc: prometheus.NewDesc(MetricWorkloadInfo,\n\t\t\t\"Identity and provenance of a Karta-described workload. Value is always 1.\",\n\t\t\tappend(append([]string{}, workloadLabels...), LabelWorkloadVersion, LabelKarta), nil),\n\t\tworkloadStatusDesc: prometheus.NewDesc(MetricWorkloadStatus,\n\t\t\t\"Normalized workload status. One series per phase; several phases can be 1 at the same time.\",\n\t\t\tappend(append([]string{}, workloadLabels...), LabelPhase), nil),\n\t\tcomponentReplicasDesc: prometheus.NewDesc(MetricComponentReplicas,\n\t\t\t\"Desired replicas per component instance, from the workload spec.\",\n\t\t\tappend(append([]string{}, workloadLabels...), LabelComponent, LabelComponentInstance), nil),\n\t\tcomponentPodsDesc: prometheus.NewDesc(MetricComponentPods,\n\t\t\t\"Observed pod count per component instance, broken down by pod phase.\",\n\t\t\tappend(append([]string{}, workloadLabels...), LabelComponent, LabelComponentInstance, LabelPhase), nil),\n\t\tgenerationDesc: prometheus.NewDesc(MetricWorkloadGeneration,\n\t\t\t\"The workload's metadata.generation. A step change marks a spec change.\",\n\t\t\tworkloadLabels, nil),\n\t\tworkloadsDesc: prometheus.NewDesc(MetricExporterWorkloads,\n\t\t\t\"Number of Karta-described workloads currently tracked.\", nil, nil),\n\t\tunattributedDesc: prometheus.NewDesc(MetricExporterUnattributedPods,"},"pod-counts":{"path":"exporter/pkg/collector/collector.go","line":128,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128","text":"\ntype componentKey struct {\n\tworkloadUID types.UID\n\tcomponent   string\n\tinstance    string\n}\n\n// collectComponentPods emits pod counts per component instance and pod phase.\n// The instance set is the union of instances declared by the workload spec\n// and instances observed on pods, zero-filled across all pod phases so\n// under-replication math never breaks on a missing series.\nfunc (c *Collector) collectComponentPods(ch chan\u003c- prometheus.Metric, snapshot store.Snapshot) {\n\trefs := make(map[types.UID]store.WorkloadRef, len(snapshot.Workloads))\n\tkeys := make(map[componentKey]struct{})\n\tcounts := make(map[componentKey]map[string]int)\n\n\tfor _, workload := range snapshot.Workloads {\n\t\trefs[workload.UID] = workload.Ref\n\t\tfor _, component := range workload.Components {\n\t\t\tkeys[componentKey{workload.UID, component.Component, component.Instance}] = struct{}{}\n\t\t}\n\t}\n\n\tfor _, pod := range snapshot.Pods {\n\t\tif _, ok := refs[pod.WorkloadUID]; !ok {\n\t\t\trefs[pod.WorkloadUID] = pod.Workload\n\t\t}\n\t\tkey := componentKey{pod.WorkloadUID, pod.Component, pod.Instance}\n\t\tkeys[key] = struct{}{}\n\t\tif counts[key] == nil {\n\t\t\tcounts[key] = make(map[string]int)\n\t\t}\n\t\tcounts[key][string(pod.Phase)]++\n\t}\n\n\tfor key := range keys {\n\t\tref := refs[key.workloadUID]\n\t\tfor _, phase := range AllPodPhases {\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentPodsDesc, prometheus.GaugeValue,\n\t\t\t\tfloat64(counts[key][string(phase)]),\n\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, key.component, key.instance, string(phase))\n\t\t}\n\t}"},"phase-list":{"path":"exporter/pkg/collector/names.go","line":65,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/names.go#L65","text":"// AllPhases is the closed set of normalized statuses, emitted densely so\n// time-in-phase queries never break on a missing series.\nvar AllPhases = []v1alpha1.ResourceStatus{\n\tv1alpha1.InitializingStatus,\n\tv1alpha1.RunningStatus,\n\tv1alpha1.CompletedStatus,\n\tv1alpha1.FailedStatus,\n\tv1alpha1.DegradedStatus,\n\tv1alpha1.SuspendedStatus,\n\tv1alpha1.SuspendingStatus,\n\tv1alpha1.ResumingStatus,\n\tv1alpha1.UndefinedStatus,\n}\n\n// AllPodPhases is the closed set of pod phases used by the component pod\n// count series.\nvar AllPodPhases = []corev1.PodPhase{\n\tcorev1.PodPending,\n\tcorev1.PodRunning,\n\tcorev1.PodSucceeded,\n\tcorev1.PodFailed,\n\tcorev1.PodUnknown,\n}"},"outermost-owner":{"path":"exporter/pkg/owner/index.go","line":129,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index.go#L129","text":"// RootFor walks controller owner references to the outermost kind for\n// which isRoot returns true: a JobSet child Job can itself be a described\n// kind, and the pod belongs to the JobSet. Roots are matched by group and\n// kind only: owner references may carry any served version. A chain that\n// dead-ends above a found root parks rather than settling for the inner\n// root, so the answer never flips once the missing owner arrives.\nfunc (i *Index) RootFor(ownerRefs []metav1.OwnerReference, isRoot func(schema.GroupKind) bool) WalkResult {\n\ti.mu.RLock()\n\tdefer i.mu.RUnlock()\n\n\tvar best *Ref\n\tcurrent := controllerRef(ownerRefs)\n\tfor depth := 0; depth \u003c maxWalkDepth; depth++ {\n\t\tif current == nil {\n\t\t\tif best != nil {\n\t\t\t\treturn WalkResult{Outcome: OutcomeFound, Root: *best}\n\t\t\t}\n\t\t\treturn WalkResult{Outcome: OutcomeNoController}\n\t\t}\n\n\t\tgvk := refGVK(current)\n\t\tif isRoot(gvk.GroupKind()) {\n\t\t\tbest = \u0026Ref{UID: current.UID, GVK: gvk, Name: current.Name}\n\t\t}\n\n\t\tmiddle, ok := i.nodes[current.UID]\n\t\tif !ok {\n\t\t\treturn WalkResult{Outcome: OutcomeMissing, Missing: current.UID}\n\t\t}\n\t\tcurrent = middle.owner\n\t}\n\n\treturn WalkResult{Outcome: OutcomeDepthExceeded}\n}\n\nfunc controllerRef(ownerRefs []metav1.OwnerReference) *metav1.OwnerReference {\n\tfor index := range ownerRefs {\n\t\tref := ownerRefs[index]\n\t\tif ref.Controller != nil \u0026\u0026 *ref.Controller {\n\t\t\treturn \u0026ref\n\t\t}\n\t}"},"owner-test":{"path":"exporter/pkg/owner/index_test.go","line":115,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index_test.go#L115","text":"\tIt(\"attributes to the outermost registered root when kinds nest\", func() {\n\t\tnestedRoots := func(groupKind schema.GroupKind) bool {\n\t\t\treturn groupKind == jobsetGroupKind || groupKind == schema.GroupKind{Group: \"batch\", Kind: \"Job\"}\n\t\t}\n\t\tindex.UpsertObject(\"root-1\", nil)\n\t\tindex.UpsertObject(\"job-1\", []metav1.OwnerReference{ref(\"jobset.x-k8s.io/v1alpha2\", \"JobSet\", \"llm\", \"root-1\")})\n\n\t\tresult := index.RootFor([]metav1.OwnerReference{ref(\"batch/v1\", \"Job\", \"llm-prefill-0\", \"job-1\")}, nestedRoots)\n\n\t\tExpect(result.Outcome).To(Equal(OutcomeFound))\n\t\tExpect(result.Root.GVK.Kind).To(Equal(\"JobSet\"))\n\t})\n"},"dynamo":{"path":"docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml","line":15,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15","text":"      statusDefinition:\n        phaseDefinition:\n          path: .status.state\n        statusMappings:\n          initializing:\n            - byPhase: initializing\n            - byPhase: pending\n          running:\n            - byPhase: successful\n          failed:\n            - byPhase: failed\n    childComponents:\n      - name: component\n        ownerRef: dynamographdeployment\n        specDefinition:\n          fragmentedPodSpecDefinition:\n            schedulerNamePath: .spec.components[] | .podTemplate.spec.schedulerName\n            labelsPath: .spec.components[] | .podTemplate.metadata.labels\n            annotationsPath: .spec.components[] | .podTemplate.metadata.annotations\n            resourceClaimsPath: .spec.components[] | .podTemplate.spec.resourceClaims\n            podAffinityPath: .spec.components[] | .podTemplate.spec.affinity.podAffinity\n            nodeAffinityPath: .spec.components[] | .podTemplate.spec.affinity.nodeAffinity\n            containerPath: .spec.components[] | .podTemplate.spec.containers[] | select(.name == \"main\")\n            priorityClassNamePath: .spec.components[] | .podTemplate.spec.priorityClassName\n            imagePath: .spec.components[] | .podTemplate.spec.containers[] | select(.name == \"main\") | .image\n        scaleDefinition:\n          replicasPath: .spec.components[] | (.replicas // 1) * (.multinode.nodeCount // 1)\n        instanceIdPath: .spec.components[] | .name\n        podSelector:\n          componentInstanceSelector:\n            idPath: .metadata.labels[\"nvidia.com/dynamo-component\"]\n          replicaSelector:"},"attribution":{"path":"exporter/pkg/attribute/attributor.go","line":29,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L29","text":"\n// Attribute resolves which component, component instance, and replica of a\n// workload the given pod belongs to. All jq runs against the pod only: the\n// workload side is the instanceIDs map (component name to declared instance\n// ids), which the caller computes once per workload event, not per pod.\nfunc Attribute(ctx context.Context, pod *corev1.Pod, entry *registry.Entry, instanceIDs map[string][]string) Result {\n\tquerier := resource.NewPodQuerier(pod)\n\n\tcomponentName, err := instructions.InferPodComponent(ctx, querier, entry.Summary)\n\tif err != nil {\n\t\treturn Result{\n\t\t\tComponent: collector.SentinelUnknown,\n\t\t\tInstance:  collector.SentinelUnknown,\n\t\t\tReason:    collector.ReasonJQError,\n\t\t}\n\t}\n\n\tresult := Result{Component: componentName}\n\tdefinition := entry.Definitions[componentName]\n\tif definition == nil {\n\t\tresult.Instance = collector.SentinelUnknown\n\t\tresult.Reason = collector.ReasonUnknownInstance\n\t\treturn result\n\t}\n\n\tids := instanceIDs[componentName]\n\tif len(ids) == 0 \u0026\u0026 definition.PodSelector != nil \u0026\u0026 definition.PodSelector.ComponentInstanceSelector != nil {\n\t\tresult.Instance = collector.SentinelUnknown\n\t\tresult.Reason = collector.ReasonUnknownInstance\n\t\treturn result\n\t}\n\tif len(ids) \u003e 0 \u0026\u0026 ids[0] != \"\" \u0026\u0026 definition.PodSelector != nil {\n\t\tinstance, err := querier.GetMatchingInstanceId(ctx, definition.PodSelector.ComponentInstanceSelector, ids)\n\t\tswitch {\n\t\tcase err == nil:\n\t\t\tresult.Instance = instance\n\t\tcase errors.As(err, new(resource.InstanceNotFoundError)):\n\t\t\tresult.Instance = collector.SentinelUnknown\n\t\t\tresult.Reason = collector.ReasonUnknownInstance\n\t\tdefault:\n\t\t\tresult.Instance = collector.SentinelUnknown\n\t\t\tresult.Reason = collector.ReasonJQError\n\t\t}\n\t}\n\n\treplica, err := extractReplica(ctx, querier, entry, componentName)\n\tif err != nil \u0026\u0026 result.Reason == \"\" {\n\t\tresult.Reason = collector.ReasonJQError\n\t}\n\tresult.Replica = replica\n\n\treturn result\n}\n\n// InstanceIDs lists the declared instance ids per pod-producing component,\n// straight from the workload object. This is the once-per-workload-event\n// half of attribution.\nfunc InstanceIDs(ctx context.Context, entry *registry.Entry, workload resource.KubernetesObject) (map[string][]string, error) {\n\tfactory := resource.NewComponentFactoryFromObject(entry.Karta, workload)\n"},"replica-key":{"path":"exporter/pkg/attribute/attributor.go","line":113,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L113","text":"// extractReplica finds the nearest ReplicaSelector on the component or its\n// ancestors (descendants inherit the replica context from the ancestor that\n// defines it) and evaluates it against the pod.\nfunc extractReplica(ctx context.Context, querier *resource.PodQuerier, entry *registry.Entry, componentName string) (string, error) {\n\tcurrent := componentName\n\tfor current != \"\" {\n\t\tdefinition := entry.Definitions[current]\n\t\tif definition == nil {\n\t\t\treturn \"\", nil\n\t\t}\n\n\t\tif selector := definition.PodSelector; selector != nil \u0026\u0026 selector.ReplicaSelector != nil {\n\t\t\treplica, found, err := querier.ExtractReplicaKey(ctx, selector.ReplicaSelector)\n\t\t\tif err != nil {\n\t\t\t\treturn \"\", err\n\t\t\t}\n\t\t\tif found {\n\t\t\t\treturn replica, nil\n\t\t\t}\n\t\t\treturn \"\", nil\n\t\t}\n\n\t\tif definition.OwnerRef == nil {\n\t\t\treturn \"\", nil\n\t\t}\n\t\tcurrent = *definition.OwnerRef\n\t}\n\treturn \"\", nil\n}"},"state":{"path":"exporter/pkg/state/workload.go","line":19,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/state/workload.go#L19","text":"// Build computes the stored state of a workload from its live object:\n// matched normalized statuses of the root, and per component instance the\n// desired replicas. A root without a StatusDefinition yields HasStatus false,\n// which is a different fact from Undefined (mappings present, none matched).\nfunc Build(ctx context.Context, entry *registry.Entry, workload resource.KubernetesObject, uid types.UID, ref store.WorkloadRef) (store.WorkloadRecord, error) {\n\tfactory := resource.NewComponentFactoryFromObject(entry.Karta, workload)\n\n\trecord := store.WorkloadRecord{\n\t\tUID:   uid,\n\t\tRef:   ref,\n\t\tKarta: entry.Karta.Name,\n\t}\n\n\troot, err := factory.GetRootComponent()\n\tif err != nil {\n\t\treturn record, fmt.Errorf(\"failed to get root component: %w\", err)\n\t}\n\n\tvar statusErr error\n\tstatus, err := root.GetStatus(ctx)\n\tswitch {\n\tcase err != nil:\n\t\tstatusErr = fmt.Errorf(\"failed to evaluate status: %w\", err)\n\tcase status != nil:\n\t\trecord.HasStatus = true\n\t\trecord.Phases = status.MatchedStatuses\n\t\tif len(record.Phases) == 0 {\n\t\t\trecord.Phases = []v1alpha1.ResourceStatus{v1alpha1.UndefinedStatus}\n\t\t}\n\t}\n\n\tcomponents, err := factory.GetChildComponents()\n\tif err != nil {\n\t\treturn record, fmt.Errorf(\"failed to get child components: %w\", err)\n\t}\n\tcomponents = append(components, root)\n\n\tfor _, component := range components {\n\t\tstates, err := componentStates(ctx, component)\n\t\tif err != nil {\n\t\t\treturn record, fmt.Errorf(\"failed to extract component %s: %w\", component.Name(), err)\n\t\t}\n\t\trecord.Components = append(record.Components, states...)\n\t}\n\n\treturn record, statusErr\n}\n\n// componentStates lists the instances of one component with their desired\n// replicas. Components without a pod definition and without a scale are\n// skipped: they produce no pods and no replica expectation.\nfunc componentStates(ctx context.Context, component *resource.Component) ([]store.ComponentState, error) {\n\tscales, err := component.GetScale(ctx)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif scales == nil \u0026\u0026 !component.HasPodDefinition() {\n\t\treturn nil, nil\n\t}\n\n\tinstanceIds, err := component.GetInstanceIds(ctx)\n\tif err != nil {"},"events":{"path":"exporter/pkg/controller/events.go","line":88,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88","text":"\t\tgroupKind := schema.GroupKind{Group: record.Ref.Group, Kind: record.Ref.Kind}\n\t\tif !c.reg ":"\t\tfor _, waitingKey := range waiting {\n\t\t\tif waitingKey != podKey {\n\t\t\t\tc.attributePodByKey(waitingKey)\n\t\t\t}\n\t\t}\n\t}()\n\n\tresult := c.index.RootFor(pod.OwnerReferences, c.registry.IsRoot)\n\tswitch result.Outcome {\n\tcase owner.OutcomeFound:\n\tcase owner.OutcomeMissing:\n\t\tc.index.MarkPending(result.Missing, podKey)\n\t\treturn\n\tcase owner.OutcomeDepthExceeded:\n\t\tc.attributionErrors.WithLabelValues(collector.ReasonNoOwner).Inc()\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\tdefault:\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\t}\n\n\tgroupKind := result.Root.GVK.GroupKind()\n\tentry, ok := c.registry.EntryFor(groupKind)\n\tif !ok {\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\t}\n\n\tworkloadStore := c.rootWatcherStore(groupKind)\n\tif workloadStore == nil {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\n\titem, exists, err := workloadStore.GetByKey(pod.Namespace + \"/\" + result.Root.Name)\n\tif err != nil || !exists {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\tworkload, ok := item.(*unstructured.Unstructured)\n\tif !ok || workload.GetUID() != result.Root.UID {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\n\tinstanceIDs := map[string][]string{}\n\tif record, ok := c.store.Workload(workload.GetUID()); ok {\n\t\tfor _, componentState := range record.Components {\n\t\t\tinstanceIDs[componentState.Component] = append(instanceIDs[componentState.Component], componentState.Instance)\n\t\t}\n\t} else {\n\t\tcomputed, err := attribute.InstanceIDs(context.Background(), entry, workload)\n\t\tif err != nil {\n\t\t\tc.attributionErrors.WithLabelValues(collector.ReasonJQError).Inc()\n\t\t} else {\n\t\t\tinstanceIDs = computed\n\t\t}\n\t}\n\n\tattribution := attribute.Attribute(context.Background(), pod, entry, instanceIDs)\n\tif attribution.Reason != \"\" {\n\t\tc.attributionErrors.WithLabelValues(attribution.Reason).Inc()\n\t}\n\n\tworkloadGVK := workload.GroupVersionK const EXAM_DATA=[{"id":"metrics-exam-1-v1","lesson":2,"prompt":"Five phase rows have values 0, 2, 0, 3, 0. How many pods are represented?","options":["2","5","25"],"answer":1,"explanation":"Add the observed counts: 2 + 3 = 5. Five rows alone would not prove five pods."},{"id":"metrics-exam-2-v1","lesson":3,"prompt":"A metric tracks the current length of an attribution retry queue. Which type fits?","options":["Counter","Summary","Gauge"],"answer":2,"explanation":"Queue length can rise or fall; it is current state."},{"id":"metrics-exam-3-v1","lesson":4,"prompt":"replica=\"2\" on a pod info row means what?","options":["An extracted replica grouping key of 2","Exactly two pods exist","Exactly two replicas are desired"],"answer":0,"explanation":"The replica label is a grouping key, not a count."},{"id":"metrics-exam-4-v1","lesson":5,"prompt":"A Failed pod still has pod_workload_info=1. Is this contradictory?","options":["Yes","No","Only if the API version is beta"],"answer":1,"explanation":"Info marks the exported attribution, not health."},{"id":"metrics-exam-5-v1","lesson":6,"prompt":"Dynamo replicas=4 and nodeCount=2 produce which desired count in the checked catalog?","options":["2","4","8"],"answer":2,"explanation":"The scale expression multiplies the two fields."},{"id":"metrics-exam-6-v1","lesson":7,"prompt":"Running=1 and Degraded=1 are emitted for one custom workload. What does the collector imply?","options":["Both status mappings matched","There must be two pods","The scrape is corrupt"],"answer":0,"explanation":"The collector supports multiple matching normalized statuses."},{"id":"metrics-exam-7-v1","lesson":8,"prompt":"A pod has a recognized Deployment ancestor and a recognized outermost custom-workload ancestor. Who gets its single attribution?","options":["The Deployment","Both","The outermost custom workload"],"answer":2,"explanation":"The owner walk retains the outermost recognized root."},{"id":"metrics-exam-8-v1","lesson":9,"prompt":"Generation rises while Running pod count stays unchanged. Which explanation is possible?","options":["The metric type changed","The spec changed before pod state changed","Generation is a CPU reading"],"answer":1,"explanation":"Specification and observed pod state can change at different times."},{"id":"metrics-exam-9-v1","lesson":10,"prompt":"When /metrics is read, which data is used for component pod counts?","options":["The stored pod snapshot","A new Deployment created by the exporter","The number of prior HTTP requests"],"answer":0,"explanation":"The collector counts cached pod records by their attribution and phase."},{"id":"metrics-exam-10-v1","lesson":11,"prompt":"There are two selected Running series, values 0 and 5. What are count and sum?","options":["count=5, sum=2","count=2, sum=5","count=1, sum=5"],"answer":1,"explanation":"count includes the zero-valued series; sum adds values."},{"id":"metrics-exam-11-v1","lesson":12,"prompt":"A 0.65-core measurement is multiplied by its matching info gauge. What is its value afterward?","options":["1.65","1","0.65"],"answer":2,"explanation":"Multiplication by info value 1 preserves the original measurement."},{"id":"metrics-exam-12-v1","lesson":13,"prompt":"Prometheus up=1 but a workload has no matching status row. What is directly known?","options":["The workload is Running","The scrape succeeded","There are zero pods"],"answer":1,"explanation":"up describes the scrape. Missing workload status needs separate investigation."}];
const GLOSSARY_DATA={"Metric":"A named numeric measurement.","Metric family":"Related measurements exported under the same metric name.","Sample":"One observed value at a time.","Time series":"Samples sharing a metric name and label set.","Label":"A key/value dimension identifying which measurement a row represents.","Gauge":"A current numeric value that can rise or fall.","Counter":"An accumulated event count, with resets possible.","Histogram":"An instrument describing the distribution of observations.","Summary":"An instrument exposing observation count and sum, optionally quantiles.","Info metric":"Here, a gauge equal to 1 that carries identity or relationship labels.","Cardinality":"The number of distinct time series.","Scrape":"A request that fetches an endpoint such as /metrics.","Exporter":"A service that exposes measurements for a monitoring system.","Prometheus":"A system that collects, stores, and queries metric samples.","PromQL":"The query language used to select and calculate with Prometheus series.","Grafana":"A visualization tool that can query a metrics data source.","Pod":"A Kubernetes object running one or more containers.","Workload":"An application or job represented by a Kubernetes object and managed by a controller.","Controller":"A process that reconciles observed objects with desired state.","Karta definition":"A description of how to interpret a workload kind.","API group":"A namespace for Kubernetes API kinds, such as apps or nvidia.com.","Kind":"A Kubernetes object type such as Deployment.","Component":"A named structural part declared in a Karta definition.","Component instance":"A concrete named occurrence of a component, such as Frontend.","Replica key":"An optional label-derived grouping identifier; distinct from a count.","Desired replicas":"Scale computed from a workload using its Karta scale definition.","Pod phase":"A coarse Kubernetes lifecycle category such as Pending or Running.","Readiness":"Whether a pod is ready to serve; not equivalent to Running phase.","Normalized status":"A Karta status name selected by evaluating mappings on a workload.","Generation":"The workload metadata.generation field copied into a gauge.","Owner reference":"A reference from a Kubernetes object to an owning object.","UID":"An identifier unique to a Kubernetes object incarnation.","Attribution":"Assignment of a pod to a workload, component, and instance.","Informer":"A Kubernetes client mechanism for maintaining a cache through list/watch updates.","Snapshot":"A consistent copy of current stored records for a scrape.","Zero filling":"Emitting known phase series with value 0 even when no pod matches.","Join":"Matching series by labels to combine values and selected labels.","Recording rule":"A recurring query whose result is stored as another series.","Freshness":"How recently relevant state was observed.","HELP":"Exposition metadata describing a metric family.","TYPE":"Exposition metadata declaring a metric type.","Undefined":"Normalized fallback when status mappings exist but none match.","\u003cunknown\u003e":"Sentinel for unresolved component or instance attribution."};
const COURSE_MARKDOWN="\u003c!-- SPDX-License-Identifier: Apache-2.0 --\u003e\n\u003c!-- Copyright (c) 2026 NVIDIA Corporation --\u003e\n\n# Karta metrics, from zero\n\nLearn to read your Dynamo smoke-test output, understand all six metric families, and use them without mixing identity, desired state, observed pods, and health.\n\n14 lessons, 28 practice questions, a metrics simulator, and a 12-question final exam. Start with Learn; every lesson is open. Plan about 80 minutes, at your pace.\n\n[Open the interactive lessons](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#lesson-1). The course includes practice, a simulator, and saved progress. Copy a lesson prompt to discuss it with an assistant of your choice.\n\nSource: [AviadHayumi/workload-map, metrics-exporter](https://github.com/AviadHayumi/workload-map/tree/metrics-exporter), pinned to commit `e09f6358bdb75abe19887dfefa39c529d4ae56d1`, verified against GitHub on 2026-09-16. Cluster state is limited to the supplied snapshot. The checked catalog may differ from installed cluster definitions.\n\n| # | Lesson | Goal | Mode |\n|---|---|---|---|\n| 1 | What am I looking at? | Meet the Pod, the workload, the exporter, and Prometheus. | Learn |\n| 2 | Read one metric line | Separate the metric name, labels, and numeric value. | Learn |\n| 3 | Gauges, counters, histograms, summaries | Learn metric types, then classify all six families in your paste. | Learn |\n| 4 | What do all these labels identify? | Distinguish workload kind, component, component instance, and replica. | Learn |\n| 5 | Why do info metrics always equal 1? | Use the two info families as identity and relationship records. | Learn |\n| 6 | Desired replicas versus observed pods | Read an intention and an observation side by side. | Learn |\n| 7 | What do the status zeros and ones mean? | Separate workload status flags from pod lifecycle counts. | Learn |\n| 8 | Why are the child Deployment pod counts zero? | Trace ownership once, then understand the apparent contradiction. | Learn |\n| 9 | What is workload generation? | Read a specification revision without confusing it with scale or health. | Learn |\n| 10 | From Kubernetes events to /metrics | Follow who computes each value and when it becomes visible. | Learn |\n| 11 | Your first PromQL queries | Filter the right rows, sum their values, and avoid counting zero series. | Learn |\n| 12 | Why join with an info metric? | Attach workload labels to a separate measurement without changing its value. | Learn |\n| 13 | Missing, zero, and exporter health | Understand which evidence can support a conclusion. | Learn |\n| 14 | Read your complete snapshot and try a live lab | Explain all 59 rows, then inspect a real endpoint when available. | Learn |\n\n## 1 / Start from zero\n\n### 1. What am I looking at?\n\nA metric is a named measurement. Your output is a snapshot of what the Karta exporter currently knows about Kubernetes workloads and their pods.\n\nA Pod runs one or more containers. A workload object describes an application or job and the state its controller should maintain. A Deployment is one workload kind. DynamoGraphDeployment is another, defined through a custom Kubernetes API. Its controller can create other objects, including Deployments, which eventually create pods.\n\nA Karta definition is a description of how to interpret a workload kind: where its components, replica counts, and statuses live. The exporter uses those definitions to translate different workload shapes into the same metric names.\n\n#### Four actors, four jobs\n\n| Actor | Job |\n|---|---|\n| Kubernetes controllers | Create and update workload objects and pods |\n| Karta exporter | Watch objects, interpret them, and expose measurements over HTTP |\n| Prometheus | Repeatedly fetch measurements and store timestamped samples |\n| Grafana, if installed | Query Prometheus and display charts |\n\n```mermaid\nflowchart LR\n  A[\"Kubernetes objects\"] --\u003e|\"watch events\"| B[\"Karta exporter cache\"]\n  B --\u003e|\"HTTP /metrics response\"| C[\"Prometheus\"]\n  C --\u003e|\"queries\"| D[\"Charts and alerts\"]\n```\n\n#### Worked example\n\nStart: the exporter has observed two running pods belonging to `dynamo-smoke`. Operation: your `curl` asks it for `/metrics`. Result: the exporter renders its current measurements as text. That request does not create, scale, or restart anything.\n\nPrometheus can make the same request repeatedly. For example, scrapes at 10:00, 10:01, and 10:02 could record pod counts `1, 2, 1`. Your one pasted response contains the current values, without that history. The one-minute interval here is an example, not a detected setting.\n\nVerified implementation: [exporter/pkg/server/server.go:23](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-1).\n\n#### Try it\n\nYou refresh /metrics five times. What happens to desired replicas?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nWho owns the desired state?\n\nThe requests only read exporter state. Reading metrics does not change the workload specification.\n\n\u003c/details\u003e\n\n### 2. Read one metric line\n\nThis is a shortened teaching row. The real exporter includes more identity labels.\n\n```text\nkarta_workload_component_pods{workload=\"dynamo-smoke\",component_instance=\"decode\",phase=\"Running\"} 1\n```\n\n| Part | Read it as |\n|---|---|\n| `karta_workload_component_pods` | What is measured: observed pod count |\n| `{ ... }` | Labels that identify which count |\n| `workload=\"dynamo-smoke\"` | Select this workload |\n| `component_instance=\"decode\"` | Select its decode component instance |\n| `phase=\"Running\"` | Count pods in this phase |\n| Trailing `1` | The numeric measurement: one pod |\n\nA family groups related measurements under one metric name. A time series has a metric name and a specific label set. Changing `phase` from `Running` to `Pending` selects another series. It does not change the type. Prometheus stores successive timestamped samples for each series. See the [Prometheus data model](https://prometheus.io/docs/concepts/data_model/).\n\n#### Worked example\n\nStart: decode has one Running pod and no Pending pods. Result: two distinct rows read Running `1` and Pending `0`. They are two measurements, not two pods.\n\nThe response can also contain metadata:\n\n```text\n# HELP karta_workload_component_replicas Desired replicas per component instance, from the workload spec.\n# TYPE karta_workload_component_replicas gauge\n```\n\n`HELP` describes the family; `TYPE` declares its metric type. These lines are not samples. Your first `grep 'dynamo-smoke'` removes them because they have no workload labels. The pasted excerpt contains no HELP/TYPE output, so their declarations here were checked in code. See [Prometheus exposition format](https://prometheus.io/docs/instrumenting/exposition_formats/).\n\nUnderscores are literal `_`. The `\\_` spelling in your chat paste is Markdown escaping, not part of the metric name.\n\nVerified implementation: [exporter/pkg/collector/collector.go:34](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L34), [exporter/pkg/collector/collector_test.go:16](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector_test.go#L16).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-2).\n\n#### Try it\n\nThis row ends with 7: karta_workload_component_pods{phase=\"Pending\"} 7. What is its sample value?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nThe value is outside the braces.\n\n7. The measurement is 7; Pending is a label value.\n\n\u003c/details\u003e\n\n### 3. Gauges, counters, histograms, summaries\n\nA type describes how to interpret a measurement over time.\n\n| Type | Meaning | Example |\n|---|---|---|\n| Gauge | Current numeric value; may rise or fall | Current pods: 2, then 1 |\n| Counter | Accumulated events; rises, except resets such as process restarts | Attribution errors: 5, then 6 |\n| Histogram | Distribution of observations, commonly expressed through buckets, count, and sum | Request durations grouped by thresholds |\n| Summary | Observation count and sum, with optional client-calculated quantiles | An estimated request-duration percentile |\n\nHistogram and summary examples describe general Prometheus instrumentation. None of your six pasted families is either type. The exporter constructs all six using `prometheus.GaugeValue`. An `_info` suffix does not turn these particular metrics into a fifth Prometheus text type. See [Prometheus metric types](https://prometheus.io/docs/concepts/metric_types/).\n\n\u003cdetails\u003e\n\u003csummary\u003eWorked examples of the other types\u003c/summary\u003e\n\nA counter could read 10 errors, then 13 errors: three additional error events occurred. A process restart may reset it to 0. Its value is not the number of pods currently in trouble.\n\nFor a histogram, imagine three request durations: 0.1, 0.4, and 0.8 seconds. A classic histogram bucket with upper bound 0.5 seconds contains 2 observations; a bucket with upper bound 1 second contains all 3. Buckets are cumulative, so adding these two bucket counts would count some requests twice. The count is 3 and the sum is 1.3 seconds.\n\nA quantile describes a position in a distribution. The 95th percentile estimates a threshold with about 95% of observations at or below it. A summary can calculate such estimates inside the instrumented process. A histogram can support percentile estimates from its buckets. Neither appears among your six workload families.\n\n\u003c/details\u003e\n\n#### The complete map\n\n| Family | Type | What the number means |\n|---|---|---|\n| `karta_pod_workload_info` | Gauge | Always 1 for a currently exported pod attribution |\n| `karta_workload_info` | Gauge | Always 1 for a tracked workload identity |\n| `karta_workload_status` | Gauge | 1 if this normalized status matches; 0 otherwise |\n| `karta_workload_component_replicas` | Gauge | Desired replica count from the Karta scale definition |\n| `karta_workload_component_pods` | Gauge | Observed attributed pods in this pod phase |\n| `karta_workload_generation` | Gauge | Current `metadata.generation` |\n\n#### Worked example\n\nStart: desired replicas are 3. Operation: someone scales the workload down to 1. Result: the replicas gauge becomes 1 after the exporter processes the update. A counter would be inappropriate for this current-state quantity.\n\nIn this branch, `karta_exporter_attribution_errors_total` is a real counter. `rate(counter[5m])` estimates events per second from a recent counter window and accounts for resets. Do not use that operation to interpret current pod counts as pod creations. See [rate documentation](https://prometheus.io/docs/prometheus/latest/querying/functions/#rate).\n\nVerified implementation: [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76), [exporter/pkg/controller/controller.go:102](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/controller.go#L102).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-3).\n\n#### Try it\n\nA desired-replicas metric changes from 8 to 3 after scaling down. Which type fits?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nThe value describes current state and can decrease.\n\nGauge. A gauge represents the current desired count.\n\n\u003c/details\u003e\n\n## 2 / Decode your Dynamo example\n\n### 4. What do all these labels identify?\n\nRead the labels as an address with progressively smaller scopes.\n\n| Label in your output | Meaning |\n|---|---|\n| `namespace=\"default\"` | Kubernetes namespace containing the object |\n| `workload=\"dynamo-smoke\"` | Workload object name |\n| `workload_group=\"nvidia.com\"` | API group, part of the workload type identity |\n| `workload_kind=\"DynamoGraphDeployment\"` | Kubernetes object kind |\n| `workload_version=\"v1beta1\"` | API version, present on workload info |\n| `karta=\"nvidia-com-dynamographdeployment-v1beta1\"` | Name of the Karta definition used |\n| `component=\"component\"` | Literal component name chosen by that Karta definition |\n| `component_instance=\"Frontend\"` or `\"decode\"` | A concrete entry in the workload's component list |\n| `pod` | Concrete pod name, present on pod info |\n| `uid` | Kubernetes UID of that pod, present on pod info |\n| `replica` | Optional grouping key extracted from pod labels, not a replica count |\n| `phase` | A normalized workload status OR a Kubernetes pod phase, depending on family |\n\n#### Worked example from the catalog\n\nThe Dynamo Karta declares a child component named `component`. Its instance expression reads `.spec.components[] | .name`. For a workload containing names `Frontend` and `decode`, there is one component definition with two instances.\n\nFor each pod, the definition reads the label `nvidia.com/dynamo-component` to match an instance. The exporter does not invent `Frontend` by splitting the pod's generated name.\n\n`Frontend` is case-sensitive. The catalog has a separate lowercase expression for gang-scheduling grouping; the metric attribution path does not apply that expression.\n\nThe replica selector checks Grove or LeaderWorkerSet grouping labels. `replica=\"\"` means no replica key was resolved on this pod. It does not mean zero desired replicas. An ordinary Deployment component can have `component_instance=\"\"` because it has no distinct named instances. A failed attribution can instead use the explicit sentinel `\u003cunknown\u003e`.\n\nThe catalog describes the checked branch. A cluster Karta may override it, so the labels alone cannot prove which expressions were installed in your cluster.\n\nVerified implementation: [docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15), [exporter/pkg/attribute/attributor.go:29](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L29), [exporter/pkg/attribute/attributor.go:113](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/attribute/attributor.go#L113).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-4).\n\n#### Try it\n\nA row has replica=\"\" and its component replicas gauge is 4. What does that mean?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nThe label and the gauge answer different questions.\n\nNo replica grouping key was resolved; desired count is 4. The empty replica label is a grouping-key result, while the gauge reports desired size.\n\n\u003c/details\u003e\n\n### 5. Why do info metrics always equal 1?\n\nAn info gauge packages useful labels into a numeric metric. Its value is 1 so the row can participate in counting and label-enrichment queries.\n\n`karta_workload_info` says: this workload is currently tracked, with this kind, API version, and Karta definition. In your output it describes three objects: the DynamoGraphDeployment and two Deployments.\n\n`karta_pod_workload_info` says: this pod has this exported relationship to a workload, component, and component instance. You have two such rows, both assigned to the DynamoGraphDeployment.\n\n#### Worked example\n\nStart: a pod called `decode-example` has UID `pod-a` and is attributed to decode. Result: one pod info series has `uid=\"pod-a\"`, the appropriate labels, and value 1.\n\nIf that pod is deleted, its row stops being emitted after the exporter processes deletion. If a new pod reuses the same name with UID `pod-b`, that identity produces a different series. The old history can remain in Prometheus.\n\n```text\nInformation carried by the labels:\nPod decode-example -\u003e workload dynamo-smoke -\u003e instance decode\n\nInformation carried by the value:\nThis attribution record is currently present: 1\n```\n\nThe `1` does not measure health, CPU, GPU utilization, readiness, or replica index. A failed pod can still have an info row equal to 1. Its phase is counted in the pod-count family.\n\nWorkload info describes tracked objects at multiple levels of the ownership hierarchy. Summing its three rows gives three workload objects, not three independent applications and not three pods. The distinction matters before building a dashboard.\n\nVerified implementation: [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-5).\n\n#### Try it\n\nA pod moves from Running to Failed but remains tracked. What happens to its info gauge?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nIdentity presence and health are different facts.\n\nIt remains 1. The pod info value is always 1 while its attribution is emitted.\n\n\u003c/details\u003e\n\n### 6. Desired replicas versus observed pods\n\nThe replicas gauge answers: how many replicas does this component instance request according to its Karta scale definition?\n\nThe pods gauge answers: how many pods has the exporter attributed to that instance, in each Kubernetes pod phase?\n\n#### Your current snapshot\n\n| Dynamo instance | Desired | Running pods | Pending pods | Failed pods |\n|---|---:|---:|---:|---:|\n| Frontend | 1 | 1 | 0 | 0 |\n| decode | 1 | 1 | 0 | 0 |\n\nThe exporter emits all five pod phases, including Succeeded and Unknown. Zero rows keep the phase counts explicit even when no attributed pod has that phase.\n\n#### Worked example: scale decode\n\nStart: desired 1, Running 1, Pending 0. Operation: a user changes the desired scale to 3. After the exporter observes that spec update, desired becomes 3. Existing pods do not multiply instantly. As pods appear, a later observation might be Running 1, Pending 2. Once all three run, Running becomes 3 and Pending becomes 0.\n\nThese are distinct snapshots, not guaranteed intermediate events. Open the Metrics lab tab to vary desired count and pod phases independently.\n\n#### A Dynamo-specific detail\n\nThe checked v1beta1 Karta defines desired count as:\n\n```jq\n.spec.components[] | (.replicas // 1) * (.multinode.nodeCount // 1)\n```\n\nFor one component with `replicas: 2` and `nodeCount: 3`, the emitted expectation is 6. In this expression `// 1` supplies the default when the optional value is null or absent. Never assume that a generic Karta replica value is a literal copy of a field called replicas.\n\nA Running pod is not necessarily Ready to receive traffic. Pod phases are coarse lifecycle categories. This metric does not count readiness conditions. See [Kubernetes Pod lifecycle](https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle/).\n\nVerified implementation: [exporter/pkg/collector/collector.go:128](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128), [docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-6).\n\n#### Try it\n\nFor the checked Dynamo definition, replicas=3 and multinode.nodeCount=2 produce what desired count?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nMultiply the two fields.\n\n6. The Karta expression returns 3 x 2 = 6.\n\n\u003c/details\u003e\n\n### 7. What do the status zeros and ones mean?\n\n`karta_workload_status` evaluates the workload's own status using a Karta mapping. Each normalized status is emitted as a flag: 1 means its mapping matched; 0 means it did not.\n\nThis branch has nine normalized statuses: Initializing, Running, Completed, Failed, Degraded, Suspended, Suspending, Resuming, and Undefined.\n\n#### Worked example from the checked Dynamo catalog\n\nInput: the workload's `.status.state` is `successful`. The Karta maps that raw string to normalized `Running`. Output: `phase=\"Running\"` is 1; the other flags in your example are 0.\n\nThe pasted Running flag is consistent with that catalog mapping. Without reading your installed Karta and workload object, the raw `successful` value is an inference, not an observed fact.\n\n```text\nWorkload status:\n  Read workload status -\u003e apply Karta mappings -\u003e emit status flags\n\nComponent pod counts:\n  Read each attributed Pod's status.phase -\u003e count pods by phase\n```\n\nA workload Running flag of 1 does not mean it has exactly one pod. It does not come from summing the Running pod count.\n\nThe collector supports several workload statuses equal to 1 simultaneously when multiple mappings match. Your snapshot happens to have only Running active for each object. Do not assume every workload's flags always sum to 1.\n\nIf status mappings exist but none match, the builder uses Undefined. If a workload has no status definition, the exporter omits its status family rows. A missing row is not a false flag.\n\nCompare vocabulary carefully: pod phases include Succeeded, while the normalized workload set includes Completed. The two sets serve different purposes.\n\nVerified implementation: [exporter/pkg/state/workload.go:19](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/state/workload.go#L19), [exporter/pkg/collector/names.go:65](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/names.go#L65), [docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-7).\n\n#### Try it\n\nA workload has 12 Running pods. What should its Running status flag contain when its mapping matches?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nThis family emits a boolean-like flag.\n\n1. A matching normalized status is represented by 1 regardless of pod count.\n\n\u003c/details\u003e\n\n### 8. Why are the child Deployment pod counts zero?\n\nThe exporter assigns a pod to the outermost recognized workload kind in its controller-owner chain. It does not emit another pod attribution for every recognized ancestor.\n\nIn your output, both pod-info records select `workload=\"dynamo-smoke\"` and kind DynamoGraphDeployment. The two Deployments still have workload records, desired counts, and their own status mappings.\n\n#### Worked ownership example\n\nThis diagram illustrates the rule. The exact intermediate objects in your cluster were not inspected; the real Dynamo path can include additional custom objects.\n\n```mermaid\nflowchart BT\n  P[\"Pod\"] --\u003e|\"controller owner\"| R[\"ReplicaSet\"]\n  R --\u003e|\"controller owner\"| D[\"Deployment: recognized workload\"]\n  D --\u003e|\"illustrative ancestor chain\"| G[\"DynamoGraphDeployment: outermost recognized workload\"]\n```\n\n1. The owner walker remembers a recognized Deployment while walking upward.\n2. If it reaches a recognized DynamoGraphDeployment further up, that becomes the selected workload.\n3. The pod record stores one selected workload UID.\n4. The collector groups counts by that UID, component, and instance.\n5. It also creates zero-filled rows for components declared by workload records, even if no pod is attributed to them.\n\n#### Read your exact result\n\n| Object | Desired | Running pod count | Workload Running flag |\n|---|---:|---:|---:|\n| Dynamo / Frontend | 1 | 1 | 1 for the Dynamo workload |\n| Dynamo / decode | 1 | 1 | 1 for the Dynamo workload |\n| Child frontend Deployment | 1 | 0 | 1 |\n| Child decode Deployment | 1 | 0 | 1 |\n\nThe Deployment zero means zero pods attributed to that Deployment in this exporter view. It does not prove that Kubernetes reports no underlying pods. Its Running status is read from its own object, so Running=1 and attributed pod count=0 can coexist.\n\nThis behavior is backed by the owner's nested-workload unit test. A generic desired-minus-running alert over every tracked object could therefore flag these child Deployments misleadingly. First choose the workload level your dashboard should represent.\n\nVerified implementation: [exporter/pkg/owner/index.go:129](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index.go#L129), [exporter/pkg/owner/index_test.go:115](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index_test.go#L115), [exporter/pkg/collector/collector.go:128](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-8).\n\n#### Try it\n\nA Pod belongs to a Job, and that Job belongs to a recognized JobSet. Both kinds are recognized. Which receives the pod attribution?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nFollow the walk beyond the first recognized kind.\n\nThe outermost JobSet. The owner rule selects the outermost recognized workload.\n\n\u003c/details\u003e\n\n## 3 / How the exporter works\n\n### 9. What is workload generation?\n\n`karta_workload_generation` copies the workload object's `metadata.generation`. It is a gauge reporting that object's current generation. It is not the API version, replica count, number of pods, or number of exporter restarts.\n\n#### Worked example\n\nStart: a Deployment has generation 1 and desired replicas 1. Operation: its specification changes to request three replicas. In an ordinary Deployment update, the generation advances, for example to 2. After the exporter observes it, the generation gauge becomes 2 and desired replicas becomes 3. The pod count may still be 1 while the controller catches up.\n\n```text\ngeneration = which spec generation is observed on the object\nreplicas   = desired scale computed through the Karta definition\npods       = currently observed attributed pods\nstatus     = normalized matches from the workload's status\n```\n\nYour three generation rows all have value 1. That means each tracked object's exposed generation is 1. It does not prove an application has never restarted or that a rollout succeeded.\n\nThe exact generation update rules belong to the Kubernetes resource API. The exporter copies the field and does not decide when to increment it. It does not export `status.observedGeneration` in these six families, so generation alone cannot prove that a controller has reconciled the current spec.\n\nOn deletion and recreation, an object of the same name can start again with a low generation. These workload metrics do not carry workload UID as a label, so a name reused with the same namespace/group/kind can continue the same Prometheus series identity across object incarnations.\n\nVerified implementation: [exporter/pkg/controller/events.go:88](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-9).\n\n#### Try it\n\nA generation gauge reads 9. What is directly known?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nThe exporter copies one metadata field.\n\nThe workload object exposes metadata.generation=9. Generation reports the object field, not pod count or a failure count.\n\n\u003c/details\u003e\n\n### 10. From Kubernetes events to /metrics\n\nThe exporter has an event path and a scrape path. A Kubernetes watch delivers changes to cached objects. A scrape asks for a snapshot of the resulting metric state.\n\n#### Event path\n\n| Step | Owner | Work performed |\n|---|---|---|\n| 1 | Kubernetes API and informers | Supply object additions, updates, and deletions |\n| 2 | Karta registry | Identify the description for each recognized workload kind |\n| 3 | Workload event handler | Evaluate normalized status and desired component scales; copy generation |\n| 4 | Owner index and attribution logic | Follow owner references and match pods to workload/component/instance |\n| 5 | In-memory store | Retain current workload records and pod records |\n\n#### Scrape path\n\nThe HTTP server invokes the Prometheus collector. The collector takes a store snapshot, formats identity/status/replica/generation samples, and counts stored pod records by component and phase. The pod-count aggregation does happen at scrape time. It does not run the workload expressions or fetch each workload from Kubernetes on every scrape.\n\n```mermaid\nsequenceDiagram\n  participant K as Kubernetes\n  participant E as Exporter event handlers\n  participant S as In-memory store\n  participant P as Prometheus\n  K-\u003e\u003eE: Workload or pod change\n  E-\u003e\u003eS: Update interpreted records\n  P-\u003e\u003eE: GET /metrics\n  E-\u003e\u003eS: Snapshot\n  S--\u003e\u003eE: Workload and pod records\n  E--\u003e\u003eP: Current metric samples\n```\n\n#### Worked example: pod phase update\n\nStart: decode has one Running pod. Input event: that pod now has phase Failed. The exporter updates its stored phase. A later scrape counts Running=0 and Failed=1. The pod's info record can remain 1 because its attribution still exists.\n\nA deletion removes records instead of creating a permanent tombstone sample at zero. Prometheus handles the disappearance of a series; its old history can remain queryable.\n\nInitial `/metrics` requests return HTTP 503 until readiness has been achieved once. After that first synchronization, the handler continues serving even if the readiness check later changes. A successful scrape proves the HTTP response worked; it does not by itself prove that every watch is fresh.\n\nVerified implementation: [exporter/pkg/controller/events.go:88](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88), [exporter/pkg/controller/events.go:268](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L268), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76), [exporter/pkg/server/server.go:23](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-10).\n\n#### Try it\n\nWhat is computed from pod records during a scrape?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nInspect the collectComponentPods loop.\n\nThe number of stored pods per component and phase. The collector aggregates cached pod records into phase counts.\n\n\u003c/details\u003e\n\n## 4 / Use the metrics\n\n### 11. Your first PromQL queries\n\nPromQL is Prometheus's query language. Run these examples in a Prometheus query UI after it has scraped your exporter. `/metrics` serves raw measurements; it is not a PromQL endpoint.\n\nThe examples below assume one cluster and one exporter target. If Prometheus collects multiple clusters or exporter replicas, select the intended target or deduplicate appropriately before comparing totals. Prometheus may add target labels such as `job` and `instance`; those are distinct from Karta's `component_instance`.\n\n#### Worked query 1: the active status\n\n```promql\nkarta_workload_status{namespace=\"default\",workload=\"dynamo-smoke\",workload_group=\"nvidia.com\",workload_kind=\"DynamoGraphDeployment\"} == 1\n```\n\nThe braces filter by labels. `== 1` keeps matching samples whose value is 1. On your supplied snapshot, this leaves the Running status row. Comparison without `bool` filters rows. It does not automatically rewrite all rows into new zeros and ones.\n\n#### Worked query 2: total Running pods for Dynamo\n\n```promql\nsum(karta_workload_component_pods{namespace=\"default\",workload=\"dynamo-smoke\",workload_group=\"nvidia.com\",workload_kind=\"DynamoGraphDeployment\",phase=\"Running\"})\n```\n\nThe selected values are Frontend=1 and decode=1. `sum` adds their values, giving 2. To keep component names, use:\n\n```promql\nsum by (component_instance) (karta_workload_component_pods{namespace=\"default\",workload=\"dynamo-smoke\",workload_group=\"nvidia.com\",workload_kind=\"DynamoGraphDeployment\",phase=\"Running\"})\n```\n\n#### The count trap\n\n`count` counts series, including those with value zero. Your pasted pod-count family has four component instances across the parent and children, each with five phase rows: 20 series. Their values sum to 2. Counting all 20 series would not count pods.\n\nIn this particular snapshot, both `count` and `sum` on just Dynamo's Running rows happen to return 2. If decode later has three Running pods, the same two rows would have values 1 and 3: count=2, sum=4.\n\n`count(info_metric)` and `sum(info_metric)` can agree because each emitted info value is 1. That shortcut does not generalize to arbitrary gauges. See [PromQL operators](https://prometheus.io/docs/prometheus/latest/querying/operators/).\n\nVerified implementation: [exporter/pkg/collector/collector.go:128](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-11).\n\n#### Try it\n\nThree selected pod-count series have values 0, 4, and 2. What does sum return?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nAdd the values, including the zero.\n\n6. sum returns 0 + 4 + 2 = 6.\n\n\u003c/details\u003e\n\n### 12. Why join with an info metric?\n\nKarta's six families describe workload state and relationships. They do not directly measure CPU, GPU utilization, latency, or memory usage. Other exporters can provide those measurements per pod or container.\n\nA join pairs a measurement with its matching identity row. Multiplying by the info value 1 preserves the measurement while copying selected workload labels.\n\n#### Worked example: synthetic CPU measurements\n\nThese are teaching values, not measurements from your paste:\n\n| Pod | CPU rate | Karta workload |\n|---|---:|---|\n| frontend-example | 0.2 CPU cores | dynamo-smoke |\n| decode-example | 0.7 CPU cores | dynamo-smoke |\n\nAfter matching by namespace and pod, each CPU value is multiplied by 1. Summing the enriched rows for that workload gives 0.9 cores.\n\n#### Optional query to study\n\nFor a single cluster, with one deduplicated CPU source and one consistent attribution per pod:\n\n```promql\nsum by (namespace, workload, workload_kind, workload_group) (\n  rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])\n  * on (namespace, pod)\n    group_left (workload, workload_kind, workload_group)\n    max by (namespace, pod, workload, workload_kind, workload_group) (\n      karta_pod_workload_info\n    )\n)\n```\n\n`rate` converts accumulated CPU seconds into CPU seconds per second, or cores. `on` names the labels used to match. `group_left` permits multiple container measurements to share one pod identity and copies the named labels from that identity. `max by` collapses duplicate info rows with the same retained labels. It cannot reconcile conflicting workload mappings for the same pod.\n\nThe branch's Helm recording-rule template follows this pattern. A recording rule stores the result of a recurring PromQL expression as another series. Its configured CPU source, filters, and join labels must match the telemetry you actually scrape. For multiple clusters, carry the cluster label through matching, deduplication, and final grouping. A namespace/pod match alone is not globally unique.\n\nThis query requires CPU telemetry absent from your paste. The numerical 0.9 result above is a worked synthetic example. See [PromQL vector matching](https://prometheus.io/docs/prometheus/latest/querying/operators/#vector-matching).\n\nVerified implementation: [charts/karta/templates/exporter/prometheusrule.yaml:31](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/charts/karta/templates/exporter/prometheusrule.yaml#L31).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-12).\n\n#### Try it\n\nTwo synthetic pod CPU rates are 0.4 and 0.8 cores. After multiplying both by their info value 1 and summing, what is the result?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nMultiplication by 1 keeps both measurements unchanged.\n\n1.2. 0.4 + 0.8 = 1.2 CPU cores.\n\n\u003c/details\u003e\n\n### 13. Missing, zero, and exporter health\n\nZero means an emitted numeric value is zero. Missing means there is no matching emitted row. These facts require different interpretations.\n\n| Observation | Supported interpretation |\n|---|---|\n| `phase=\"Pending\"` pod count is 0 | No stored attributed pod is counted in that phase for this instance |\n| A status flag is 0 | That normalized status did not match in the emitted state |\n| Status rows are absent | Possibly no status definition, evaluation failure, absent workload, or unavailable data; investigate |\n| An info row disappears | The record is no longer emitted; deletion is one possible cause |\n| HTTP scrape fails | Measurements are unavailable from that scrape, not evidence of zero workloads |\n\n#### Metrics about the exporter itself\n\n| Family | Type | Meaning |\n|---|---|---|\n| `karta_exporter_workloads` | Gauge | Tracked workload records |\n| `karta_exporter_kartas` | Gauge | Definition counts by validity and reason |\n| `karta_exporter_unattributed_pods` | Gauge | Parked or incompletely attributed pods, by tracked reason |\n| `karta_exporter_attribution_errors_total` | Counter | Attribution and status-evaluation error events |\n| `karta_exporter_last_event_timestamp_seconds` | Gauge | Unix time of the last processed watch event |\n\n`unattributed_pods{reason=\"no_owner\"}` uses the count of pods parked on a missing owner in this implementation. It is not an inventory of every unrelated pod on the cluster.\n\n#### Worked example\n\nStart: metrics requests succeed, but the last-event timestamp is old. This may be a quiet cluster or a watch problem. A timestamp alone does not distinguish the two. Check error counters, readiness, and whether expected Kubernetes changes are appearing.\n\nPrometheus also generates its own `up` metric for scrape targets. `up=1` means its scrape succeeded; `up=0` means it failed. It is not a workload Running flag. See [Prometheus jobs and instances](https://prometheus.io/docs/concepts/jobs_instances/).\n\nThese exporter-wide families typically have no workload-name label, so your `grep 'dynamo-smoke'` hides them. The endpoint also registers Go and process metrics. Do not conclude that every metric on the entire endpoint is a gauge just because your six workload families are.\n\nVerified implementation: [exporter/pkg/collector/collector.go:173](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L173), [exporter/pkg/controller/controller.go:102](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/controller.go#L102), [exporter/pkg/server/server.go:23](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23), [exporter/pkg/controller/events.go:268](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L268).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-13).\n\n#### Try it\n\nA metrics scrape fails. What pod count should a dashboard infer?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nFailure to observe is not an observed zero.\n\nNo current count can be inferred from that failed scrape. Treat the missing observation as unavailable data.\n\n\u003c/details\u003e\n\n## 5 / Put it together\n\n### 14. Read your complete snapshot and try a live lab\n\nYour supplied excerpt contains 59 sample rows across six metric families. The interpretation below is limited to that supplied snapshot, not a fresh cluster inspection.\n\n| Family | Rows | What your values say |\n|---|---:|---|\n| Pod workload info | 2 | Two pod attribution records, both under Dynamo |\n| Workload component pods | 20 | Four component-instance groups x five pod phases; two Running pods in total |\n| Workload component replicas | 4 | Each tracked component instance requests 1 by its Karta scale definition |\n| Workload generation | 3 | Each workload exposes generation 1 |\n| Workload info | 3 | One DynamoGraphDeployment and two Deployments |\n| Workload status | 27 | Three workloads x nine flags; each has Running=1 and other flags=0 |\n\n#### Worked reading\n\n`dynamo-smoke` has two named instances, Frontend and decode. Each requests 1 and has one attributed Running pod. Both pod info records have an empty replica key. The child Deployments remain separately described workload objects, but their pods are attributed to the parent, so their pod-phase counts are zero. The snapshot does not establish readiness, resource utilization, latency, or historical failures.\n\nThese are 59 simultaneous series in the supplied response. Repeated scrapes add samples over time. Adding pods or changing labels can add series. This is why label combinations, not just family names, determine cardinality, the number of distinct series.\n\n#### Optional live lab: read-only, requires your endpoint\n\nSet the shell environment variable `METRICS_URL` to the full URL of your own exporter metrics endpoint. The following commands have been checked for syntax. They were not run against your cluster. Run the curl once to keep all inspections on the same snapshot:\n\n```sh\ncurl -fsS \"$METRICS_URL\" -o /tmp/karta-metrics.txt\n```\n\nThen run each inspection separately:\n\n```sh\ngrep -E '^# (HELP|TYPE) karta_' /tmp/karta-metrics.txt\n```\n\n```sh\ngrep -E '^karta_.*workload=\"dynamo-smoke\"' /tmp/karta-metrics.txt\n```\n\n```sh\ngrep -E '^karta_exporter_' /tmp/karta-metrics.txt\n```\n\nThe exact `workload=\"dynamo-smoke\"` filter excludes child names such as `dynamo-smoke-frontend`. Your original substring search includes them. The first command shows both HELP and TYPE; workload filtering would hide these metadata lines.\n\nIf the endpoint is unavailable, use the Metrics lab tab. It models one Dynamo component locally and makes no cluster requests.\n\n#### Before the final exam\n\nExplain one row aloud: name, labels, value, type, source of the value, and one thing it cannot tell you. Then take the Final exam tab. Every lesson is open; nothing requires a passing score to continue.\n\nVerified implementation: [exporter/pkg/collector/collector_test.go:16](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector_test.go#L16), [exporter/pkg/collector/collector.go:128](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).\n\n[Practice this lesson](https://aviadhayumi.github.io/workload-map/courses/karta-metrics/#practice-14).\n\n#### Try it\n\nA workload has three declared component instances and no pods. With five zero-filled pod phases per instance, how many component-pods rows are emitted?\n\n\u003cdetails\u003e\n\u003csummary\u003eHint and solution\u003c/summary\u003e\n\nMultiply instances by phases.\n\n15. 3 x 5 = 15 zero-valued rows, even though no pod is counted.\n\n\u003c/details\u003e\n";

'use strict';
const $=s=>document.querySelector(s);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
const KEY='karta-metrics-progress-v1';
let data,exam,glossary,current=1,tab='learn',qIndex=0,renderToken=0;
const fresh=()=>({read:{},solved:{},reviewed:{},reflections:{},examSolved:{},examDraft:{},bestExam:0,last:1});
let state;
try{state=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'));}catch{state=fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{toast('Progress could not be saved in this browser. Export a backup.');}updateProgress();}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',3000);}
function btn(text,fn,cls){const b=el('button',cls,text);b.addEventListener('click',fn);return b;}
function xp(){return (Object.keys(state.solved).filter(k=>state.solved[k]).length+Object.keys(state.examSolved).filter(k=>state.examSolved[k]).length)*10;}
function done(q){return !!state.solved[q.id]||!!state.reviewed[q.id];}
function updateProgress(){
 if(!data)return;
 const read=data.lessons.filter(l=>state.read[l.id]).length;
 $('#progress-label').innerHTML='<strong>'+read+'/'+data.lessons.length+' read</strong> · '+xp()+' XP';
 const l=data.lessons[current-1];
 $('#practice-count').textContent=l.questions.filter(done).length+'/'+l.questions.length;
}
function navigate(id,mode='learn'){location.hash=mode==='learn'?'lesson-'+id:mode==='practice'?'practice-'+id:mode;}
function route(){
 const hash=location.hash.slice(1);const m=/^(lesson|practice)-(\d+)$/.exec(hash);
 if(m){current=Math.min(data.lessons.length,Math.max(1,Number(m[2])));tab=m[1]==='lesson'?'learn':'practice';}
 else if(['simulator','exam','glossary','sources'].includes(hash)){tab=hash;}
 else{current=1;tab='learn';}
 qIndex=0;state.last=current;save();document.body.classList.remove('menu-open');render();
}
function sidebar(){
 const query=$('#search').value.toLowerCase();const container=$('#curriculum');container.replaceChildren();
 const grouped=new Map();
 data.lessons.forEach(l=>{
  if(query&&!((l.title+' '+l.module+' '+l.goal+' '+l.markdown).toLowerCase().includes(query)))return;
  if(!grouped.has(l.module))grouped.set(l.module,[]);
  grouped.get(l.module).push(l);
 });
 grouped.forEach((ls,name)=>{
  const d=el('details','module');d.open=!!query||ls.some(l=>l.id===current);
  d.append(el('summary','',name));
  ls.forEach(l=>{const a=el('a','lesson-link'+(l.id===current?' active':''));a.href='#lesson-'+l.id;
   a.append(el('span','num',String(l.id).padStart(2,'0')),el('span','',l.title));
   if(state.read[l.id])a.append(el('span','done','✓'));
   d.append(a);
  });container.append(d);
 });
 if(!grouped.size)container.append(el('p','muted','No matching lessons.'));
}
function title(kicker,heading,description){
 const f=document.createDocumentFragment();f.append(el('div','eyebrow',kicker),el('h1','',heading));
 if(description)f.append(el('p','deck',description));return f;
}
function render(){
 renderToken++;sidebar();updateProgress();
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
 const main=$('#main');main.replaceChildren();
 if(tab==='learn')renderLearn(main);
 if(tab==='practice')renderPractice(main);
 if(tab==='simulator')renderSimulator(main);
 if(tab==='exam')renderExam(main);
 if(tab==='glossary')renderGlossary(main);
 if(tab==='sources')renderSources(main);
 window.scrollTo({top:0,behavior:'instant'});
}
