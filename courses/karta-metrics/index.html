e19887dfefa39c529d4ae56d1/exporter/pkg/state/workload.go#L19), [exporter/pkg/collector/names.go:65](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/names.go#L65), [docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15).","html":"\u003cp\u003e\u003ccode\u003ekarta_workload_status\u003c/code\u003e evaluates the workload\u2019s own status using a Karta mapping. Each normalized status is emitted as a flag: 1 means its mapping matched; 0 means it did not.\u003c/p\u003e\n\u003cp\u003eThis branch has nine normalized statuses: Initializing, Running, Completed, Failed, Degraded, Suspended, Suspending, Resuming, and Undefined.\u003c/p\u003e\n\u003ch4 id=\"worked-example-from-the-checked-dynamo-catalog\"\u003eWorked example from the checked Dynamo catalog\u003c/h4\u003e\n\u003cp\u003eInput: the workload\u2019s \u003ccode\u003e.status.state\u003c/code\u003e is \u003ccode\u003esuccessful\u003c/code\u003e. The Karta maps that raw string to normalized \u003ccode\u003eRunning\u003c/code\u003e. Output: \u003ccode\u003ephase=\"Running\"\u003c/code\u003e is 1; the other flags in your example are 0.\u003c/p\u003e\n\u003cp\u003eThe pasted Running flag is consistent with that catalog mapping. Without reading your installed Karta and workload object, the raw \u003ccode\u003esuccessful\u003c/code\u003e value is an inference, not an observed fact.\u003c/p\u003e\n\u003cpre class=\"text\"\u003e\u003ccode\u003eWorkload status:\n  Read workload status -\u0026gt; apply Karta mappings -\u0026gt; emit status flags\n\nComponent pod counts:\n  Read each attributed Pod\u0026#39;s status.phase -\u0026gt; count pods by phase\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eA workload Running flag of 1 does not mean it has exactly one pod. It does not come from summing the Running pod count.\u003c/p\u003e\n\u003cp\u003eThe collector supports several workload statuses equal to 1 simultaneously when multiple mappings match. Your snapshot happens to have only Running active for each object. Do not assume every workload\u2019s flags always sum to 1.\u003c/p\u003e\n\u003cp\u003eIf status mappings exist but none match, the builder uses Undefined. If a workload has no status definition, the exporter omits its status family rows. A missing row is not a false flag.\u003c/p\u003e\n\u003cp\u003eCompare vocabulary carefully: pod phases include Succeeded, while the normalized workload set includes Completed. The two sets serve different purposes.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/state/workload.go#L19\"\u003eexporter/pkg/state/workload.go:19\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/names.go#L65\"\u003eexporter/pkg/collector/names.go:65\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15\"\u003edocs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml:15\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"exporter/pkg/state/workload.go","line":19,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/state/workload.go#L19","text":"// Build computes the stored state of a workload from its live object:\n// matched normalized statuses of the root, and per component instance the\n// desired replicas. A root without a StatusDefinition yields HasStatus false,\n// which is a different fact from Undefined (mappings present, none matched).\nfunc Build(ctx context.Context, entry *registry.Entry, workload resource.KubernetesObject, uid types.UID, ref store.WorkloadRef) (store.WorkloadRecord, error) {\n\tfactory := resource.NewComponentFactoryFromObject(entry.Karta, workload)\n\n\trecord := store.WorkloadRecord{\n\t\tUID:   uid,\n\t\tRef:   ref,\n\t\tKarta: entry.Karta.Name,\n\t}\n\n\troot, err := factory.GetRootComponent()\n\tif err != nil {\n\t\treturn record, fmt.Errorf(\"failed to get root component: %w\", err)\n\t}\n\n\tvar statusErr error\n\tstatus, err := root.GetStatus(ctx)\n\tswitch {\n\tcase err != nil:\n\t\tstatusErr = fmt.Errorf(\"failed to evaluate status: %w\", err)\n\tcase status != nil:\n\t\trecord.HasStatus = true\n\t\trecord.Phases = status.MatchedStatuses\n\t\tif len(record.Phases) == 0 {\n\t\t\trecord.Phases = []v1alpha1.ResourceStatus{v1alpha1.UndefinedStatus}\n\t\t}\n\t}\n\n\tcomponents, err := factory.GetChildComponents()\n\tif err != nil {\n\t\treturn record, fmt.Errorf(\"failed to get child components: %w\", err)\n\t}\n\tcomponents = append(components, root)\n\n\tfor _, component := range components {\n\t\tstates, err := componentStates(ctx, component)\n\t\tif err != nil {\n\t\t\treturn record, fmt.Errorf(\"failed to extract component %s: %w\", component.Name(), err)\n\t\t}\n\t\trecord.Components = append(record.Components, states...)\n\t}\n\n\treturn record, statusErr\n}\n\n// componentStates lists the instances of one component with their desired\n// replicas. Components without a pod definition and without a scale are\n// skipped: they produce no pods and no replica expectation.\nfunc componentStates(ctx context.Context, component *resource.Component) ([]store.ComponentState, error) {\n\tscales, err := component.GetScale(ctx)\n\tif err != nil {\n\t\treturn nil, err\n\t}\n\tif scales == nil \u0026\u0026 !component.HasPodDefinition() {\n\t\treturn nil, nil\n\t}\n\n\tinstanceIds, err := component.GetInstanceIds(ctx)\n\tif err != nil {"},{"path":"exporter/pkg/collector/names.go","line":65,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/names.go#L65","text":"// AllPhases is the closed set of normalized statuses, emitted densely so\n// time-in-phase queries never break on a missing series.\nvar AllPhases = []v1alpha1.ResourceStatus{\n\tv1alpha1.InitializingStatus,\n\tv1alpha1.RunningStatus,\n\tv1alpha1.CompletedStatus,\n\tv1alpha1.FailedStatus,\n\tv1alpha1.DegradedStatus,\n\tv1alpha1.SuspendedStatus,\n\tv1alpha1.SuspendingStatus,\n\tv1alpha1.ResumingStatus,\n\tv1alpha1.UndefinedStatus,\n}\n\n// AllPodPhases is the closed set of pod phases used by the component pod\n// count series.\nvar AllPodPhases = []corev1.PodPhase{\n\tcorev1.PodPending,\n\tcorev1.PodRunning,\n\tcorev1.PodSucceeded,\n\tcorev1.PodFailed,\n\tcorev1.PodUnknown,\n}"},{"path":"docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml","line":15,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/docs/catalog/nvidia-com-dynamographdeployment-v1beta1.yaml#L15","text":"      statusDefinition:\n        phaseDefinition:\n          path: .status.state\n        statusMappings:\n          initializing:\n            - byPhase: initializing\n            - byPhase: pending\n          running:\n            - byPhase: successful\n          failed:\n            - byPhase: failed\n    childComponents:\n      - name: component\n        ownerRef: dynamographdeployment\n        specDefinition:\n          fragmentedPodSpecDefinition:\n            schedulerNamePath: .spec.components[] | .podTemplate.spec.schedulerName\n            labelsPath: .spec.components[] | .podTemplate.metadata.labels\n            annotationsPath: .spec.components[] | .podTemplate.metadata.annotations\n            resourceClaimsPath: .spec.components[] | .podTemplate.spec.resourceClaims\n            podAffinityPath: .spec.components[] | .podTemplate.spec.affinity.podAffinity\n            nodeAffinityPath: .spec.components[] | .podTemplate.spec.affinity.nodeAffinity\n            containerPath: .spec.components[] | .podTemplate.spec.containers[] | select(.name == \"main\")\n            priorityClassNamePath: .spec.components[] | .podTemplate.spec.priorityClassName\n            imagePath: .spec.components[] | .podTemplate.spec.containers[] | select(.name == \"main\") | .image\n        scaleDefinition:\n          replicasPath: .spec.components[] | (.replicas // 1) * (.multinode.nodeCount // 1)\n        instanceIdPath: .spec.components[] | .name\n        podSelector:\n          componentInstanceSelector:\n            idPath: .metadata.labels[\"nvidia.com/dynamo-component\"]\n          replicaSelector:"}],"questions":[{"type":"choice","prompt":"A workload has 12 Running pods. What should its Running status flag contain when its mapping matches?","options":["12","1","The word successful"],"answer":1,"hint":"This family emits a boolean-like flag.","explanation":"A matching normalized status is represented by 1 regardless of pod count.","wrong":{"0":"12 belongs in a pod count, not a status flag.","2":"Raw status strings are mapped into labels and numeric flags."},"id":"metrics-l7-q1-v1"},{"type":"choice","prompt":"A custom Karta matches both Running and Degraded. Can the collector emit both as 1?","options":["Yes, multiple matched statuses are supported","No, it chooses the first one","No, it divides 1 between them"],"answer":0,"hint":"The collector checks membership for every normalized status.","explanation":"Each matched status gets its own 1; the collector does not enforce exclusivity.","wrong":{"1":"There is no first-match-only rule in the collector.","2":"Status values are individual flags, not probability shares."},"id":"metrics-l7-q2-v1"}],"stretch":"What distinction would be lost if a dashboard treated an absent status series as Undefined?"},{"id":8,"module":"2 / Decode your Dynamo example","title":"Why are the child Deployment pod counts zero?","goal":"Trace ownership once, then understand the apparent contradiction.","markdown":"The exporter assigns a pod to the outermost recognized workload kind in its controller-owner chain. It does not emit another pod attribution for every recognized ancestor.\n\nIn your output, both pod-info records select `workload=\"dynamo-smoke\"` and kind DynamoGraphDeployment. The two Deployments still have workload records, desired counts, and their own status mappings.\n\n#### Worked ownership example\n\nThis diagram illustrates the rule. The exact intermediate objects in your cluster were not inspected; the real Dynamo path can include additional custom objects.\n\n```mermaid\nflowchart BT\n  P[\"Pod\"] --\u003e|\"controller owner\"| R[\"ReplicaSet\"]\n  R --\u003e|\"controller owner\"| D[\"Deployment: recognized workload\"]\n  D --\u003e|\"illustrative ancestor chain\"| G[\"DynamoGraphDeployment: outermost recognized workload\"]\n```\n\n1. The owner walker remembers a recognized Deployment while walking upward.\n2. If it reaches a recognized DynamoGraphDeployment further up, that becomes the selected workload.\n3. The pod record stores one selected workload UID.\n4. The collector groups counts by that UID, component, and instance.\n5. It also creates zero-filled rows for components declared by workload records, even if no pod is attributed to them.\n\n#### Read your exact result\n\n| Object | Desired | Running pod count | Workload Running flag |\n|---|---:|---:|---:|\n| Dynamo / Frontend | 1 | 1 | 1 for the Dynamo workload |\n| Dynamo / decode | 1 | 1 | 1 for the Dynamo workload |\n| Child frontend Deployment | 1 | 0 | 1 |\n| Child decode Deployment | 1 | 0 | 1 |\n\nThe Deployment zero means zero pods attributed to that Deployment in this exporter view. It does not prove that Kubernetes reports no underlying pods. Its Running status is read from its own object, so Running=1 and attributed pod count=0 can coexist.\n\nThis behavior is backed by the owner's nested-workload unit test. A generic desired-minus-running alert over every tracked object could therefore flag these child Deployments misleadingly. First choose the workload level your dashboard should represent.\n\nVerified implementation: [exporter/pkg/owner/index.go:129](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index.go#L129), [exporter/pkg/owner/index_test.go:115](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index_test.go#L115), [exporter/pkg/collector/collector.go:128](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128).","html":"\u003cp\u003eThe exporter assigns a pod to the outermost recognized workload kind in its controller-owner chain. It does not emit another pod attribution for every recognized ancestor.\u003c/p\u003e\n\u003cp\u003eIn your output, both pod-info records select \u003ccode\u003eworkload=\"dynamo-smoke\"\u003c/code\u003e and kind DynamoGraphDeployment. The two Deployments still have workload records, desired counts, and their own status mappings.\u003c/p\u003e\n\u003ch4 id=\"worked-ownership-example\"\u003eWorked ownership example\u003c/h4\u003e\n\u003cp\u003eThis diagram illustrates the rule. The exact intermediate objects in your cluster were not inspected; the real Dynamo path can include additional custom objects.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\u003csvg aria-roledescription=\"flowchart-v2\" role=\"graphics-document document\" viewBox=\"-8 -8 461.15625 416.3125\" style=\"max-width: 461.15625px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"diagram-1-0\"\u003e\u003cstyle\u003e#diagram-1-0{font-family:system-ui;font-size:16px;fill:#1c2c29;}#diagram-1-0 .error-icon{fill:hsl(276, 29.4117647059%, 98.3333333333%);}#diagram-1-0 .error-text{fill:rgb(4.0000000001, 5.5000000001, 3.0000000001);stroke:rgb(4.0000000001, 5.5000000001, 3.0000000001);}#diagram-1-0 .edge-thickness-normal{stroke-width:2px;}#diagram-1-0 .edge-thickness-thick{stroke-width: 25\"\u003e\u003cdiv style=\"display: inline-block; white-space: nowrap;\" xmlns=\"http://www.w3.org/1999/xhtml\"\u003e\u003cspan class=\"nodeLabel\"\u003eDynamoGraphDeployment: outermost recognized workload\u003c/span\u003e\u003c/div\u003e\u003c/foreignObject\u003e\u003c/g\u003e\u003c/g\u003e\u003c/g\u003e\u003c/g\u003e\u003c/g\u003e\u003c/svg\u003e\u003c/div\u003e\n\u003col type=\"1\"\u003e\n\u003cli\u003eThe owner walker remembers a recognized Deployment while walking upward.\u003c/li\u003e\n\u003cli\u003eIf it reaches a recognized DynamoGraphDeployment further up, that becomes the selected workload.\u003c/li\u003e\n\u003cli\u003eThe pod record stores one selected workload UID.\u003c/li\u003e\n\u003cli\u003eThe collector groups counts by that UID, component, and instance.\u003c/li\u003e\n\u003cli\u003eIt also creates zero-filled rows for components declared by workload records, even if no pod is attributed to them.\u003c/li\u003e\n\u003c/ol\u003e\n\u003ch4 id=\"read-your-exact-result\"\u003eRead your exact result\u003c/h4\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eObject\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eDesired\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eRunning pod count\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eWorkload Running flag\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003eDynamo / Frontend\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1 for the Dynamo workload\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eDynamo / decode\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1 for the Dynamo workload\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eChild frontend Deployment\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eChild decode Deployment\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e1\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eThe Deployment zero means zero pods attributed to that Deployment in this exporter view. It does not prove that Kubernetes reports no underlying pods. Its Running status is read from its own object, so Running=1 and attributed pod count=0 can coexist.\u003c/p\u003e\n\u003cp\u003eThis behavior is backed by the owner\u2019s nested-workload unit test. A generic desired-minus-running alert over every tracked object could therefore flag these child Deployments misleadingly. First choose the workload level your dashboard should represent.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index.go#L129\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/owner/index.go:129\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index_test.go#L115\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/owner/index_test.go:115\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/collector/collector.go:128\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"exporter/pkg/owner/index.go","line":129,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index.go#L129","text":"// RootFor walks controller owner references to the outermost kind for\n// which isRoot returns true: a JobSet child Job can itself be a described\n// kind, and the pod belongs to the JobSet. Roots are matched by group and\n// kind only: owner references may carry any served version. A chain that\n// dead-ends above a found root parks rather than settling for the inner\n// root, so the answer never flips once the missing owner arrives.\nfunc (i *Index) RootFor(ownerRefs []metav1.OwnerReference, isRoot func(schema.GroupKind) bool) WalkResult {\n\ti.mu.RLock()\n\tdefer i.mu.RUnlock()\n\n\tvar best *Ref\n\tcurrent := controllerRef(ownerRefs)\n\tfor depth := 0; depth \u003c maxWalkDepth; depth++ {\n\t\tif current == nil {\n\t\t\tif best != nil {\n\t\t\t\treturn WalkResult{Outcome: OutcomeFound, Root: *best}\n\t\t\t}\n\t\t\treturn WalkResult{Outcome: OutcomeNoController}\n\t\t}\n\n\t\tgvk := refGVK(current)\n\t\tif isRoot(gvk.GroupKind()) {\n\t\t\tbest = \u0026Ref{UID: current.UID, GVK: gvk, Name: current.Name}\n\t\t}\n\n\t\tmiddle, ok := i.nodes[current.UID]\n\t\tif !ok {\n\t\t\treturn WalkResult{Outcome: OutcomeMissing, Missing: current.UID}\n\t\t}\n\t\tcurrent = middle.owner\n\t}\n\n\treturn WalkResult{Outcome: OutcomeDepthExceeded}\n}\n\nfunc controllerRef(ownerRefs []metav1.OwnerReference) *metav1.OwnerReference {\n\tfor index := range ownerRefs {\n\t\tref := ownerRefs[index]\n\t\tif ref.Controller != nil \u0026\u0026 *ref.Controller {\n\t\t\treturn \u0026ref\n\t\t}\n\t}"},{"path":"exporter/pkg/owner/index_test.go","line":115,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/owner/index_test.go#L115","text":"\tIt(\"attributes to the outermost registered root when kinds nest\", func() {\n\t\tnestedRoots := func(groupKind schema.GroupKind) bool {\n\t\t\treturn groupKind == jobsetGroupKind || groupKind == schema.GroupKind{Group: \"batch\", Kind: \"Job\"}\n\t\t}\n\t\tindex.UpsertObject(\"root-1\", nil)\n\t\tindex.UpsertObject(\"job-1\", []metav1.OwnerReference{ref(\"jobset.x-k8s.io/v1alpha2\", \"JobSet\", \"llm\", \"root-1\")})\n\n\t\tresult := index.RootFor([]metav1.OwnerReference{ref(\"batch/v1\", \"Job\", \"llm-prefill-0\", \"job-1\")}, nestedRoots)\n\n\t\tExpect(result.Outcome).To(Equal(OutcomeFound))\n\t\tExpect(result.Root.GVK.Kind).To(Equal(\"JobSet\"))\n\t})\n"},{"path":"exporter/pkg/collector/collector.go","line":128,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128","text":"\ntype componentKey struct {\n\tworkloadUID types.UID\n\tcomponent   string\n\tinstance    string\n}\n\n// collectComponentPods emits pod counts per component instance and pod phase.\n// The instance set is the union of instances declared by the workload spec\n// and instances observed on pods, zero-filled across all pod phases so\n// under-replication math never breaks on a missing series.\nfunc (c *Collector) collectComponentPods(ch chan\u003c- prometheus.Metric, snapshot store.Snapshot) {\n\trefs := make(map[types.UID]store.WorkloadRef, len(snapshot.Workloads))\n\tkeys := make(map[componentKey]struct{})\n\tcounts := make(map[componentKey]map[string]int)\n\n\tfor _, workload := range snapshot.Workloads {\n\t\trefs[workload.UID] = workload.Ref\n\t\tfor _, component := range workload.Components {\n\t\t\tkeys[componentKey{workload.UID, component.Component, component.Instance}] = struct{}{}\n\t\t}\n\t}\n\n\tfor _, pod := range snapshot.Pods {\n\t\tif _, ok := refs[pod.WorkloadUID]; !ok {\n\t\t\trefs[pod.WorkloadUID] = pod.Workload\n\t\t}\n\t\tkey := componentKey{pod.WorkloadUID, pod.Component, pod.Instance}\n\t\tkeys[key] = struct{}{}\n\t\tif counts[key] == nil {\n\t\t\tcounts[key] = make(map[string]int)\n\t\t}\n\t\tcounts[key][string(pod.Phase)]++\n\t}\n\n\tfor key := range keys {\n\t\tref := refs[key.workloadUID]\n\t\tfor _, phase := range AllPodPhases {\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentPodsDesc, prometheus.GaugeValue,\n\t\t\t\tfloat64(counts[key][string(phase)]),\n\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, key.component, key.instance, string(phase))\n\t\t}\n\t}"}],"questions":[{"type":"choice","prompt":"A Pod belongs to a Job, and that Job belongs to a recognized JobSet. Both kinds are recognized. Which receives the pod attribution?","options":["Both get independent pod records","The nearest Job","The outermost JobSet"],"answer":2,"hint":"Follow the walk beyond the first recognized kind.","explanation":"The owner rule selects the outermost recognized workload.","wrong":{"0":"The store holds one attribution record per pod UID.","1":"The walk continues after it recognizes the Job."},"id":"metrics-l8-q1-v1"},{"type":"choice","prompt":"A child Deployment reports desired=2 and attributed Running pods=0. What should be checked before calling this an outage?","options":["Whether pods are attributed to a higher-level workload","Whether gauge values can be negative","Whether generation is an API version"],"answer":0,"hint":"Your Dynamo example has this exact hierarchy effect.","explanation":"Attribution scope can explain the zero even when underlying pods exist.","wrong":{"1":"The scope of attribution, not negative numbers, is the relevant issue.","2":"Generation does not explain ownership-based pod counts."},"id":"metrics-l8-q2-v1"}],"stretch":"Would summing desired replicas across a parent and all its child workloads double-count the same intended capacity?"},{"id":9,"module":"3 / How the exporter works","title":"What is workload generation?","goal":"Read a specification revision without confusing it with scale or health.","markdown":"`karta_workload_generation` copies the workload object's `metadata.generation`. It is a gauge reporting that object's current generation. It is not the API version, replica count, number of pods, or number of exporter restarts.\n\n#### Worked example\n\nStart: a Deployment has generation 1 and desired replicas 1. Operation: its specification changes to request three replicas. In an ordinary Deployment update, the generation advances, for example to 2. After the exporter observes it, the generation gauge becomes 2 and desired replicas becomes 3. The pod count may still be 1 while the controller catches up.\n\n```text\ngeneration = which spec generation is observed on the object\nreplicas   = desired scale computed through the Karta definition\npods       = currently observed attributed pods\nstatus     = normalized matches from the workload's status\n```\n\nYour three generation rows all have value 1. That means each tracked object's exposed generation is 1. It does not prove an application has never restarted or that a rollout succeeded.\n\nThe exact generation update rules belong to the Kubernetes resource API. The exporter copies the field and does not decide when to increment it. It does not export `status.observedGeneration` in these six families, so generation alone cannot prove that a controller has reconciled the current spec.\n\nOn deletion and recreation, an object of the same name can start again with a low generation. These workload metrics do not carry workload UID as a label, so a name reused with the same namespace/group/kind can continue the same Prometheus series identity across object incarnations.\n\nVerified implementation: [exporter/pkg/controller/events.go:88](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).","html":"\u003cp\u003e\u003ccode\u003ekarta_workload_generation\u003c/code\u003e copies the workload object\u2019s \u003ccode\u003emetadata.generation\u003c/code\u003e. It is a gauge reporting that object\u2019s current generation. It is not the API version, replica count, number of pods, or number of exporter restarts.\u003c/p\u003e\n\u003ch4 id=\"worked-example\"\u003eWorked example\u003c/h4\u003e\n\u003cp\u003eStart: a Deployment has generation 1 and desired replicas 1. Operation: its specification changes to request three replicas. In an ordinary Deployment update, the generation advances, for example to 2. After the exporter observes it, the generation gauge becomes 2 and desired replicas becomes 3. The pod count may still be 1 while the controller catches up.\u003c/p\u003e\n\u003cpre class=\"text\"\u003e\u003ccode\u003egeneration = which spec generation is observed on the object\nreplicas   = desired scale computed through the Karta definition\npods       = currently observed attributed pods\nstatus     = normalized matches from the workload\u0026#39;s status\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eYour three generation rows all have value 1. That means each tracked object\u2019s exposed generation is 1. It does not prove an application has never restarted or that a rollout succeeded.\u003c/p\u003e\n\u003cp\u003eThe exact generation update rules belong to the Kubernetes resource API. The exporter copies the field and does not decide when to increment it. It does not export \u003ccode\u003estatus.observedGeneration\u003c/code\u003e in these six families, so generation alone cannot prove that a controller has reconciled the current spec.\u003c/p\u003e\n\u003cp\u003eOn deletion and recreation, an object of the same name can start again with a low generation. These workload metrics do not carry workload UID as a label, so a name reused with the same namespace/group/kind can continue the same Prometheus series identity across object incarnations.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88\"\u003eexporter/pkg/controller/events.go:88\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76\"\u003eexporter/pkg/collector/collector.go:76\u003c/a\u003e.\u003c/p\u003e\n","minutes":5,"sources":[{"path":"exporter/pkg/controller/events.go","line":88,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88","text":"\t\tgroupKind := schema.GroupKind{Group: record.Ref.Group, Kind: record.Ref.Kind}\n\t\tif !c.registry.IsRoot(groupKind) {\n\t\t\tc.store.DeleteWorkload(record.UID)\n\t\t}\n\t}\n}\n\nfunc (c *Controller) onWorkloadEvent(obj any) {\n\tc.processWorkload(obj, false)\n\tc.markEvent()\n}\n\nfunc (c *Controller) processWorkload(obj any, forceReattribute bool) {\n\tu, ok := asUnstructured(obj)\n\tif !ok {\n\t\treturn\n\t}\n\n\tgvk := u.GroupVersionKind()\n\tentry, ok := c.registry.EntryFor(gvk.GroupKind())\n\tif !ok {\n\t\treturn\n\t}\n\n\tdrained := c.index.UpsertObject(u.GetUID(), u.GetOwnerReferences())\n\n\tref := store.WorkloadRef{\n\t\tNamespace: u.GetNamespace(),\n\t\tName:      u.GetName(),\n\t\tGroup:     gvk.Group,\n\t\tVersion:   gvk.Version,\n\t\tKind:      gvk.Kind,\n\t}\n\n\tprevious, hadPrevious := c.store.Workload(u.GetUID())\n\n\trecord, err := state.Build(context.Background(), entry, u, u.GetUID(), ref)\n\trecord.Generation = u.GetGeneration()\n\tif err != nil {\n\t\tc.attributionErrors.WithLabelValues(collector.ReasonStatusEval).Inc()\n\t\tc.logger.Warn(\"workload state evaluation failed\", \"workload\", ref.Namespace+\"/\"+ref.Name, \"kind\", ref.Kind, \"error\", err)\n\t}\n\tc.store.UpsertWorkload(record)\n\n\tfor _, podKey := range drained {\n\t\tc.attributePodByKey(podKey)\n\t}\n\n\tif forceReattribute || (hadPrevious \u0026\u0026 instanceSetChanged(previous.Components, record.Components)) {\n\t\tfor _, podRecord := range c.store.PodsOfWorkload(u.GetUID()) {\n\t\t\tc.attributePodByKey(podRecord.Namespace + \"/\" + podRecord.Name)\n\t\t}\n\t}\n}\n\nfunc (c *Controller) onWorkloadDelete(obj any) {\n\tu, ok := asUnstructured(obj)\n\tif !ok {\n\t\tif tombstone, isTombstone := obj.(cache.DeletedFinalStateUnknown); isTombstone {\n\t\t\tif inner, innerOK := asUnstructured(tombstone.Obj); innerOK {\n\t\t\t\tu = inner\n\t\t\t\tok = true\n\t\t\t}"},{"path":"exporter/pkg/collector/collector.go","line":76,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76","text":"\tch \u003c- c.componentReplicasDesc\n\tch \u003c- c.componentPodsDesc\n\tch \u003c- c.generationDesc\n\tch \u003c- c.workloadsDesc\n\tch \u003c- c.unattributedDesc\n\tch \u003c- c.kartasDesc\n}\n\nfunc (c *Collector) Collect(ch chan\u003c- prometheus.Metric) {\n\tsnapshot := c.store.Snapshot()\n\n\tfor _, pod := range snapshot.Pods {\n\t\tch \u003c- prometheus.MustNewConstMetric(c.podInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tpod.Namespace, pod.Name, string(pod.UID),\n\t\t\tpod.Workload.Name, pod.Workload.Kind, pod.Workload.Group,\n\t\t\tpod.Component, pod.Instance, pod.Replica)\n\t}\n\n\tfor _, workload := range snapshot.Workloads {\n\t\tref := workload.Ref\n\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, ref.Version, workload.Karta)\n\t\tch \u003c- prometheus.MustNewConstMetric(c.generationDesc, prometheus.GaugeValue, float64(workload.Generation),\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group)\n\n\t\tif workload.HasStatus {\n\t\t\tmatched := make(map[string]struct{}, len(workload.Phases))\n\t\t\tfor _, phase := range workload.Phases {\n\t\t\t\tmatched[string(phase)] = struct{}{}\n\t\t\t}\n\t\t\tfor _, phase := range AllPhases {\n\t\t\t\tvalue := 0.0\n\t\t\t\tif _, ok := matched[string(phase)]; ok {\n\t\t\t\t\tvalue = 1.0\n\t\t\t\t}\n\t\t\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadStatusDesc, prometheus.GaugeValue, value,\n\t\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, string(phase))\n\t\t\t}\n\t\t}\n\n\t\tfor _, component := range workload.Components {\n\t\t\tif component.Replicas == nil {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentReplicasDesc, prometheus.GaugeValue, float64(*component.Replicas),"}],"questions":[{"type":"choice","prompt":"A generation gauge reads 9. What is directly known?","options":["Nine pods exist","The workload object exposes metadata.generation=9","Nine failed rollouts occurred"],"answer":1,"hint":"The exporter copies one metadata field.","explanation":"Generation reports the object field, not pod count or a failure count.","wrong":{"0":"Pod inventory comes from the pod-count family.","2":"Generation is not a rollout outcome counter."},"id":"metrics-l9-q1-v1"},{"type":"text","prompt":"A scale update changes desired replicas from 2 to 5, but no new pods are observed yet. If two pods were Running before, what can their Running count still be?","answer":2,"hint":"An intention can change before the observed pods change.","explanation":"The count can remain 2 until pod events arrive.","id":"metrics-l9-q2-v1"}],"stretch":"Which additional controller status signal would help distinguish a new desired spec from a completed rollout?"},{"id":10,"module":"3 / How the exporter works","title":"From Kubernetes events to /metrics","goal":"Follow who computes each value and when it becomes visible.","markdown":"The exporter has an event path and a scrape path. A Kubernetes watch delivers changes to cached objects. A scrape asks for a snapshot of the resulting metric state.\n\n#### Event path\n\n| Step | Owner | Work performed |\n|---|---|---|\n| 1 | Kubernetes API and informers | Supply object additions, updates, and deletions |\n| 2 | Karta registry | Identify the description for each recognized workload kind |\n| 3 | Workload event handler | Evaluate normalized status and desired component scales; copy generation |\n| 4 | Owner index and attribution logic | Follow owner references and match pods to workload/component/instance |\n| 5 | In-memory store | Retain current workload records and pod records |\n\n#### Scrape path\n\nThe HTTP server invokes the Prometheus collector. The collector takes a store snapshot, formats identity/status/replica/generation samples, and counts stored pod records by component and phase. The pod-count aggregation does happen at scrape time. It does not run the workload expressions or fetch each workload from Kubernetes on every scrape.\n\n```mermaid\nsequenceDiagram\n  participant K as Kubernetes\n  participant E as Exporter event handlers\n  participant S as In-memory store\n  participant P as Prometheus\n  K-\u003e\u003eE: Workload or pod change\n  E-\u003e\u003eS: Update interpreted records\n  P-\u003e\u003eE: GET /metrics\n  E-\u003e\u003eS: Snapshot\n  S--\u003e\u003eE: Workload and pod records\n  E--\u003e\u003eP: Current metric samples\n```\n\n#### Worked example: pod phase update\n\nStart: decode has one Running pod. Input event: that pod now has phase Failed. The exporter updates its stored phase. A later scrape counts Running=0 and Failed=1. The pod's info record can remain 1 because its attribution still exists.\n\nA deletion removes records instead of creating a permanent tombstone sample at zero. Prometheus handles the disappearance of a series; its old history can remain queryable.\n\nInitial `/metrics` requests return HTTP 503 until readiness has been achieved once. After that first synchronization, the handler continues serving even if the readiness check later changes. A successful scrape proves the HTTP response worked; it does not by itself prove that every watch is fresh.\n\nVerified implementation: [exporter/pkg/controller/events.go:88](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88), [exporter/pkg/controller/events.go:268](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L268), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76), [exporter/pkg/server/server.go:23](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23).","html":"\u003cp\u003eThe exporter has an event path and a scrape path. A Kubernetes watch delivers changes to cached objects. A scrape asks for a snapshot of the resulting metric state.\u003c/p\u003e\n\u003ch4 id=\"event-path\"\u003eEvent path\u003c/h4\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\"\u003e\n\u003ccol style=\"width: 33%\"\u003e\n\u003ccol style=\"width: 33%\"\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eStep\u003c/th\u003e\n\u003cth\u003eOwner\u003c/th\u003e\n\u003cth\u003eWork performed\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e1\u003c/td\u003e\n\u003ctd\u003eKubernetes API and informers\u003c/td\u003e\n\u003ctd\u003eSupply object additions, updates, and deletions\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e2\u003c/td\u003e\n\u003ctd\u003eKarta registry\u003c/td\u003e\n\u003ctd\u003eIdentify the description for each recognized workload kind\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e3\u003c/td\u003e\n\u003ctd\u003eWorkload event handler\u003c/td\u003e\n\u003ctd\u003eEvaluate normalized status and desired component scales; copy generation\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e4\u003c/td\u003e\n\u003ctd\u003eOwner index and attribution logic\u003c/td\u003e\n\u003ctd\u003eFollow owner references and match pods to workload/component/instance\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e5\u003c/td\u003e\n\u003ctd\u003eIn-memory store\u003c/td\u003e\n\u003ctd\u003eRetain current workload records and pod records\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch4 id=\"scrape-path\"\u003eScrape path\u003c/h4\u003e\n\u003cp\u003eThe HTTP server invokes the Prometheus collector. The collector takes a store snapshot, formats identity/status/replica/generation samples, and counts stored pod records by component and phase. The pod-count aggregation does happen at scrape time. It does not run the workload expressions or fetch each workload from Kubernetes on every scrape.\u003c/p\u003e\n\u003cdiv class=\"mermaid\"\u003e\u003csvg aria-roledescription=\"sequence\" role=\"graphics-document document\" viewBox=\"-50 -10 965 447\" style=\"max-width: 965px;\" xmlns=\"http://www.w3.org/2000/svg\" width=\"100%\" id=\"diagram-1-0\"\u003e\u003cg\u003e\u003crect class=\"actor actor-bottom\" ry=\"3\" rx=\"3\" name=\"P\" height=\"65\" width=\"150\" stroke=\"#666\" fill=\"#eaeaea\" y=\"361\" x=\"715\"\u003e\u003c/rect\u003e\u003ctext style=\"text-anchor: middle; font-size: 16px; font-weight: 400;\" class=\"actor\" alignment-baseline=\"central\" dominant-baseline=\"central\" y=\"393.5\" x=\"790\"\u003e\u003ctspan dy=\"0\" x=\"790\"\u003ePrometheus\u003c/tspan\u003e\u003c/text\u003e\u003c/g\u003e\u003cg\u003e\u003crect class=\"actor actor-bottom\" ry=\"3\" rx=\"3\" name=\"S\" height=\"65\" width=\"150\" stroke=\"#666\" fill=\"#eaeaea\" y=\"361\" x=\"515\"\u003e\u003c/rect\u003e\u003ctext style=\"text-anchor: middle; font-size: 16px; font-weight: 400;\" class=\"actor\" alignment-baseline=\"central\" dominant-baseline=\"central\" y=\"393.5\" x=\"590\"\u003e\u003ctspan dy=\"0\" x=\"590\"\u003eIn-memory store\u003c/tspan\u003e\u003c/text\u003e\u003c/g\u003e\u003cg\u003e\u003crect class=\"actor actor-bottom\" ry=\"3\" rx=\"3\" name=\"E\" height=\"65\" width=\"193\" stroke=\"#666\" fill=\"#eaeaea\" y=\"361\" x=\"226.5\"\u003e\u003c/re
