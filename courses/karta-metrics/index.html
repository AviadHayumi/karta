function renderPractice(main){
 const l=data.lessons[current-1];main.append(title('PRACTICE · LESSON '+l.id,l.title,'Make a prediction, then check it. Hints and retries are welcome. Each correct question earns XP once.'));
 const links=el('div','meta-row');const a=el('a','','← Read the lesson');a.href='#lesson-'+l.id;const c=btn('Copy lesson prompt',()=>lessonPrompt(l),'coach');links.append(a,c);main.append(links);
 const dots=el('div','practice-head');l.questions.forEach((q,i)=>dots.append(btn(String(i+1),()=>{qIndex=i;renderPracticeOnly();},'question-dot'+(i===qIndex?' active':'')+(done(q)?' solved':''))));main.append(dots);
 const q=l.questions[qIndex];const card=el('section','question-card');card.dataset.questionId=q.id;
 card.append(el('div','eyebrow','QUESTION '+(qIndex+1)+' OF '+l.questions.length+(done(q)?' · ALREADY COMPLETED':'')),el('h2','',q.prompt));
 const feedback=el('div');feedback.setAttribute('aria-live','polite');
 let selected=null,input=null,checked=false;
 const options=[];
 if(q.type==='choice'){
  const group=el('div','options');q.options.forEach((o,i)=>{
   const b=btn('',()=>{selected=i;checked=false;options.forEach(x=>x.classList.remove('selected','wrong','correct'));b.classList.add('selected');feedback.replaceChildren();});
   b.className='option';b.append(el('span','letter',String.fromCharCode(65+i)),el('span','',o));group.append(b);options.push(b);
  });card.append(group);
 }else if(q.type==='text'){
  const label=el('label','muted','Your answer');label.htmlFor='typed-answer';input=el('input','typed-answer');input.id='typed-answer';input.autocomplete='off';input.spellcheck=false;
  card.append(label,input);input.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
 }else{
  card.append(el('p','muted','Open-ended engineering question. Write your reasoning, then compare it with the rubric. This is self-review, not an automated grade.'));
  input=el('textarea','reflection');input.setAttribute('aria-label','Your engineering reasoning');input.value=state.reflections[q.id]||'';
  input.addEventListener('input',()=>{state.reflections[q.id]=input.value;save();});card.append(input);
 }
 const actions=el('div','q-actions');
 const norm=v=>v.trim();
 function check(){
  if(q.type==='rubric'){showSolution();return;}
  if(q.type==='choice'&&selected===null){feedback.replaceChildren(el('p','hint','Choose an answer first.'));return;}
  if(q.type==='text'&&!input.value.trim()){feedback.replaceChildren(el('p','hint','Type an answer first.'));return;}
  const correct=q.type==='choice'?selected===q.answer:norm(input.value)===norm(String(q.answer));
  checked=true;
  if(correct){
   const already=state.solved[q.id];state.solved[q.id]=true;save();
   feedback.replaceChildren(el('div','feedback',(already?'Correct again. ':'Correct · +10 XP. ')+q.explanation));
   if(q.type==='choice')options[selected].classList.add('correct');
   dots.children[qIndex].classList.add('solved');
  }else{
   const specific=q.wrong&&q.wrong[String(selected)];
   const message=specific||(q.type==='choice'?'Reconsider “'+q.options[selected]+'”. '+q.hint:q.hint+' Check spelling, case, and path tokens where relevant.');
   feedback.replaceChildren(el('div','feedback wrong',message));
   if(q.type==='choice')options[selected].classList.add('wrong');
  }
 }
 function showSolution(){
  if(q.type==='rubric'){
   const box=el('div','feedback');box.append(el('strong','','Review your reasoning against these points:'));const ul=el('ul');q.points.forEach(p=>ul.append(el('li','',p)));box.append(ul);
   box.append(btn('I reviewed my reasoning',()=>{state.reviewed[q.id]=true;save();toast('Self-review saved. No automatic grade assigned.');dots.children[qIndex].classList.add('solved');}));
   feedback.replaceChildren(box);
  }else feedback.replaceChildren(el('div','feedback','Solution: '+(q.type==='choice'?q.options[q.answer]:q.answer)+'. '+q.explanation));
 }
 actions.append(btn(q.type==='rubric'?'Open review rubric':'Check answer',check,'primary'),
  btn('Hint',()=>{if(!card.querySelector('.hint'))actions.before(el('div','hint',q.hint));}),
  btn('Try again',()=>{selected=null;feedback.replaceChildren();options.forEach(x=>x.classList.remove('selected','wrong','correct'));if(input&&q.type==='text'){input.value='';input.focus();}}));
 if(q.type!=='rubric')actions.append(btn('Show solution',showSolution));
 card.append(feedback,actions);main.append(card);
 const pager=el('div','pager');pager.style.marginTop='25px';
 const prev=btn('← Previous question',()=>{qIndex--;renderPracticeOnly();});prev.disabled=qIndex===0;
 const next=btn(qIndex<l.questions.length-1?'Next question →':l.id===data.lessons.length?'Final exam →':'Next lesson →',()=>{
  if(qIndex<l.questions.length-1){qIndex++;renderPracticeOnly();}else navigate(l.id===data.lessons.length?l.id:l.id+1,l.id===data.lessons.length?'exam':'learn');
 });pager.append(prev,next);main.append(pager);
}
function renderPracticeOnly(){const main=$('#main');main.replaceChildren();renderPractice(main);window.scrollTo({top:0,behavior:'instant'});}
function renderExam(main){
 main.append(title('FINAL ASSESSMENT','Can you explain the whole path?','12 new scenarios covering types, labels, ownership, queries, and missing data. Aim for 80%, then revisit the explanations you missed.'));
 main.append(el('p','muted','Best score: '+Math.round(state.bestExam*100)+'%. Correct exam questions earn 10 XP once each. Full exam XP requires all 12 correct, not just the 80% checkpoint. Your unfinished selections are saved.'));
 const form=el('form');const result=el('div');main.append(result);
 exam.forEach((q,i)=>{const box=el('section','exam-question');box.id='exam-question-'+i;box.append(el('h3','',(i+1)+'. '+q.prompt));
  q.options.forEach((o,j)=>{const label=el('label');const input=el('input');input.type='radio';input.name=q.id;input.value=j;input.checked=state.examDraft[q.id]===j;input.addEventListener('change',()=>{state.examDraft[q.id]=j;save();});label.append(input,el('span','',o));box.append(label);});form.append(box);
 });
 const submit=el('button','primary','Submit exam');submit.type='submit';form.append(submit);
 form.addEventListener('submit',e=>{
  e.preventDefault();const missing=exam.filter(q=>state.examDraft[q.id]===undefined);
  if(missing.length){result.replaceChildren(el('div','hint','Answer all 12 questions before submitting. '+missing.length+' remain.'));result.scrollIntoView({behavior:'smooth'});return;}
  let correct=0;
  exam.forEach((q,i)=>{
   const ok=state.examDraft[q.id]===q.answer;if(ok){correct++;state.examSolved[q.id]=true;}
   const box=$('#exam-question-'+i);const old=box.querySelector('.feedback');if(old)old.remove();
   const f=el('div','feedback'+(ok?'':' wrong'),(ok?'Correct. ':'Review: '+q.options[q.answer]+'. ')+q.explanation);
   const a=el('a','',' Revisit lesson '+q.lesson+' →');a.href='#lesson-'+q.lesson;f.append(a);box.append(f);
  });
  const score=correct/exam.length;state.bestExam=Math.max(state.bestExam,score);save();
  const panel=el('div','exam-result');panel.append(el('strong','',correct+'/'+exam.length+' · '+Math.round(score*100)+'%'),el('p','',score>=.8?'Checkpoint reached. Review the missed questions, then explain your snapshot in your own words.':'Use the explanations below to choose your next lessons. You can retry without penalty.'));
  result.replaceChildren(panel);result.scrollIntoView({behavior:'smooth'});
 });
 main.append(form);
}

function renderSimulator(main){
 main.append(title('METRICS LAB','Change the state. Take a scrape.','See how desired state, observed pods, and exported measurements can change at different times.'));
 main.append(el('p','muted','Local teaching model for one Dynamo component instance. No cluster calls or PromQL engine. Workload status is selected independently of pod counts. The child Deployment uses Spec replicas directly; Nodes per replica applies only to the Dynamo parent. All samples here are synthetic.'));
 const controls=el('div','sim-controls'), inputs={};
 function number(key,label,value,max){const wrap=el('label','',label),input=el('input');input.type='number';input.min='0';input.max=String(max);input.value=value;input.setAttribute('aria-label',label);wrap.append(input);controls.append(wrap);inputs[key]=input;}
 number('replicas','Spec replicas',1,8);number('nodes','Nodes per replica',1,4);number('running','Running pods',1,8);number('pending','Pending pods',0,8);number('failed','Failed pods',0,8);number('generation','Metadata generation',1,99);
 function select(key,label,options){const w=el('label','',label),input=el('select');input.setAttribute('aria-label',label);options.forEach(([v,t])=>{const o=el('option','',t);o.value=v;input.append(o);});w.append(input);controls.append(w);inputs[key]=input;}
 select('status','Workload status',[['Running','Running'],['Failed','Failed'],['Undefined','Undefined']]);
 select('scope','Count attribution for',[['root','Dynamo parent'],['child','Child Deployment (pods belong to Dynamo)']]);main.append(controls);
 const read=()=>Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.type==='number'?Math.max(0,Math.min(Number(v.max),Number(v.value)||0)):v.value]));
 let cached=read(),observed=[],dirty=false;
 const note=el('div','notice','Initial modeled cache: desired 1, one Running pod. Change an input, process the event, then scrape.');main.append(note);
 const steps=el('div','sim-stage');['1. Edit inputs','2. Process watch event','3. Scrape the cache'].forEach(t=>steps.append(el('span','stage',t)));main.append(steps);
 const actions=el('div','lesson-actions');main.append(actions);
 const overview=el('div','lab-stats'),output=el('pre'),history=el('div');output.setAttribute('aria-label','Synthetic metrics output');main.append(overview,output,history);
 const phases=['Pending','Running','Succeeded','Failed','Unknown'];
 const desired=x=>x.scope==='child'?x.replicas:x.replicas*x.nodes;
 function paint(){
  const x=cached,child=x.scope==='child',counts={Pending:child?0:x.pending,Running:child?0:x.running,Failed:child?0:x.failed,Succeeded:0,Unknown:0};
  overview.replaceChildren();
  for(const [label,value] of [['Desired replicas',desired(x)],['Attributed Running pods',counts.Running],['count(phase series)',5],['sum(phase values)',Object.values(counts).reduce((a,b)=>a+b,0)]]){
   const box=el('div');box.append(el('strong','',String(value)),el('span','',label));overview.append(box);
  }
  const labels=child?'namespace="default",workload="dynamo-smoke-decode-example",workload_group="apps",workload_kind="Deployment",component="deployment",component_instance=""':'namespace="default",workload="dynamo-smoke",workload_group="nvidia.com",workload_kind="DynamoGraphDeployment",component="component",component_instance="decode"';
  const lines=['# Teaching output: count and scale families only; snapshot '+observed.length,'# TYPE karta_workload_component_replicas gauge','karta_workload_component_replicas{'+labels+'} '+desired(x),'# TYPE karta_workload_component_pods gauge',...phases.map(p=>'karta_workload_component_pods{'+labels+',phase="'+p+'"} '+counts[p]),'# Separate cached fields: generation='+x.generation+'; workload status='+x.status];
  output.textContent=lines.join('\n');
  history.replaceChildren(el('h2','','Your scrape history'));
  if(!observed.length){history.append(el('p','muted','Press Scrape cached metrics to record the first sample. The preview above shows the current modeled cache.'));return;}
  const table=el('table');table.innerHTML='<thead><tr><th>Scrape</th><th>Desired</th><th>Running</th><th>Pending</th><th>Workload status</th></tr></thead>';const body=el('tbody');
  observed.forEach((v,i)=>{const row=el('tr');[i+1,desired(v),v.scope==='child'?0:v.running,v.scope==='child'?0:v.pending,v.status].forEach(t=>row.append(el('td','',String(t))));body.append(row);});table.append(body);history.append(table);
 }
 actions.append(btn('Process watch event',()=>{cached=read();dirty=false;note.textContent='The modeled exporter cache now contains these fields. A real observer still needs a new scrape to collect them. Replica expectations and pod counts are independent.';steps.children[1].classList.add('active');steps.children[0].classList.remove('active');},'primary'));
 actions.append(btn('Scrape cached metrics',()=>{observed.push({...cached});note.textContent=dirty?'The scrape read the previous cache. Input edits are not visible until Process watch event runs.':'Snapshot recorded from cached state. Reading it did not create or remove any pods.';steps.children[2].classList.add('active');paint();}));
 actions.append(btn('Reset lab',()=>render()));
 Object.values(inputs).forEach(input=>input.addEventListener('input',()=>{dirty=true;note.textContent='Input changed. The modeled cache still contains its previous state until Process watch event runs.';steps.children[0].classList.add('active');steps.children[1].classList.remove('active');steps.children[2].classList.remove('active');}));
 paint();
}
$('#menu').addEventListener('click',()=>document.body.classList.toggle('menu-open'));
$('#search').addEventListener('input',()=>sidebar());
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>navigate(current,b.dataset.tab)));
$('#export-progress').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({format:KEY,progress:state},null,2)],{type:'application/json'});const a=el('a');a.href=URL.createObjectURL(blob);a.download='karta-metrics-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);});
$('#import-progress').addEventListener('change',async e=>{
 try{
  const raw=JSON.parse(await e.target.files[0].text());if(raw.format!==KEY||!raw.progress||typeof raw.progress!=='object')throw Error('format');
  const p=raw.progress;['read','solved','reviewed','reflections','examSolved'].forEach(k=>{if(p[k]&&typeof p[k]==='object')state[k]=Object.assign({},state[k],p[k]);});
  if(Number.isFinite(p.bestExam))state.bestExam=Math.max(state.bestExam,Math.min(1,Math.max(0,p.bestExam)));save();render();toast('Progress imported and merged.');
 }catch{toast('Could not import that progress file.');}
});

function lessonPrompt(l){
 const dialog=document.createElement('dialog');dialog.className='prompt-dialog';
 const heading=el('h2','','Discuss lesson '+l.id+': '+l.title);
 const description=el('p','','Copy this prompt into an assistant of your choice. Add your question below the lesson context.');
 const input=el('textarea');input.setAttribute('aria-label','Lesson prompt');
 input.value='Help me understand lesson '+l.id+' of Karta metrics, from zero: '+l.title+'. Explain unfamiliar terms and use a concrete example. Give a hint before a practice solution.\n\nLesson: '+PUBLIC_URL+'#lesson-'+l.id+'\nSource: AviadHayumi/workload-map, metrics-exporter, commit e09f6358bdb75abe19887dfefa39c529d4ae56d1.\n\n'+l.markdown+'\n\nMy question: ';
 const status=el('p','muted','');status.setAttribute('aria-live','polite');
 const actions=el('div','lesson-actions');actions.append(btn('Copy prompt',async()=>{try{await navigator.clipboard.writeText(input.value);status.textContent='Copied. Paste it into your assistant.';}catch{input.focus();input.select();status.textContent='Select and copy the prompt above.';}},'primary'),btn('Close',()=>dialog.close()));
 dialog.append(heading,description,input,status,actions);document.body.append(dialog);dialog.addEventListener('close',()=>dialog.remove());dialog.showModal();input.focus();
