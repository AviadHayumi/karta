e: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"172\" x=\"558\"\u003eGET /metrics\u003c/text\u003e\u003cline style=\"fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine0\" y2=\"203\" x2=\"327\" y1=\"203\" x1=\"789\"\u003e\u003c/line\u003e\u003ctext style=\"font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"218\" x=\"455\"\u003eSnapshot\u003c/text\u003e\u003cline style=\"fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine0\" y2=\"249\" x2=\"586\" y1=\"249\" x1=\"324\"\u003e\u003c/line\u003e\u003ctext style=\"font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"264\" x=\"458\"\u003eWorkload and pod records\u003c/text\u003e\u003cline style=\"stroke-dasharray: 3, 3; fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine1\" y2=\"295\" x2=\"327\" y1=\"295\" x1=\"589\"\u003e\u003c/line\u003e\u003ctext style=\"font-size: 16px; font-weight: 400;\" dy=\"1em\" class=\"messageText\" alignment-baseline=\"middle\" dominant-baseline=\"middle\" text-anchor=\"middle\" y=\"310\" x=\"555\"\u003eCurrent metric samples\u003c/text\u003e\u003cline style=\"stroke-dasharray: 3, 3; fill: none;\" marker-end=\"url(#arrowhead)\" stroke=\"none\" stroke-width=\"2\" class=\"messageLine1\" y2=\"341\" x2=\"786\" y1=\"341\" x1=\"324\"\u003e\u003c/line\u003e\u003c/svg\u003e\u003c/div\u003e\n\u003ch4 id=\"worked-example-pod-phase-update\"\u003eWorked example: pod phase update\u003c/h4\u003e\n\u003cp\u003eStart: decode has one Running pod. Input event: that pod now has phase Failed. The exporter updates its stored phase. A later scrape counts Running=0 and Failed=1. The pod\u2019s info record can remain 1 because its attribution still exists.\u003c/p\u003e\n\u003cp\u003eA deletion removes records instead of creating a permanent tombstone sample at zero. Prometheus handles the disappearance of a series; its old history can remain queryable.\u003c/p\u003e\n\u003cp\u003eInitial \u003ccode\u003e/metrics\u003c/code\u003e requests return HTTP 503 until readiness has been achieved once. After that first synchronization, the handler continues serving even if the readiness check later changes. A successful scrape proves the HTTP response worked; it does not by itself prove that every watch is fresh.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/controller/events.go:88\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L268\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/controller/events.go:268\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/collector/collector.go:76\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23\" target=\"_blank\" rel=\"noopener\"\u003eexporter/pkg/server/server.go:23\u003c/a\u003e.\u003c/p\u003e\n","minutes":7,"sources":[{"path":"exporter/pkg/controller/events.go","line":88,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L88","text":"\t\tgroupKind := schema.GroupKind{Group: record.Ref.Group, Kind: record.Ref.Kind}\n\t\tif !c.registry.IsRoot(groupKind) {\n\t\t\tc.store.DeleteWorkload(record.UID)\n\t\t}\n\t}\n}\n\nfunc (c *Controller) onWorkloadEvent(obj any) {\n\tc.processWorkload(obj, false)\n\tc.markEvent()\n}\n\nfunc (c *Controller) processWorkload(obj any, forceReattribute bool) {\n\tu, ok := asUnstructured(obj)\n\tif !ok {\n\t\treturn\n\t}\n\n\tgvk := u.GroupVersionKind()\n\tentry, ok := c.registry.EntryFor(gvk.GroupKind())\n\tif !ok {\n\t\treturn\n\t}\n\n\tdrained := c.index.UpsertObject(u.GetUID(), u.GetOwnerReferences())\n\n\tref := store.WorkloadRef{\n\t\tNamespace: u.GetNamespace(),\n\t\tName:      u.GetName(),\n\t\tGroup:     gvk.Group,\n\t\tVersion:   gvk.Version,\n\t\tKind:      gvk.Kind,\n\t}\n\n\tprevious, hadPrevious := c.store.Workload(u.GetUID())\n\n\trecord, err := state.Build(context.Background(), entry, u, u.GetUID(), ref)\n\trecord.Generation = u.GetGeneration()\n\tif err != nil {\n\t\tc.attributionErrors.WithLabelValues(collector.ReasonStatusEval).Inc()\n\t\tc.logger.Warn(\"workload state evaluation failed\", \"workload\", ref.Namespace+\"/\"+ref.Name, \"kind\", ref.Kind, \"error\", err)\n\t}\n\tc.store.UpsertWorkload(record)\n\n\tfor _, podKey := range drained {\n\t\tc.attributePodByKey(podKey)\n\t}\n\n\tif forceReattribute || (hadPrevious \u0026\u0026 instanceSetChanged(previous.Components, record.Components)) {\n\t\tfor _, podRecord := range c.store.PodsOfWorkload(u.GetUID()) {\n\t\t\tc.attributePodByKey(podRecord.Namespace + \"/\" + podRecord.Name)\n\t\t}\n\t}\n}\n\nfunc (c *Controller) onWorkloadDelete(obj any) {\n\tu, ok := asUnstructured(obj)\n\tif !ok {\n\t\tif tombstone, isTombstone := obj.(cache.DeletedFinalStateUnknown); isTombstone {\n\t\t\tif inner, innerOK := asUnstructured(tombstone.Obj); innerOK {\n\t\t\t\tu = inner\n\t\t\t\tok = true\n\t\t\t}"},{"path":"exporter/pkg/controller/events.go","line":268,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L268","text":"\t\tfor _, waitingKey := range waiting {\n\t\t\tif waitingKey != podKey {\n\t\t\t\tc.attributePodByKey(waitingKey)\n\t\t\t}\n\t\t}\n\t}()\n\n\tresult := c.index.RootFor(pod.OwnerReferences, c.registry.IsRoot)\n\tswitch result.Outcome {\n\tcase owner.OutcomeFound:\n\tcase owner.OutcomeMissing:\n\t\tc.index.MarkPending(result.Missing, podKey)\n\t\treturn\n\tcase owner.OutcomeDepthExceeded:\n\t\tc.attributionErrors.WithLabelValues(collector.ReasonNoOwner).Inc()\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\tdefault:\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\t}\n\n\tgroupKind := result.Root.GVK.GroupKind()\n\tentry, ok := c.registry.EntryFor(groupKind)\n\tif !ok {\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\t}\n\n\tworkloadStore := c.rootWatcherStore(groupKind)\n\tif workloadStore == nil {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\n\titem, exists, err := workloadStore.GetByKey(pod.Namespace + \"/\" + result.Root.Name)\n\tif err != nil || !exists {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\tworkload, ok := item.(*unstructured.Unstructured)\n\tif !ok || workload.GetUID() != result.Root.UID {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\n\tinstanceIDs := map[string][]string{}\n\tif record, ok := c.store.Workload(workload.GetUID()); ok {\n\t\tfor _, componentState := range record.Components {\n\t\t\tinstanceIDs[componentState.Component] = append(instanceIDs[componentState.Component], componentState.Instance)\n\t\t}\n\t} else {\n\t\tcomputed, err := attribute.InstanceIDs(context.Background(), entry, workload)\n\t\tif err != nil {\n\t\t\tc.attributionErrors.WithLabelValues(collector.ReasonJQError).Inc()\n\t\t} else {\n\t\t\tinstanceIDs = computed\n\t\t}\n\t}\n\n\tattribution := attribute.Attribute(context.Background(), pod, entry, instanceIDs)\n\tif attribution.Reason != \"\" {\n\t\tc.attributionErrors.WithLabelValues(attribution.Reason).Inc()\n\t}\n\n\tworkloadGVK := workload.GroupVersionKind()\n\tc.store.UpsertPod(store.PodRecord{\n\t\tUID:         pod.UID,\n\t\tNamespace:   pod.Namespace,\n\t\tName:        pod.Name,\n\t\tWorkloadUID: workload.GetUID(),\n\t\tWorkload: store.WorkloadRef{\n\t\t\tNamespace: workload.GetNamespace(),\n\t\t\tName:      workload.GetName(),\n\t\t\tGroup:     workloadGVK.Group,\n\t\t\tVersion:   workloadGVK.Version,\n\t\t\tKind:      workloadGVK.Kind,\n\t\t},\n\t\tComponent: attribution.Component,\n\t\tInstance:  attribution.Instance,\n\t\tReplica:   attribution.Replica,\n\t\tReason:    attribution.Reason,\n\t\tPhase:     pod.Status.Phase,\n\t})\n}\n\nfunc instanceSetChanged(previous, current []store.ComponentState) bool {"},{"path":"exporter/pkg/collector/collector.go","line":76,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76","text":"\tch \u003c- c.componentReplicasDesc\n\tch \u003c- c.componentPodsDesc\n\tch \u003c- c.generationDesc\n\tch \u003c- c.workloadsDesc\n\tch \u003c- c.unattributedDesc\n\tch \u003c- c.kartasDesc\n}\n\nfunc (c *Collector) Collect(ch chan\u003c- prometheus.Metric) {\n\tsnapshot := c.store.Snapshot()\n\n\tfor _, pod := range snapshot.Pods {\n\t\tch \u003c- prometheus.MustNewConstMetric(c.podInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tpod.Namespace, pod.Name, string(pod.UID),\n\t\t\tpod.Workload.Name, pod.Workload.Kind, pod.Workload.Group,\n\t\t\tpod.Component, pod.Instance, pod.Replica)\n\t}\n\n\tfor _, workload := range snapshot.Workloads {\n\t\tref := workload.Ref\n\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, ref.Version, workload.Karta)\n\t\tch \u003c- prometheus.MustNewConstMetric(c.generationDesc, prometheus.GaugeValue, float64(workload.Generation),\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group)\n\n\t\tif workload.HasStatus {\n\t\t\tmatched := make(map[string]struct{}, len(workload.Phases))\n\t\t\tfor _, phase := range workload.Phases {\n\t\t\t\tmatched[string(phase)] = struct{}{}\n\t\t\t}\n\t\t\tfor _, phase := range AllPhases {\n\t\t\t\tvalue := 0.0\n\t\t\t\tif _, ok := matched[string(phase)]; ok {\n\t\t\t\t\tvalue = 1.0\n\t\t\t\t}\n\t\t\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadStatusDesc, prometheus.GaugeValue, value,\n\t\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, string(phase))\n\t\t\t}\n\t\t}\n\n\t\tfor _, component := range workload.Components {\n\t\t\tif component.Replicas == nil {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentReplicasDesc, prometheus.GaugeValue, float64(*component.Replicas),"},{"path":"exporter/pkg/server/server.go","line":23,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23","text":"\nfunc New(addr string, gatherer prometheus.Gatherer, ready func() bool) *Server {\n\tmux := http.NewServeMux()\n\tmetricsHandler := promhttp.HandlerFor(gatherer, promhttp.HandlerOpts{})\n\teverReady := false\n\tmux.HandleFunc(\"/metrics\", func(w http.ResponseWriter, r *http.Request) {\n\t\t// a half-built store must fail the scrape visibly, not serve\n\t\t// plausible zeros; once synced, keep serving forever\n\t\tif !everReady {\n\t\t\tif !ready() {\n\t\t\t\tw.WriteHeader(http.StatusServiceUnavailable)\n\t\t\t\treturn\n\t\t\t}\n\t\t\teverReady = true\n\t\t}\n\t\tmetricsHandler.ServeHTTP(w, r)\n\t})\n\tmux.HandleFunc(\"/healthz\", func(w http.ResponseWriter, _ *http.Request) {\n\t\tw.WriteHeader(http.StatusOK)\n\t})\n\tmux.HandleFunc(\"/readyz\", func(w http.ResponseWriter, _ *http.Request) {\n\t\tif ready() {\n\t\t\tw.WriteHeader(http.StatusOK)\n\t\t\treturn\n\t\t}\n\t\tw.WriteHeader(http.StatusServiceUnavailable)\n\t})"}],"questions":[{"type":"choice","prompt":"What is computed from pod records during a scrape?","options":["The number of stored pods per component and phase","The actual number of replicas to create","A new workload specification"],"answer":0,"hint":"Inspect the collectComponentPods loop.","explanation":"The collector aggregates cached pod records into phase counts.","wrong":{"1":"Kubernetes controllers reconcile scale; the collector renders observations.","2":"The scrape path does not write workload specs."},"id":"metrics-l10-q1-v1"},{"type":"choice","prompt":"The exporter has just started and initial caches have not synced. What response does this branch give for /metrics?","options":["HTTP 200 with plausible zero counts","HTTP 503","An instruction to restart every workload"],"answer":1,"hint":"The handler checks readiness until it has been achieved once.","explanation":"Before initial readiness, /metrics returns Service Unavailable.","wrong":{"0":"The initial gate avoids representing incomplete caches as valid zeros.","2":"Startup synchronization does not require restarting workloads."},"id":"metrics-l10-q2-v1"}],"stretch":"Why are scrape success and watch freshness two different things to monitor?"},{"id":11,"module":"4 / Use the metrics","title":"Your first PromQL queries","goal":"Filter the right rows, sum their values, and avoid counting zero series.","markdown":"PromQL is Prometheus's query language. Run these examples in a Prometheus query UI after it has scraped your exporter. `/metrics` serves raw measurements; it is not a PromQL endpoint.\n\nThe examples below assume one cluster and one exporter target. If Prometheus collects multiple clusters or exporter replicas, select the intended target or deduplicate appropriately before comparing totals. Prometheus may add target labels such as `job` and `instance`; those are distinct from Karta's `component_instance`.\n\n#### Worked query 1: the active status\n\n```promql\nkarta_workload_status{namespace=\"default\",workload=\"dynamo-smoke\",workload_group=\"nvidia.com\",workload_kind=\"DynamoGraphDeployment\"} == 1\n```\n\nThe braces filter by labels. `== 1` keeps matching samples whose value is 1. On your supplied snapshot, this leaves the Running status row. Comparison without `bool` filters rows. It does not automatically rewrite all rows into new zeros and ones.\n\n#### Worked query 2: total Running pods for Dynamo\n\n```promql\nsum(karta_workload_component_pods{namespace=\"default\",workload=\"dynamo-smoke\",workload_group=\"nvidia.com\",workload_kind=\"DynamoGraphDeployment\",phase=\"Running\"})\n```\n\nThe selected values are Frontend=1 and decode=1. `sum` adds their values, giving 2. To keep component names, use:\n\n```promql\nsum by (component_instance) (karta_workload_component_pods{namespace=\"default\",workload=\"dynamo-smoke\",workload_group=\"nvidia.com\",workload_kind=\"DynamoGraphDeployment\",phase=\"Running\"})\n```\n\n#### The count trap\n\n`count` counts series, including those with value zero. Your pasted pod-count family has four component instances across the parent and children, each with five phase rows: 20 series. Their values sum to 2. Counting all 20 series would not count pods.\n\nIn this particular snapshot, both `count` and `sum` on just Dynamo's Running rows happen to return 2. If decode later has three Running pods, the same two rows would have values 1 and 3: count=2, sum=4.\n\n`count(info_metric)` and `sum(info_metric)` can agree because each emitted info value is 1. That shortcut does not generalize to arbitrary gauges. See [PromQL operators](https://prometheus.io/docs/prometheus/latest/querying/operators/).\n\nVerified implementation: [exporter/pkg/collector/collector.go:128](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).","html":"\u003cp\u003ePromQL is Prometheus\u2019s query language. Run these examples in a Prometheus query UI after it has scraped your exporter. \u003ccode\u003e/metrics\u003c/code\u003e serves raw measurements; it is not a PromQL endpoint.\u003c/p\u003e\n\u003cp\u003eThe examples below assume one cluster and one exporter target. If Prometheus collects multiple clusters or exporter replicas, select the intended target or deduplicate appropriately before comparing totals. Prometheus may add target labels such as \u003ccode\u003ejob\u003c/code\u003e and \u003ccode\u003einstance\u003c/code\u003e; those are distinct from Karta\u2019s \u003ccode\u003ecomponent_instance\u003c/code\u003e.\u003c/p\u003e\n\u003ch4 id=\"worked-query-1-the-active-status\"\u003eWorked query 1: the active status\u003c/h4\u003e\n\u003cpre class=\"promql\"\u003e\u003ccode\u003ekarta_workload_status{namespace=\u0026quot;default\u0026quot;,workload=\u0026quot;dynamo-smoke\u0026quot;,workload_group=\u0026quot;nvidia.com\u0026quot;,workload_kind=\u0026quot;DynamoGraphDeployment\u0026quot;} == 1\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe braces filter by labels. \u003ccode\u003e== 1\u003c/code\u003e keeps matching samples whose value is 1. On your supplied snapshot, this leaves the Running status row. Comparison without \u003ccode\u003ebool\u003c/code\u003e filters rows. It does not automatically rewrite all rows into new zeros and ones.\u003c/p\u003e\n\u003ch4 id=\"worked-query-2-total-running-pods-for-dynamo\"\u003eWorked query 2: total Running pods for Dynamo\u003c/h4\u003e\n\u003cpre class=\"promql\"\u003e\u003ccode\u003esum(karta_workload_component_pods{namespace=\u0026quot;default\u0026quot;,workload=\u0026quot;dynamo-smoke\u0026quot;,workload_group=\u0026quot;nvidia.com\u0026quot;,workload_kind=\u0026quot;DynamoGraphDeployment\u0026quot;,phase=\u0026quot;Running\u0026quot;})\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe selected values are Frontend=1 and decode=1. \u003ccode\u003esum\u003c/code\u003e adds their values, giving 2. To keep component names, use:\u003c/p\u003e\n\u003cpre class=\"promql\"\u003e\u003ccode\u003esum by (component_instance) (karta_workload_component_pods{namespace=\u0026quot;default\u0026quot;,workload=\u0026quot;dynamo-smoke\u0026quot;,workload_group=\u0026quot;nvidia.com\u0026quot;,workload_kind=\u0026quot;DynamoGraphDeployment\u0026quot;,phase=\u0026quot;Running\u0026quot;})\u003c/code\u003e\u003c/pre\u003e\n\u003ch4 id=\"the-count-trap\"\u003eThe count trap\u003c/h4\u003e\n\u003cp\u003e\u003ccode\u003ecount\u003c/code\u003e counts series, including those with value zero. Your pasted pod-count family has four component instances across the parent and children, each with five phase rows: 20 series. Their values sum to 2. Counting all 20 series would not count pods.\u003c/p\u003e\n\u003cp\u003eIn this particular snapshot, both \u003ccode\u003ecount\u003c/code\u003e and \u003ccode\u003esum\u003c/code\u003e on just Dynamo\u2019s Running rows happen to return 2. If decode later has three Running pods, the same two rows would have values 1 and 3: count=2, sum=4.\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003ecount(info_metric)\u003c/code\u003e and \u003ccode\u003esum(info_metric)\u003c/code\u003e can agree because each emitted info value is 1. That shortcut does not generalize to arbitrary gauges. See \u003ca href=\"https://prometheus.io/docs/prometheus/latest/querying/operators/\"\u003ePromQL operators\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128\"\u003eexporter/pkg/collector/collector.go:128\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76\"\u003eexporter/pkg/collector/collector.go:76\u003c/a\u003e.\u003c/p\u003e\n","minutes":7,"sources":[{"path":"exporter/pkg/collector/collector.go","line":128,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128","text":"\ntype componentKey struct {\n\tworkloadUID types.UID\n\tcomponent   string\n\tinstance    string\n}\n\n// collectComponentPods emits pod counts per component instance and pod phase.\n// The instance set is the union of instances declared by the workload spec\n// and instances observed on pods, zero-filled across all pod phases so\n// under-replication math never breaks on a missing series.\nfunc (c *Collector) collectComponentPods(ch chan\u003c- prometheus.Metric, snapshot store.Snapshot) {\n\trefs := make(map[types.UID]store.WorkloadRef, len(snapshot.Workloads))\n\tkeys := make(map[componentKey]struct{})\n\tcounts := make(map[componentKey]map[string]int)\n\n\tfor _, workload := range snapshot.Workloads {\n\t\trefs[workload.UID] = workload.Ref\n\t\tfor _, component := range workload.Components {\n\t\t\tkeys[componentKey{workload.UID, component.Component, component.Instance}] = struct{}{}\n\t\t}\n\t}\n\n\tfor _, pod := range snapshot.Pods {\n\t\tif _, ok := refs[pod.WorkloadUID]; !ok {\n\t\t\trefs[pod.WorkloadUID] = pod.Workload\n\t\t}\n\t\tkey := componentKey{pod.WorkloadUID, pod.Component, pod.Instance}\n\t\tkeys[key] = struct{}{}\n\t\tif counts[key] == nil {\n\t\t\tcounts[key] = make(map[string]int)\n\t\t}\n\t\tcounts[key][string(pod.Phase)]++\n\t}\n\n\tfor key := range keys {\n\t\tref := refs[key.workloadUID]\n\t\tfor _, phase := range AllPodPhases {\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentPodsDesc, prometheus.GaugeValue,\n\t\t\t\tfloat64(counts[key][string(phase)]),\n\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, key.component, key.instance, string(phase))\n\t\t}\n\t}"},{"path":"exporter/pkg/collector/collector.go","line":76,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76","text":"\tch \u003c- c.componentReplicasDesc\n\tch \u003c- c.componentPodsDesc\n\tch \u003c- c.generationDesc\n\tch \u003c- c.workloadsDesc\n\tch \u003c- c.unattributedDesc\n\tch \u003c- c.kartasDesc\n}\n\nfunc (c *Collector) Collect(ch chan\u003c- prometheus.Metric) {\n\tsnapshot := c.store.Snapshot()\n\n\tfor _, pod := range snapshot.Pods {\n\t\tch \u003c- prometheus.MustNewConstMetric(c.podInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tpod.Namespace, pod.Name, string(pod.UID),\n\t\t\tpod.Workload.Name, pod.Workload.Kind, pod.Workload.Group,\n\t\t\tpod.Component, pod.Instance, pod.Replica)\n\t}\n\n\tfor _, workload := range snapshot.Workloads {\n\t\tref := workload.Ref\n\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, ref.Version, workload.Karta)\n\t\tch \u003c- prometheus.MustNewConstMetric(c.generationDesc, prometheus.GaugeValue, float64(workload.Generation),\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group)\n\n\t\tif workload.HasStatus {\n\t\t\tmatched := make(map[string]struct{}, len(workload.Phases))\n\t\t\tfor _, phase := range workload.Phases {\n\t\t\t\tmatched[string(phase)] = struct{}{}\n\t\t\t}\n\t\t\tfor _, phase := range AllPhases {\n\t\t\t\tvalue := 0.0\n\t\t\t\tif _, ok := matched[string(phase)]; ok {\n\t\t\t\t\tvalue = 1.0\n\t\t\t\t}\n\t\t\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadStatusDesc, prometheus.GaugeValue, value,\n\t\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, string(phase))\n\t\t\t}\n\t\t}\n\n\t\tfor _, component := range workload.Components {\n\t\t\tif component.Replicas == nil {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentReplicasDesc, prometheus.GaugeValue, float64(*component.Replicas),"}],"questions":[{"type":"text","prompt":"Three selected pod-count series have values 0, 4, and 2. What does sum return?","answer":6,"hint":"Add the values, including the zero.","explanation":"sum returns 0 + 4 + 2 = 6.","id":"metrics-l11-q1-v1"},{"type":"text","prompt":"The same three series have values 0, 4, and 2. What does count return?","answer":3,"hint":"Count the series, not the represented pods.","explanation":"All three series exist, including the zero-valued one.","id":"metrics-l11-q2-v1"}],"stretch":"Why could count(karta_workload_status{phase=\"Running\"}) count workloads whose Running flag is false?"},{"id":12,"module":"4 / Use the metrics","title":"Why join with an info metric?","goal":"Attach workload labels to a separate measurement without changing its value.","markdown":"Karta's six families describe workload state and relationships. They do not directly measure CPU, GPU utilization, latency, or memory usage. Other exporters can provide those measurements per pod or container.\n\nA join pairs a measurement with its matching identity row. Multiplying by the info value 1 preserves the measurement while copying selected workload labels.\n\n#### Worked example: synthetic CPU measurements\n\nThese are teaching values, not measurements from your paste:\n\n| Pod | CPU rate | Karta workload |\n|---|---:|---|\n| frontend-example | 0.2 CPU cores | dynamo-smoke |\n| decode-example | 0.7 CPU cores | dynamo-smoke |\n\nAfter matching by namespace and pod, each CPU value is multiplied by 1. Summing the enriched rows for that workload gives 0.9 cores.\n\n#### Optional query to study\n\nFor a single cluster, with one deduplicated CPU source and one consistent attribution per pod:\n\n```promql\nsum by (namespace, workload, workload_kind, workload_group) (\n  rate(container_cpu_usage_seconds_total{container!=\"\"}[5m])\n  * on (namespace, pod)\n    group_left (workload, workload_kind, workload_group)\n    max by (namespace, pod, workload, workload_kind, workload_group) (\n      karta_pod_workload_info\n    )\n)\n```\n\n`rate` converts accumulated CPU seconds into CPU seconds per second, or cores. `on` names the labels used to match. `group_left` permits multiple container measurements to share one pod identity and copies the named labels from that identity. `max by` collapses duplicate info rows with the same retained labels. It cannot reconcile conflicting workload mappings for the same pod.\n\nThe branch's Helm recording-rule template follows this pattern. A recording rule stores the result of a recurring PromQL expression as another series. Its configured CPU source, filters, and join labels must match the telemetry you actually scrape. For multiple clusters, carry the cluster label through matching, deduplication, and final grouping. A namespace/pod match alone is not globally unique.\n\nThis query requires CPU telemetry absent from your paste. The numerical 0.9 result above is a worked synthetic example. See [PromQL vector matching](https://prometheus.io/docs/prometheus/latest/querying/operators/#vector-matching).\n\nVerified implementation: [charts/karta/templates/exporter/prometheusrule.yaml:31](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/charts/karta/templates/exporter/prometheusrule.yaml#L31).","html":"\u003cp\u003eKarta\u2019s six families describe workload state and relationships. They do not directly measure CPU, GPU utilization, latency, or memory usage. Other exporters can provide those measurements per pod or container.\u003c/p\u003e\n\u003cp\u003eA join pairs a measurement with its matching identity row. Multiplying by the info value 1 preserves the measurement while copying selected workload labels.\u003c/p\u003e\n\u003ch4 id=\"worked-example-synthetic-cpu-measurements\"\u003eWorked example: synthetic CPU measurements\u003c/h4\u003e\n\u003cp\u003eThese are teaching values, not measurements from your paste:\u003c/p\u003e\n\u003ctable\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003ePod\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eCPU rate\u003c/th\u003e\n\u003cth\u003eKarta workload\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003efrontend-example\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0.2 CPU cores\u003c/td\u003e\n\u003ctd\u003edynamo-smoke\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003edecode-example\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e0.7 CPU cores\u003c/td\u003e\n\u003ctd\u003edynamo-smoke\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003eAfter matching by namespace and pod, each CPU value is multiplied by 1. Summing the enriched rows for that workload gives 0.9 cores.\u003c/p\u003e\n\u003ch4 id=\"optional-query-to-study\"\u003eOptional query to study\u003c/h4\u003e\n\u003cp\u003eFor a single cluster, with one deduplicated CPU source and one consistent attribution per pod:\u003c/p\u003e\n\u003cpre class=\"promql\"\u003e\u003ccode\u003esum by (namespace, workload, workload_kind, workload_group) (\n  rate(container_cpu_usage_seconds_total{container!=\u0026quot;\u0026quot;}[5m])\n  * on (namespace, pod)\n    group_left (workload, workload_kind, workload_group)\n    max by (namespace, pod, workload, workload_kind, workload_group) (\n      karta_pod_workload_info\n    )\n)\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003erate\u003c/code\u003e converts accumulated CPU seconds into CPU seconds per second, or cores. \u003ccode\u003eon\u003c/code\u003e names the labels used to match. \u003ccode\u003egroup_left\u003c/code\u003e permits multiple container measurements to share one pod identity and copies the named labels from that identity. \u003ccode\u003emax by\u003c/code\u003e collapses duplicate info rows with the same retained labels. It cannot reconcile conflicting workload mappings for the same pod.\u003c/p\u003e\n\u003cp\u003eThe branch\u2019s Helm recording-rule template follows this pattern. A recording rule stores the result of a recurring PromQL expression as another series. Its configured CPU source, filters, and join labels must match the telemetry you actually scrape. For multiple clusters, carry the cluster label through matching, deduplication, and final grouping. A namespace/pod match alone is not globally unique.\u003c/p\u003e\n\u003cp\u003eThis query requires CPU telemetry absent from your paste. The numerical 0.9 result above is a worked synthetic example. See \u003ca href=\"https://prometheus.io/docs/prometheus/latest/querying/operators/#vector-matching\"\u003ePromQL vector matching\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/charts/karta/templates/exporter/prometheusrule.yaml#L31\"\u003echarts/karta/templates/exporter/prometheusrule.yaml:31\u003c/a\u003e.\u003c/p\u003e\n","minutes":7,"sources":[{"path":"charts/karta/templates/exporter/prometheusrule.yaml","line":31,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/charts/karta/templates/exporter/prometheusrule.yaml#L31","text":"        {{- $joinClause := printf \"* on (%s) group_left (%s) %s\" $join $level.groupLeft $info }}\n        - record: karta:gpu_utilization:{{ $level.suffix }}\n          expr: |\n            avg by (namespace, {{ $level.groupLeft }}) (\n              {{ $rule.gpuUtilizationMetric }}\n              {{ $joinClause }}\n            )\n        - record: karta:gpu_memory_used_bytes:{{ $level.suffix }}\n          expr: |\n            sum by (namespace, {{ $level.groupLeft }}) (\n              ({{ $rule.gpuMemoryUsedMetric }} * 1048576)\n              {{ $joinClause }}\n            )\n        - record: karta:gpu_memory_total_bytes:{{ $level.suffix }}\n          expr: |\n            sum by (namespace, {{ $level.groupLeft }}) (\n              (({{ $rule.gpuMemoryUsedMetric }} + {{ $rule.gpuMemoryFreeMetric }}) * 1048576)\n              {{ $joinClause }}\n            )\n        - record: karta:cpu_usage_cores:{{ $level.suffix }}\n          expr: |\n            sum by (namespace, {{ $level.groupLeft }}) (\n              rate({{ $rule.cpuUsageMetric }}{container!=\"\"}[{{ $rule.cpuRateWindow }}])\n              {{ $joinClause }}\n            )\n        - record: karta:memory_working_set_bytes:{{ $level.suffix }}\n          expr: |\n            sum by (namespace, {{ $level.groupLeft }}) (\n              {{ $rule.memoryWorkingSetMetric }}{container!=\"\"}\n              {{ $joinClause }}\n            )\n        {{- end }}\n        # Attribution health: the fraction of pod-attributed GPU series that\n        # join the identity series. Free GPUs carry no pod label and are not\n        # attribution failures, so they are excluded from both sides. A drop\n        # below 1 means a label mismatch between the telemetry source and the\n        # exporter; alert on it.\n        - record: karta:join_coverage:ratio\n          expr: |\n            count({{ $rule.gpuUtilizationMetric }}{pod!=\"\"} * on ({{ $join }}) group_left ()\n              max by ({{ $join }}) (karta_pod_workload_info))\n            /\n            count({{ $rule.gpuUtilizationMetric }}{pod!=\"\"})"}],"questions":[{"type":"text","prompt":"Two synthetic pod CPU rates are 0.4 and 0.8 cores. After multiplying both by their info value 1 and summing, what is the result?","answer":"1.2","hint":"Multiplication by 1 keeps both measurements unchanged.","explanation":"0.4 + 0.8 = 1.2 CPU cores.","id":"metrics-l12-q1-v1"},{"type":"choice","prompt":"Two clusters both have default/api-0. Which join is safer when cluster labels exist on both sides?","options":["on (namespace, pod)","on (cluster, namespace, pod)","on (workload)"],"answer":1,"hint":"The match must distinguish the two clusters.","explanation":"Including cluster distinguishes otherwise identical namespace/pod names.","wrong":{"0":"Those names collide across clusters.","2":"The raw per-pod CPU metric may not even have a workload label."},"id":"metrics-l12-q2-v1"}],"stretch":"Why does removing UID duplicates help with name reuse but still not resolve a pod that has two conflicting workload mappings?"},{"id":13,"module":"4 / Use the metrics","title":"Missing, zero, and exporter health","goal":"Understand which evidence can support a conclusion.","markdown":"Zero means an emitted numeric value is zero. Missing means there is no matching emitted row. These facts require different interpretations.\n\n| Observation | Supported interpretation |\n|---|---|\n| `phase=\"Pending\"` pod count is 0 | No stored attributed pod is counted in that phase for this instance |\n| A status flag is 0 | That normalized status did not match in the emitted state |\n| Status rows are absent | Possibly no status definition, evaluation failure, absent workload, or unavailable data; investigate |\n| An info row disappears | The record is no longer emitted; deletion is one possible cause |\n| HTTP scrape fails | Measurements are unavailable from that scrape, not evidence of zero workloads |\n\n#### Metrics about the exporter itself\n\n| Family | Type | Meaning |\n|---|---|---|\n| `karta_exporter_workloads` | Gauge | Tracked workload records |\n| `karta_exporter_kartas` | Gauge | Definition counts by validity and reason |\n| `karta_exporter_unattributed_pods` | Gauge | Parked or incompletely attributed pods, by tracked reason |\n| `karta_exporter_attribution_errors_total` | Counter | Attribution and status-evaluation error events |\n| `karta_exporter_last_event_timestamp_seconds` | Gauge | Unix time of the last processed watch event |\n\n`unattributed_pods{reason=\"no_owner\"}` uses the count of pods parked on a missing owner in this implementation. It is not an inventory of every unrelated pod on the cluster.\n\n#### Worked example\n\nStart: metrics requests succeed, but the last-event timestamp is old. This may be a quiet cluster or a watch problem. A timestamp alone does not distinguish the two. Check error counters, readiness, and whether expected Kubernetes changes are appearing.\n\nPrometheus also generates its own `up` metric for scrape targets. `up=1` means its scrape succeeded; `up=0` means it failed. It is not a workload Running flag. See [Prometheus jobs and instances](https://prometheus.io/docs/concepts/jobs_instances/).\n\nThese exporter-wide families typically have no workload-name label, so your `grep 'dynamo-smoke'` hides them. The endpoint also registers Go and process metrics. Do not conclude that every metric on the entire endpoint is a gauge just because your six workload families are.\n\nVerified implementation: [exporter/pkg/collector/collector.go:173](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L173), [exporter/pkg/controller/controller.go:102](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/controller.go#L102), [exporter/pkg/server/server.go:23](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23), [exporter/pkg/controller/events.go:268](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L268).","html":"\u003cp\u003eZero means an emitted numeric value is zero. Missing means there is no matching emitted row. These facts require different interpretations.\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 50%\" /\u003e\n\u003ccol style=\"width: 50%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eObservation\u003c/th\u003e\n\u003cth\u003eSupported interpretation\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ephase=\"Pending\"\u003c/code\u003e pod count is 0\u003c/td\u003e\n\u003ctd\u003eNo stored attributed pod is counted in that phase for this instance\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eA status flag is 0\u003c/td\u003e\n\u003ctd\u003eThat normalized status did not match in the emitted state\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eStatus rows are absent\u003c/td\u003e\n\u003ctd\u003ePossibly no status definition, evaluation failure, absent workload, or unavailable data; investigate\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eAn info row disappears\u003c/td\u003e\n\u003ctd\u003eThe record is no longer emitted; deletion is one possible cause\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eHTTP scrape fails\u003c/td\u003e\n\u003ctd\u003eMeasurements are unavailable from that scrape, not evidence of zero workloads\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch4 id=\"metrics-about-the-exporter-itself\"\u003eMetrics about the exporter itself\u003c/h4\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003ccol style=\"width: 33%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFamily\u003c/th\u003e\n\u003cth\u003eType\u003c/th\u003e\n\u003cth\u003eMeaning\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_exporter_workloads\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eTracked workload records\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_exporter_kartas\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eDefinition counts by validity and reason\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_exporter_unattributed_pods\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eParked or incompletely attributed pods, by tracked reason\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_exporter_attribution_errors_total\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eCounter\u003c/td\u003e\n\u003ctd\u003eAttribution and status-evaluation error events\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003e\u003ccode\u003ekarta_exporter_last_event_timestamp_seconds\u003c/code\u003e\u003c/td\u003e\n\u003ctd\u003eGauge\u003c/td\u003e\n\u003ctd\u003eUnix time of the last processed watch event\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003cp\u003e\u003ccode\u003eunattributed_pods{reason=\"no_owner\"}\u003c/code\u003e uses the count of pods parked on a missing owner in this implementation. It is not an inventory of every unrelated pod on the cluster.\u003c/p\u003e\n\u003ch4 id=\"worked-example\"\u003eWorked example\u003c/h4\u003e\n\u003cp\u003eStart: metrics requests succeed, but the last-event timestamp is old. This may be a quiet cluster or a watch problem. A timestamp alone does not distinguish the two. Check error counters, readiness, and whether expected Kubernetes changes are appearing.\u003c/p\u003e\n\u003cp\u003ePrometheus also generates its own \u003ccode\u003eup\u003c/code\u003e metric for scrape targets. \u003ccode\u003eup=1\u003c/code\u003e means its scrape succeeded; \u003ccode\u003eup=0\u003c/code\u003e means it failed. It is not a workload Running flag. See \u003ca href=\"https://prometheus.io/docs/concepts/jobs_instances/\"\u003ePrometheus jobs and instances\u003c/a\u003e.\u003c/p\u003e\n\u003cp\u003eThese exporter-wide families typically have no workload-name label, so your \u003ccode\u003egrep 'dynamo-smoke'\u003c/code\u003e hides them. The endpoint also registers Go and process metrics. Do not conclude that every metric on the entire endpoint is a gauge just because your six workload families are.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L173\"\u003eexporter/pkg/collector/collector.go:173\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/controller.go#L102\"\u003eexporter/pkg/controller/controller.go:102\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23\"\u003eexporter/pkg/server/server.go:23\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L268\"\u003eexporter/pkg/controller/events.go:268\u003c/a\u003e.\u003c/p\u003e\n","minutes":7,"sources":[{"path":"exporter/pkg/collector/collector.go","line":173,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L173","text":"func (c *Collector) collectSelf(ch chan\u003c- prometheus.Metric, snapshot store.Snapshot) {\n\tch \u003c- prometheus.MustNewConstMetric(c.workloadsDesc, prometheus.GaugeValue, float64(len(snapshot.Workloads)))\n\n\tunknownInstance, jqErrors := 0, 0\n\tfor _, pod := range snapshot.Pods {\n\t\tswitch pod.Reason {\n\t\tcase ReasonUnknownInstance:\n\t\t\tunknownInstance++\n\t\tcase ReasonJQError:\n\t\t\tjqErrors++\n\t\t}\n\t}\n\tpending := 0\n\tif c.options.PendingPods != nil {\n\t\tpending = c.options.PendingPods()\n\t}\n\tch \u003c- prometheus.MustNewConstMetric(c.unattributedDesc, prometheus.GaugeValue, float64(pending), ReasonNoOwner)\n\tch \u003c- prometheus.MustNewConstMetric(c.unattributedDesc, prometheus.GaugeValue, float64(unknownInstance), ReasonUnknownInstance)\n\tch \u003c- prometheus.MustNewConstMetric(c.unattributedDesc, prometheus.GaugeValue, float64(jqErrors), ReasonJQError)\n\n\tif c.options.KartaCounts != nil {\n\t\tvalid, invalid, shadowed := c.options.KartaCounts()\n\t\tch \u003c- prometheus.MustNewConstMetric(c.kartasDesc, prometheus.GaugeValue, float64(valid), \"true\", \"\")\n\t\tch \u003c- prometheus.MustNewConstMetric(c.kartasDesc, prometheus.GaugeValue, float64(invalid), \"false\", ReasonInvalid)\n\t\tch \u003c- prometheus.MustNewConstMetric(c.kartasDesc, prometheus.GaugeValue, float64(shadowed), \"false\", ReasonShadowed)\n\t}"},{"path":"exporter/pkg/controller/controller.go","line":102,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/controller.go#L102","text":"\t\twatchers:       make(map[schema.GroupVersionKind]*watcher),\n\t\tattributionErrors: prometheus.NewCounterVec(prometheus.CounterOpts{\n\t\t\tName: collector.MetricExporterAttributionErrors,\n\t\t\tHelp: \"Attribution and status evaluation errors, by reason.\",\n\t\t}, []string{collector.LabelReason}),\n\t\tlastEvent: prometheus.NewGauge(prometheus.GaugeOpts{\n\t\t\tName: collector.MetricExporterLastEventSeconds,\n\t\t\tHelp: \"Unix timestamp of the last processed watch event. A freshness witness.\",\n\t\t}),\n\t}\n\tregisterer.MustRegister(controller.attributionErrors, controller.lastEvent)\n\treturn controller\n}\n\n// Ready reports whether all informers, including per-workload-kind watchers,"},{"path":"exporter/pkg/server/server.go","line":23,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/server/server.go#L23","text":"\nfunc New(addr string, gatherer prometheus.Gatherer, ready func() bool) *Server {\n\tmux := http.NewServeMux()\n\tmetricsHandler := promhttp.HandlerFor(gatherer, promhttp.HandlerOpts{})\n\teverReady := false\n\tmux.HandleFunc(\"/metrics\", func(w http.ResponseWriter, r *http.Request) {\n\t\t// a half-built store must fail the scrape visibly, not serve\n\t\t// plausible zeros; once synced, keep serving forever\n\t\tif !everReady {\n\t\t\tif !ready() {\n\t\t\t\tw.WriteHeader(http.StatusServiceUnavailable)\n\t\t\t\treturn\n\t\t\t}\n\t\t\teverReady = true\n\t\t}\n\t\tmetricsHandler.ServeHTTP(w, r)\n\t})\n\tmux.HandleFunc(\"/healthz\", func(w http.ResponseWriter, _ *http.Request) {\n\t\tw.WriteHeader(http.StatusOK)\n\t})\n\tmux.HandleFunc(\"/readyz\", func(w http.ResponseWriter, _ *http.Request) {\n\t\tif ready() {\n\t\t\tw.WriteHeader(http.StatusOK)\n\t\t\treturn\n\t\t}\n\t\tw.WriteHeader(http.StatusServiceUnavailable)\n\t})"},{"path":"exporter/pkg/controller/events.go","line":268,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/controller/events.go#L268","text":"\t\tfor _, waitingKey := range waiting {\n\t\t\tif waitingKey != podKey {\n\t\t\t\tc.attributePodByKey(waitingKey)\n\t\t\t}\n\t\t}\n\t}()\n\n\tresult := c.index.RootFor(pod.OwnerReferences, c.registry.IsRoot)\n\tswitch result.Outcome {\n\tcase owner.OutcomeFound:\n\tcase owner.OutcomeMissing:\n\t\tc.index.MarkPending(result.Missing, podKey)\n\t\treturn\n\tcase owner.OutcomeDepthExceeded:\n\t\tc.attributionErrors.WithLabelValues(collector.ReasonNoOwner).Inc()\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\tdefault:\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\t}\n\n\tgroupKind := result.Root.GVK.GroupKind()\n\tentry, ok := c.registry.EntryFor(groupKind)\n\tif !ok {\n\t\tc.store.DeletePod(pod.UID)\n\t\treturn\n\t}\n\n\tworkloadStore := c.rootWatcherStore(groupKind)\n\tif workloadStore == nil {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\n\titem, exists, err := workloadStore.GetByKey(pod.Namespace + \"/\" + result.Root.Name)\n\tif err != nil || !exists {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\tworkload, ok := item.(*unstructured.Unstructured)\n\tif !ok || workload.GetUID() != result.Root.UID {\n\t\tc.index.MarkPending(result.Root.UID, podKey)\n\t\treturn\n\t}\n\n\tinstanceIDs := map[string][]string{}\n\tif record, ok := c.store.Workload(workload.GetUID()); ok {\n\t\tfor _, componentState := range record.Components {\n\t\t\tinstanceIDs[componentState.Component] = append(instanceIDs[componentState.Component], componentState.Instance)\n\t\t}\n\t} else {\n\t\tcomputed, err := attribute.InstanceIDs(context.Background(), entry, workload)\n\t\tif err != nil {\n\t\t\tc.attributionErrors.WithLabelValues(collector.ReasonJQError).Inc()\n\t\t} else {\n\t\t\tinstanceIDs = computed\n\t\t}\n\t}\n\n\tattribution := attribute.Attribute(context.Background(), pod, entry, instanceIDs)\n\tif attribution.Reason != \"\" {\n\t\tc.attributionErrors.WithLabelValues(attribution.Reason).Inc()\n\t}\n\n\tworkloadGVK := workload.GroupVersionKind()\n\tc.store.UpsertPod(store.PodRecord{\n\t\tUID:         pod.UID,\n\t\tNamespace:   pod.Namespace,\n\t\tName:        pod.Name,\n\t\tWorkloadUID: workload.GetUID(),\n\t\tWorkload: store.WorkloadRef{\n\t\t\tNamespace: workload.GetNamespace(),\n\t\t\tName:      workload.GetName(),\n\t\t\tGroup:     workloadGVK.Group,\n\t\t\tVersion:   workloadGVK.Version,\n\t\t\tKind:      workloadGVK.Kind,\n\t\t},\n\t\tComponent: attribution.Component,\n\t\tInstance:  attribution.Instance,\n\t\tReplica:   attribution.Replica,\n\t\tReason:    attribution.Reason,\n\t\tPhase:     pod.Status.Phase,\n\t})\n}\n\nfunc instanceSetChanged(previous, current []store.ComponentState) bool {"}],"questions":[{"type":"choice","prompt":"A metrics scrape fails. What pod count should a dashboard infer?","options":["Zero","The last desired count","No current count can be inferred from that failed scrape"],"answer":2,"hint":"Failure to observe is not an observed zero.","explanation":"Treat the missing observation as unavailable data.","wrong":{"0":"A failed scrape supplies no pod-count measurement.","1":"Desired state cannot replace an unavailable observation."},"id":"metrics-l13-q1-v1"},{"type":"choice","prompt":"The last-event timestamp is 20 minutes old. Does that prove the watcher is broken?","options":["Yes, always","No; the cluster could be quiet","It proves every workload is completed"],"answer":1,"hint":"A freshness witness needs expected activity for interpretation.","explanation":"Quiet periods and stalled watches can both produce an old timestamp.","wrong":{"0":"Without expected events, age alone is insufficient.","2":"Workload completion is unrelated to the last-event timestamp."},"id":"metrics-l13-q2-v1"}],"stretch":"What known test change could distinguish a quiet exporter from one that is failing to observe updates?"},{"id":14,"module":"5 / Put it together","title":"Read your complete snapshot and try a live lab","goal":"Explain all 59 rows, then inspect a real endpoint when available.","markdown":"Your supplied excerpt contains 59 sample rows across six metric families. The interpretation below is limited to that supplied snapshot, not a fresh cluster inspection.\n\n| Family | Rows | What your values say |\n|---|---:|---|\n| Pod workload info | 2 | Two pod attribution records, both under Dynamo |\n| Workload component pods | 20 | Four component-instance groups x five pod phases; two Running pods in total |\n| Workload component replicas | 4 | Each tracked component instance requests 1 by its Karta scale definition |\n| Workload generation | 3 | Each workload exposes generation 1 |\n| Workload info | 3 | One DynamoGraphDeployment and two Deployments |\n| Workload status | 27 | Three workloads x nine flags; each has Running=1 and other flags=0 |\n\n#### Worked reading\n\n`dynamo-smoke` has two named instances, Frontend and decode. Each requests 1 and has one attributed Running pod. Both pod info records have an empty replica key. The child Deployments remain separately described workload objects, but their pods are attributed to the parent, so their pod-phase counts are zero. The snapshot does not establish readiness, resource utilization, latency, or historical failures.\n\nThese are 59 simultaneous series in the supplied response. Repeated scrapes add samples over time. Adding pods or changing labels can add series. This is why label combinations, not just family names, determine cardinality, the number of distinct series.\n\n#### Optional live lab: read-only, requires your endpoint\n\nSet the shell environment variable `METRICS_URL` to the full URL of your own exporter metrics endpoint. The following commands have been checked for syntax. They were not run against your cluster. Run the curl once to keep all inspections on the same snapshot:\n\n```sh\ncurl -fsS \"$METRICS_URL\" -o /tmp/karta-metrics.txt\n```\n\nThen run each inspection separately:\n\n```sh\ngrep -E '^# (HELP|TYPE) karta_' /tmp/karta-metrics.txt\n```\n\n```sh\ngrep -E '^karta_.*workload=\"dynamo-smoke\"' /tmp/karta-metrics.txt\n```\n\n```sh\ngrep -E '^karta_exporter_' /tmp/karta-metrics.txt\n```\n\nThe exact `workload=\"dynamo-smoke\"` filter excludes child names such as `dynamo-smoke-frontend`. Your original substring search includes them. The first command shows both HELP and TYPE; workload filtering would hide these metadata lines.\n\nIf the endpoint is unavailable, use the Metrics lab tab. It models one Dynamo component locally and makes no cluster requests.\n\n#### Before the final exam\n\nExplain one row aloud: name, labels, value, type, source of the value, and one thing it cannot tell you. Then take the Final exam tab. Every lesson is open; nothing requires a passing score to continue.\n\nVerified implementation: [exporter/pkg/collector/collector_test.go:16](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector_test.go#L16), [exporter/pkg/collector/collector.go:128](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128), [exporter/pkg/collector/collector.go:76](https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76).","html":"\u003cp\u003eYour supplied excerpt contains 59 sample rows across six metric families. The interpretation below is limited to that supplied snapshot, not a fresh cluster inspection.\u003c/p\u003e\n\u003ctable\u003e\n\u003ccolgroup\u003e\n\u003ccol style=\"width: 30%\" /\u003e\n\u003ccol style=\"width: 40%\" /\u003e\n\u003ccol style=\"width: 30%\" /\u003e\n\u003c/colgroup\u003e\n\u003cthead\u003e\n\u003ctr\u003e\n\u003cth\u003eFamily\u003c/th\u003e\n\u003cth style=\"text-align: right;\"\u003eRows\u003c/th\u003e\n\u003cth\u003eWhat your values say\u003c/th\u003e\n\u003c/tr\u003e\n\u003c/thead\u003e\n\u003ctbody\u003e\n\u003ctr\u003e\n\u003ctd\u003ePod workload info\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e2\u003c/td\u003e\n\u003ctd\u003eTwo pod attribution records, both under Dynamo\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWorkload component pods\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e20\u003c/td\u003e\n\u003ctd\u003eFour component-instance groups x five pod phases; two Running pods in total\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWorkload component replicas\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e4\u003c/td\u003e\n\u003ctd\u003eEach tracked component instance requests 1 by its Karta scale definition\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWorkload generation\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e3\u003c/td\u003e\n\u003ctd\u003eEach workload exposes generation 1\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWorkload info\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e3\u003c/td\u003e\n\u003ctd\u003eOne DynamoGraphDeployment and two Deployments\u003c/td\u003e\n\u003c/tr\u003e\n\u003ctr\u003e\n\u003ctd\u003eWorkload status\u003c/td\u003e\n\u003ctd style=\"text-align: right;\"\u003e27\u003c/td\u003e\n\u003ctd\u003eThree workloads x nine flags; each has Running=1 and other flags=0\u003c/td\u003e\n\u003c/tr\u003e\n\u003c/tbody\u003e\n\u003c/table\u003e\n\u003ch4 id=\"worked-reading\"\u003eWorked reading\u003c/h4\u003e\n\u003cp\u003e\u003ccode\u003edynamo-smoke\u003c/code\u003e has two named instances, Frontend and decode. Each requests 1 and has one attributed Running pod. Both pod info records have an empty replica key. The child Deployments remain separately described workload objects, but their pods are attributed to the parent, so their pod-phase counts are zero. The snapshot does not establish readiness, resource utilization, latency, or historical failures.\u003c/p\u003e\n\u003cp\u003eThese are 59 simultaneous series in the supplied response. Repeated scrapes add samples over time. Adding pods or changing labels can add series. This is why label combinations, not just family names, determine cardinality, the number of distinct series.\u003c/p\u003e\n\u003ch4 id=\"optional-live-lab-read-only-requires-your-endpoint\"\u003eOptional live lab: read-only, requires your endpoint\u003c/h4\u003e\n\u003cp\u003eSet the shell environment variable \u003ccode\u003eMETRICS_URL\u003c/code\u003e to the full URL of your own exporter metrics endpoint. The following commands have been checked for syntax. They were not run against your cluster. Run the curl once to keep all inspections on the same snapshot:\u003c/p\u003e\n\u003cdiv class=\"sourceCode\" id=\"cb1\"\u003e\u003cpre class=\"sourceCode sh\"\u003e\u003ccode class=\"sourceCode bash\"\u003e\u003cspan id=\"cb1-1\"\u003e\u003ca href=\"#cb1-1\" aria-hidden=\"true\" tabindex=\"-1\"\u003e\u003c/a\u003e\u003cspan class=\"ex\"\u003ecurl\u003c/span\u003e \u003cspan class=\"at\"\u003e-fsS\u003c/span\u003e \u003cspan class=\"st\"\u003e\u0026quot;\u003c/span\u003e\u003cspan class=\"va\"\u003e$METRICS_URL\u003c/span\u003e\u003cspan class=\"st\"\u003e\u0026quot;\u003c/span\u003e \u003cspan class=\"at\"\u003e-o\u003c/span\u003e /tmp/karta-metrics.txt\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n\u003cp\u003eThen run each inspection separately:\u003c/p\u003e\n\u003cdiv class=\"sourceCode\" id=\"cb2\"\u003e\u003cpre class=\"sourceCode sh\"\u003e\u003ccode class=\"sourceCode bash\"\u003e\u003cspan id=\"cb2-1\"\u003e\u003ca href=\"#cb2-1\" aria-hidden=\"true\" tabindex=\"-1\"\u003e\u003c/a\u003e\u003cspan class=\"fu\"\u003egrep\u003c/span\u003e \u003cspan class=\"at\"\u003e-E\u003c/span\u003e \u003cspan class=\"st\"\u003e\u0026#39;^# (HELP|TYPE) karta_\u0026#39;\u003c/span\u003e /tmp/karta-metrics.txt\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n\u003cdiv class=\"sourceCode\" id=\"cb3\"\u003e\u003cpre class=\"sourceCode sh\"\u003e\u003ccode class=\"sourceCode bash\"\u003e\u003cspan id=\"cb3-1\"\u003e\u003ca href=\"#cb3-1\" aria-hidden=\"true\" tabindex=\"-1\"\u003e\u003c/a\u003e\u003cspan class=\"fu\"\u003egrep\u003c/span\u003e \u003cspan class=\"at\"\u003e-E\u003c/span\u003e \u003cspan class=\"st\"\u003e\u0026#39;^karta_.*workload=\u0026quot;dynamo-smoke\u0026quot;\u0026#39;\u003c/span\u003e /tmp/karta-metrics.txt\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n\u003cdiv class=\"sourceCode\" id=\"cb4\"\u003e\u003cpre class=\"sourceCode sh\"\u003e\u003ccode class=\"sourceCode bash\"\u003e\u003cspan id=\"cb4-1\"\u003e\u003ca href=\"#cb4-1\" aria-hidden=\"true\" tabindex=\"-1\"\u003e\u003c/a\u003e\u003cspan class=\"fu\"\u003egrep\u003c/span\u003e \u003cspan class=\"at\"\u003e-E\u003c/span\u003e \u003cspan class=\"st\"\u003e\u0026#39;^karta_exporter_\u0026#39;\u003c/span\u003e /tmp/karta-metrics.txt\u003c/span\u003e\u003c/code\u003e\u003c/pre\u003e\u003c/div\u003e\n\u003cp\u003eThe exact \u003ccode\u003eworkload=\"dynamo-smoke\"\u003c/code\u003e filter excludes child names such as \u003ccode\u003edynamo-smoke-frontend\u003c/code\u003e. Your original substring search includes them. The first command shows both HELP and TYPE; workload filtering would hide these metadata lines.\u003c/p\u003e\n\u003cp\u003eIf the endpoint is unavailable, use the Metrics lab tab. It models one Dynamo component locally and makes no cluster requests.\u003c/p\u003e\n\u003ch4 id=\"before-the-final-exam\"\u003eBefore the final exam\u003c/h4\u003e\n\u003cp\u003eExplain one row aloud: name, labels, value, type, source of the value, and one thing it cannot tell you. Then take the Final exam tab. Every lesson is open; nothing requires a passing score to continue.\u003c/p\u003e\n\u003cp\u003eVerified implementation: \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector_test.go#L16\"\u003eexporter/pkg/collector/collector_test.go:16\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128\"\u003eexporter/pkg/collector/collector.go:128\u003c/a\u003e, \u003ca href=\"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76\"\u003eexporter/pkg/collector/collector.go:76\u003c/a\u003e.\u003c/p\u003e\n","minutes":7,"sources":[{"path":"exporter/pkg/collector/collector_test.go","line":16,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector_test.go#L16","text":"\n\t\"github.com/dsx-ai-factory/workload-map/exporter/pkg/store\"\n)\n\n// goldenContract is the label-contract regression gate: any change to metric\n// names, label names, or series shape fails this test visibly.\nconst goldenContract = `# HELP karta_pod_workload_info Pod to workload, component, and component instance attribution derived from the Karta definition. Value is always 1.\n# TYPE karta_pod_workload_info gauge\nkarta_pod_workload_info{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",pod=\"decode-0\",replica=\"\",uid=\"p2\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_pod_workload_info{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",pod=\"prefill-0\",replica=\"\",uid=\"p1\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\n# HELP karta_workload_component_pods Observed pod count per component instance, broken down by pod phase.\n# TYPE karta_workload_component_pods gauge\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Failed\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Pending\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Running\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Succeeded\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",phase=\"Unknown\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Failed\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Pending\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Running\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Succeeded\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_component_pods{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",phase=\"Unknown\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\n# HELP karta_workload_component_replicas Desired replicas per component instance, from the workload spec.\n# TYPE karta_workload_component_replicas gauge\nkarta_workload_component_replicas{component=\"replicatedjob\",component_instance=\"decode\",namespace=\"team-a\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_workload_component_replicas{component=\"replicatedjob\",component_instance=\"prefill\",namespace=\"team-a\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 2\n# HELP karta_workload_generation The workload's metadata.generation. A step change marks a spec change.\n# TYPE karta_workload_generation gauge\nkarta_workload_generation{namespace=\"team-a\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 3\n# HELP karta_workload_info Identity and provenance of a Karta-described workload. Value is always 1.\n# TYPE karta_workload_info gauge\nkarta_workload_info{karta=\"jobset-x-k8s-io-jobset-v1alpha2\",namespace=\"team-a\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\",workload_version=\"v1alpha2\"} 1\n# HELP karta_workload_status Normalized workload status. One series per phase; several phases can be 1 at the same time.\n# TYPE karta_workload_status gauge\nkarta_workload_status{namespace=\"team-a\",phase=\"Completed\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Degraded\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Failed\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Initializing\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Resuming\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Running\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 1\nkarta_workload_status{namespace=\"team-a\",phase=\"Suspended\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Suspending\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\nkarta_workload_status{namespace=\"team-a\",phase=\"Undefined\",workload=\"llm\",workload_group=\"jobset.x-k8s.io\",workload_kind=\"JobSet\"} 0\n`\n\nfunc fixtureStore() *store.Store {\n\ts := store.New()\n\tref := store.WorkloadRef{Namespace: \"team-a\", Name: \"llm\", Group: \"jobset.x-k8s.io\", Version: \"v1alpha2\", Kind: \"JobSet\"}\n\n\ts.UpsertWorkload(store.WorkloadRecord{\n\t\tUID:        \"w1\",\n\t\tRef:        ref,\n\t\tKarta:      \"jobset-x-k8s-io-jobset-v1alpha2\","},{"path":"exporter/pkg/collector/collector.go","line":128,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L128","text":"\ntype componentKey struct {\n\tworkloadUID types.UID\n\tcomponent   string\n\tinstance    string\n}\n\n// collectComponentPods emits pod counts per component instance and pod phase.\n// The instance set is the union of instances declared by the workload spec\n// and instances observed on pods, zero-filled across all pod phases so\n// under-replication math never breaks on a missing series.\nfunc (c *Collector) collectComponentPods(ch chan\u003c- prometheus.Metric, snapshot store.Snapshot) {\n\trefs := make(map[types.UID]store.WorkloadRef, len(snapshot.Workloads))\n\tkeys := make(map[componentKey]struct{})\n\tcounts := make(map[componentKey]map[string]int)\n\n\tfor _, workload := range snapshot.Workloads {\n\t\trefs[workload.UID] = workload.Ref\n\t\tfor _, component := range workload.Components {\n\t\t\tkeys[componentKey{workload.UID, component.Component, component.Instance}] = struct{}{}\n\t\t}\n\t}\n\n\tfor _, pod := range snapshot.Pods {\n\t\tif _, ok := refs[pod.WorkloadUID]; !ok {\n\t\t\trefs[pod.WorkloadUID] = pod.Workload\n\t\t}\n\t\tkey := componentKey{pod.WorkloadUID, pod.Component, pod.Instance}\n\t\tkeys[key] = struct{}{}\n\t\tif counts[key] == nil {\n\t\t\tcounts[key] = make(map[string]int)\n\t\t}\n\t\tcounts[key][string(pod.Phase)]++\n\t}\n\n\tfor key := range keys {\n\t\tref := refs[key.workloadUID]\n\t\tfor _, phase := range AllPodPhases {\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentPodsDesc, prometheus.GaugeValue,\n\t\t\t\tfloat64(counts[key][string(phase)]),\n\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, key.component, key.instance, string(phase))\n\t\t}\n\t}"},{"path":"exporter/pkg/collector/collector.go","line":76,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d4ae56d1/exporter/pkg/collector/collector.go#L76","text":"\tch \u003c- c.componentReplicasDesc\n\tch \u003c- c.componentPodsDesc\n\tch \u003c- c.generationDesc\n\tch \u003c- c.workloadsDesc\n\tch \u003c- c.unattributedDesc\n\tch \u003c- c.kartasDesc\n}\n\nfunc (c *Collector) Collect(ch chan\u003c- prometheus.Metric) {\n\tsnapshot := c.store.Snapshot()\n\n\tfor _, pod := range snapshot.Pods {\n\t\tch \u003c- prometheus.MustNewConstMetric(c.podInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tpod.Namespace, pod.Name, string(pod.UID),\n\t\t\tpod.Workload.Name, pod.Workload.Kind, pod.Workload.Group,\n\t\t\tpod.Component, pod.Instance, pod.Replica)\n\t}\n\n\tfor _, workload := range snapshot.Workloads {\n\t\tref := workload.Ref\n\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadInfoDesc, prometheus.GaugeValue, 1,\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, ref.Version, workload.Karta)\n\t\tch \u003c- prometheus.MustNewConstMetric(c.generationDesc, prometheus.GaugeValue, float64(workload.Generation),\n\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group)\n\n\t\tif workload.HasStatus {\n\t\t\tmatched := make(map[string]struct{}, len(workload.Phases))\n\t\t\tfor _, phase := range workload.Phases {\n\t\t\t\tmatched[string(phase)] = struct{}{}\n\t\t\t}\n\t\t\tfor _, phase := range AllPhases {\n\t\t\t\tvalue := 0.0\n\t\t\t\tif _, ok := matched[string(phase)]; ok {\n\t\t\t\t\tvalue = 1.0\n\t\t\t\t}\n\t\t\t\tch \u003c- prometheus.MustNewConstMetric(c.workloadStatusDesc, prometheus.GaugeValue, value,\n\t\t\t\t\tref.Namespace, ref.Name, ref.Kind, ref.Group, string(phase))\n\t\t\t}\n\t\t}\n\n\t\tfor _, component := range workload.Components {\n\t\t\tif component.Replicas == nil {\n\t\t\t\tcontinue\n\t\t\t}\n\t\t\tch \u003c- prometheus.MustNewConstMetric(c.componentReplicasDesc, prometheus.GaugeValue, float64(*component.Replicas),"}],"questions":[{"type":"text","prompt":"A workload has three declared component instances and no pods. With five zero-filled pod phases per instance, how many component-pods rows are emitted?","answer":15,"hint":"Multiply instances by phases.","explanation":"3 x 5 = 15 zero-valued rows, even though no pod is counted.","id":"metrics-l14-q1-v1"},{"type":"choice","prompt":"Which filter selects only the parent workload rather than all names containing the smoke prefix?","options":["workload=\"dynamo-smoke\"","dynamo-smoke","phase=\"Running\""],"answer":0,"hint":"Use an exact label-value match.","explanation":"The exact workload name excludes longer child workload names.","wrong":{"1":"A plain substring also matches the child names.","2":"A phase filter says nothing about which workload is selected."},"id":"metrics-l14-q2-v1"}],"stretch":"If someone says these metrics prove Dynamo is healthy, which claims are supported and what additional evidence would be needed?"}],"sources":{"collector":{"path":"exporter/pkg/collector/collector.go","line":76,"url":"https://github.com/AviadHayumi/workload-map/blob/e09f6358bdb75abe19887dfefa39c529d
