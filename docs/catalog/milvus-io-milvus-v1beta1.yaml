kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: milvus-io-milvus-v1beta1
spec:
  structureDefinition:
    rootComponent:
      name: milvus
      kind:
        group: milvus.io
        version: v1beta1
        kind: Milvus
      statusDefinition:
        phaseDefinition:
          expression: object[?"status"][?"status"].orValue(null)
        conditionsDefinition:
          expression: object[?"status"][?"conditions"].orValue(null)
          typeFieldName: type
          statusFieldName: status
        statusMappings:
          initializing:
            - byPhase: Pending
            - byExpression:
                expression: variables.statusStatus == ""
                expectedResult: "true"
          running:
            - byPhase: Healthy
          degraded:
            - byPhase: Unhealthy
