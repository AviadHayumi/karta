kind: Karta
apiVersion: run.ai/v1alpha1
metadata:
  name: apps-nvidia-com-nimservice-v1alpha1
spec:
  structureDefinition:
    rootComponent:
      name: nimservice
      kind:
        group: apps.nvidia.com
        version: v1alpha1
        kind: NIMService
      specDefinition:
        fragmentedPodSpecDefinition:
          schedulerName:
            expression: object[?"spec"][?"schedulerName"].orValue(null)
            pathWrite: /spec/schedulerName
          labels:
            expression: object[?"spec"][?"labels"].orValue(null)
            pathWrite: /spec/labels
          annotations:
            expression: object[?"spec"][?"annotations"].orValue(null)
            pathWrite: /spec/annotations
          resources:
            expression: object[?"spec"][?"resources"].orValue(null)
            pathWrite: /spec/resources
          podAffinity:
            expression: object[?"spec"][?"affinity"][?"podAffinity"].orValue(null)
            pathWrite: /spec/affinity/podAffinity
          nodeAffinity:
            expression: object[?"spec"][?"affinity"][?"nodeAffinity"].orValue(null)
            pathWrite: /spec/affinity/nodeAffinity
      scaleDefinition:
        replicas:
          expression: variables.specReplicas
      statusDefinition:
        phaseDefinition:
          expression: object[?"status"][?"state"].orValue(null)
        conditionsDefinition:
          expression: object[?"status"][?"conditions"].orValue(null)
          typeFieldName: type
          statusFieldName: status
          messageFieldName: message
        statusMappings:
          initializing:
            - byExpression:
                expression: variables.statusState != "Ready" && variables.statusState != "Failed"
                expectedResult: "true"
          running:
            - byPhase: Ready
          failed:
            - byPhase: Failed
  optimizationInstructions:
    gangScheduling:
      podGroups:
        - name: service
          members:
            - componentName: nimservice
              groupByExpressions:
                - object[?"metadata"][?"labels"][?"app.kubernetes.io/name"].orValue(null)
  variables:
    - name: specReplicas
      expression: ([dyn(object[?"spec"][?"replicas"].orValue(null))].filter(v, v != null && v != false) + [1])[0]
    - name: statusState
      expression: ([dyn(object.?status.?state.orValue(null))].filter(v, v != null && v != false) + [""])[0]
