# v3 of the kyverno side: GlobalContext read with a DECLARED projection name.
apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: metric-suspend-running
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  evaluation:
    admission:
      enabled: false
    mutateExisting:
      enabled: true
  targetMatchConditions:
    - name: in-ai-team
      expression: "object.metadata.namespace == 'ai-team'"
    - name: not-already-suspended
      expression: "!object.spec.?suspend.orValue(false)"
    - name: exporter-says-running-2m
      expression: >-
        object.metadata.name in globalContext.Get('running-2m', 'workloads')
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: 'add', path: '/spec/suspend', value: true}]
