# Prototype: Kyverno perceives, Karta acts. The metric rule moves to a
# GeneratingPolicy whose only write is one ActionRequest per job, created
# with resource.Post from the generate expression. Kyverno never touches
# the job. Background failures on this path are already loud in 1.19.1.
apiVersion: policies.kyverno.io/v1alpha1
kind: GeneratingPolicy
metadata:
  name: pa-suspend
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
    objectSelector:
      matchLabels:
        bakeoff: pa
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ai-team
  evaluation:
    admission:
      enabled: false
    generateExisting:
      enabled: true
    synchronize:
      enabled: false
  variables:
    - name: requestName
      expression: "'suspend-pa-' + string(object.metadata.uid)"
    - name: prom
      expression: >-
        http.Get('http://prometheus.monitoring.svc:9090/api/v1/query?query=min_over_time%28karta_workload_status%7Bnamespace%3D%22ai-team%22%2Cphase%3D%22Running%22%2Cworkload_kind%3D%22Job%22%7D%5B2m%5D%29%3D%3D1%20and%20karta_workload_status%7Bnamespace%3D%22ai-team%22%2Cphase%3D%22Running%22%2Cworkload_kind%3D%22Job%22%7D%20offset%202m%20%3D%3D%201')
    - name: hits
      expression: >-
        variables.prom.data.result.filter(r,
          r.metric.workload == object.metadata.name &&
          r.metric.namespace == object.metadata.namespace)
    - name: eligible
      expression: "size(variables.hits) > 0"
    - name: requestBody
      expression: >-
        {
          "apiVersion": "rules.karta.run.ai/v1alpha1",
          "kind": "ActionRequest",
          "metadata": {
            "name": variables.requestName,
            "namespace": "karta-actions",
            "labels": {
              "rules.karta.run.ai/rule": "suspend-pa",
              "rules.karta.run.ai/target-uid": string(object.metadata.uid)
            }
          },
          "spec": {
            "ruleKey": "suspend-pa",
            "action": "Suspend",
            "target": {
              "group": "batch", "version": "v1", "kind": "Job",
              "namespace": object.metadata.namespace,
              "name": object.metadata.name,
              "uid": string(object.metadata.uid),
              "generation": object.metadata.generation
            },
            "policy": {"name": "pa-suspend", "kind": "GeneratingPolicy"},
            "evidence": {
              "query": 'min_over_time(karta_workload_status{namespace="ai-team",phase="Running",workload_kind="Job"}[2m])==1 and karta_workload_status{namespace="ai-team",phase="Running",workload_kind="Job"} offset 2m == 1',
              "value": string(variables.hits[0].value[1]),
              "sampleTime": string(variables.hits[0].value[0])
            }
          }
        }
  generate:
    - expression: >-
        dyn(resource.Get('rules.karta.run.ai/v1alpha1', 'actionrequests',
                         'karta-actions', variables.requestName)) != null
          ? true
          : (variables.eligible
              ? resource.Post('rules.karta.run.ai/v1alpha1', 'actionrequests',
                              'karta-actions', variables.requestBody).metadata.name
                  == variables.requestName
              : true)
