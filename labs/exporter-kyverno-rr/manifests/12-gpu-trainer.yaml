# goal A target: a job holding one fake gpu. the fake operator reads the pod
# annotation run.ai/simulated-gpu-utilization on every pod update, so the
# pod starts busy (90) and is flipped to idle (1) later with kubectl annotate.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-trainer
  namespace: ai-team
  labels: {team: ai, goal: a}
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: {goal: a}
      annotations:
        run.ai/simulated-gpu-utilization: "90"
    spec:
      restartPolicy: Never
      containers:
        - name: main
          image: busybox:1.36
          command: ["sh", "-c", "sleep 86400"]
          resources:
            limits: {nvidia.com/gpu: 1}
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
