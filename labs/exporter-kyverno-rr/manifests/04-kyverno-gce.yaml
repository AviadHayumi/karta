# Kyverno GlobalContextEntry polling the Prometheus query API for workloads
# whose exporter phase has been Running continuously for the last 2 minutes.
apiVersion: kyverno.io/v2alpha1
kind: GlobalContextEntry
metadata:
  name: running-2m
spec:
  apiCall:
    method: GET
    service:
      url: 'http://prometheus.monitoring.svc:9090/api/v1/query?query=min_over_time%28karta_workload_status%7Bnamespace%3D%22ai-team%22%2Cphase%3D%22Running%22%2Cworkload_kind%3D%22Job%22%7D%5B2m%5D%29%3D%3D1'
    refreshInterval: 15s
