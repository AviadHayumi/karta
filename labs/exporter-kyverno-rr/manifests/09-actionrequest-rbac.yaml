# The only new right Kyverno gets: read and create ActionRequests in one
# namespace. No status, no update, no delete, no workload write. In a real
# install this is the chart's backgroundController.rbac.clusterRole
# extraResources knob; here it is a Role so the grant stays confined.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-actionrequest-writer
  namespace: karta-actions
rules:
  - apiGroups: ["rules.karta.run.ai"]
    resources: ["actionrequests"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-actionrequest-writer
  namespace: karta-actions
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-actionrequest-writer
subjects:
  - kind: ServiceAccount
    name: kyverno-background-controller
    namespace: kyverno
