# Corrected GCE per Codex r2: projections are declared here and referenced
# by NAME from CEL; the second Get() argument is not a live JMESPath.
apiVersion: kyverno.io/v2alpha1
kind: GlobalContextEntry
metadata:
  name: running-2m
spec:
  apiCall:
    method: GET
    service:
      url: 'http://prometheus.monitoring.svc:9090/api/v1/query?query=min_over_time%28karta_workload_status%7Bnamespace%3D%22ai-team%22%2Cphase%3D%22Running%22%2Cworkload_kind%3D%22Job%22%7D%5B2m%5D%29%3D%3D1'
    refreshInterval: 15s
  projections:
    - name: workloads
      jmesPath: data.result[].metric.workload
