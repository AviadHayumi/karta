# v2 of the kyverno side: same rule, but the condition calls the Prometheus
# query API directly with the CEL http library instead of GlobalContext
# (globalContext.Get silently no-ops on the background path; Finding 2).
apiVersion: policies.kyverno.io/v1beta1
kind: MutatingPolicy
metadata:
  name: metric-suspend-running
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  evaluation:
    admission:
      enabled: false
    mutateExisting:
      enabled: true
  targetMatchConditions:
    - name: in-ai-team
      expression: "object.metadata.namespace == 'ai-team'"
    - name: not-already-suspended
      expression: "!object.spec.?suspend.orValue(false)"
    - name: exporter-says-running-2m
      expression: >-
        object.metadata.name in
        http.Get('http://prometheus.monitoring.svc:9090/api/v1/query?query=min_over_time%28karta_workload_status%7Bnamespace%3D%22ai-team%22%2Cphase%3D%22Running%22%2Cworkload_kind%3D%22Job%22%7D%5B2m%5D%29%3D%3D1')
        .data.result.map(r, r.metric.workload)
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{op: 'add', path: '/spec/suspend', value: true}]
