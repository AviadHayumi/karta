# Prototype only. The ActionRequest is the queue, the allowance and the
# record in one object: Kyverno creates it (resource.Post from a
# GeneratingPolicy), the Karta executor spends it once. Spec is immutable,
# status is written only by the executor, nothing owns it, so it outlives
# the workload and the policy.
apiVersion: v1
kind: Namespace
metadata:
  name: karta-actions
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: actionrequests.rules.karta.run.ai
spec:
  group: rules.karta.run.ai
  scope: Namespaced
  names:
    kind: ActionRequest
    plural: actionrequests
    singular: actionrequest
    shortNames: [ar]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Target
          type: string
          jsonPath: .spec.target.name
        - name: Action
          type: string
          jsonPath: .spec.action
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "spec is immutable"
              required: [ruleKey, action, target]
              properties:
                ruleKey:
                  type: string
                action:
                  type: string
                  enum: [Suspend]
                target:
                  type: object
                  required: [group, version, kind, namespace, name, uid]
                  properties:
                    group: {type: string}
                    version: {type: string}
                    kind: {type: string}
                    namespace: {type: string}
                    name: {type: string}
                    uid: {type: string}
                    generation: {type: integer}
                policy:
                  type: object
                  properties:
                    name: {type: string}
                    kind: {type: string}
                evidence:
                  type: object
                  properties:
                    query: {type: string}
                    value: {type: string}
                    sampleTime: {type: string}
                    evaluatedAt: {type: string}
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, WouldAct, Intended, Executed, Blocked, Unknown]
                attempts: {type: integer}
                intendedAt: {type: string}
                executedAt: {type: string}
                resumeDetectedAt: {type: string}
                patch: {type: string}
                message: {type: string}
                receipts:
                  type: array
                  items:
                    type: object
                    properties:
                      phase: {type: string}
                      time: {type: string}
                      message: {type: string}
