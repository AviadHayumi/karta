# Demo workloads: two long-running Jobs and one CronJob, all Karta-described
# via the built-in catalog (batch/v1 Job, batch/v1 CronJob).
apiVersion: v1
kind: Namespace
metadata:
  name: ai-team
---
apiVersion: batch/v1
kind: Job
metadata:
  name: trainer-a
  namespace: ai-team
  labels: {team: fox}
spec:
  suspend: false
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: busybox:1.36
          command: ["sh", "-c", "sleep 86400"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: trainer-b
  namespace: ai-team
  labels: {team: fox}
spec:
  suspend: false
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: train
          image: busybox:1.36
          command: ["sh", "-c", "sleep 86400"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: ai-team
  labels: {team: fox}
spec:
  schedule: "0 3 * * *"
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo report done"]
