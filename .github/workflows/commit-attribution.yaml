name: Commit Attribution

on:
  pull_request:
    branches: [main, v0.*]
  push:
    branches: [main, v0.*]

permissions:
  contents: read

jobs:
  commit-attribution:
    name: Commit attribution
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the actual head commit and its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test attribution policy
        run: python3 -B -m unittest discover -s hack -p 'test_check_ai_coauthors.py' -v

      - name: Check incoming commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B hack/check_ai_coauthors.py --base "$BASE_SHA" --head "$HEAD_SHA"
