name: Commit Attribution

on:
  pull_request:
    branches: [main, v0.*]
  push:
    branches: [main, v0.*]

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-attribution:
    name: Commit attribution
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commitlint configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # The action reads one API page of at most 100 commits.
      - name: Reject ranges the action cannot check completely
        run: |
          jq -e 'if has("pull_request") then .pull_request.commits else (.commits | length) end | . > 0 and . <= 100' "$GITHUB_EVENT_PATH" > /dev/null || {
            echo '::error::Commit attribution requires 1-100 incoming commits. Split or squash larger changes before retrying.'
            exit 1
          }

      - name: Check incoming commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: commitlint.config.mjs
          failOnErrors: true
