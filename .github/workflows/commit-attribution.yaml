name: Commit Attribution

on:
  pull_request:
    branches: [main, v0.*]
  push:
    branches: [main, v0.*]

permissions:
  contents: read

jobs:
  commit-attribution:
    name: Commit attribution
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the incoming commit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      - name: Install locked commitlint dependencies
        run: npm ci --prefix .github/commitlint --ignore-scripts --no-audit --no-fund

      - name: Check incoming commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no previous tip; check all its reachable commits.
          if [[ "$BASE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            node .github/commitlint/node_modules/@commitlint/cli/cli.js --config commitlint.config.mjs --to "$HEAD_SHA" --verbose
          else
            node .github/commitlint/node_modules/@commitlint/cli/cli.js --config commitlint.config.mjs --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi
